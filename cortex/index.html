      const t = Math.random() < .5 && regions.length ? regions[(Math.random() * regions.length) | 0].p : nodes[hubs[(Math.random() * hubs.length) | 0]].p;
      const dir = new THREE.Vector3(Math.random() - .5, (Math.random() - .3) * .6, Math.random() - .5).normalize();
      fly = { t: 0, slow: true, fromT: ctl.target.clone(), toT: t.clone(), fromC: camera.position.clone(), toC: t.clone().add(dir.multiplyScalar(110 + Math.random() * 120)) };
      cineNext = now + 9000;
    }
  }

  const en = nGeo.attributes.energy.array, tt = now / 1000;
  for (let i = 0; i < N; i++) if (en[i] > 0) en[i] = Math.max(0, en[i] - .03 * dt);
  for (const i of hot) en[i] = Math.max(en[i], nodes[i].heat * (.3 + .3 * Math.sin(tt * 3 + i)));
  for (let i = 0; i < P; i++) {
    const p = pulses[i];
    if (!p.on) continue;
    p.t += p.v * dt;
    if (p.t >= 1) {
      p.on = false; pPos[i * 3 + 1] = 1e5; en[p.b] = 1;
      if (p.hop < 4 && Math.random() < .7) { launch(p.b, p.hop + 1); if (Math.random() < .35) launch(p.b, p.hop + 1); }
      continue;
    }
    const A = nodes[p.a].p, B = nodes[p.b].p;
    pPos[i * 3] = A.x + (B.x - A.x) * p.t; pPos[i * 3 + 1] = A.y + (B.y - A.y) * p.t; pPos[i * 3 + 2] = A.z + (B.z - A.z) * p.t;
  }
  nGeo.attributes.energy.needsUpdate = true;
  pGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);

  // etiquetas sin encimarse: la primera (o la de mayor rango) gana el espacio
  const boxes = [];
  for (const s of shown) {
    const xy = project(s.p);
    let ok = !!xy;
    if (ok) {
      const w = s.w || (s.w = s.el.offsetWidth + 14), x = xy[0] + 8, y = xy[1] - 8;
      ok = !boxes.some(b => x < b[0] + b[2] && x + w > b[0] && Math.abs(y - b[1]) < 17);
      if (ok) { boxes.push([x, y, w]); s.el.style.transform = `translate(${x}px, ${y}px)`; }
    }
    s.el.style.visibility = ok ? '' : 'hidden';
  }
  if (sel != null) { const xy = project(nodes[sel].p); if (xy) ret.style.transform = `translate(${xy[0]}px, ${xy[1]}px)`; }
}
requestAnimationFrame(frame);
})();
</script>
