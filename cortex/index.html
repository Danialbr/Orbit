  vF = clamp(1.25 - (-mv.z) / 520.0, .18, 1.0); gl_PointSize = size * (1.0 + energy*1.4) * px * (300.0 / -mv.z); gl_Position = projectionMatrix * mv; }`;
// estrella: núcleo + halo + destellos en cruz para las neuronas grandes (look de constelación)
const glowFS = `varying vec3 vC; varying float vE; varying float vF; varying float vS; void main(){ vec2 u = (gl_PointCoord - .5) * 2.0; float d = length(u);
  if (d > 1.0) discard; float core = smoothstep(.3, .0, d); float halo = pow(1.0 - d, 2.6) * .5;
  float spk = (max(0.0, 1.0 - abs(u.y) * 14.0) + max(0.0, 1.0 - abs(u.x) * 14.0)) * (1.0 - d) * smoothstep(6.0, 11.0, vS) * .7;
  vec3 c = mix(vC, vec3(1.0), core*.8 + vE*.6); gl_FragColor = vec4(c * (core + halo + spk) * vF * (1.0 + vE*1.5), 1.0); }`;
const px = { value: renderer.getPixelRatio() };
const mkMat = () => new THREE.ShaderMaterial({ uniforms: { px }, vertexShader: glowVS, fragmentShader: glowFS, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true });

// neuronas: una sola geometría
const nPos = new Float32Array(N * 3), nTint = new Float32Array(N * 3), nSize = new Float32Array(N), nEnergy = new Float32Array(N);
const base = new Float32Array(N * 3);
const tmp = new THREE.Color();
nodes.forEach((n, i) => {
  n.p.toArray(nPos, i * 3);
  tmp.setHex(PAL[n.r % PAL.length]).toArray(base, i * 3);
  nSize[i] = 3.2 + Math.sqrt(n.deg) * 1.9;
});
nTint.set(base);
const nGeo = new THREE.BufferGeometry();
nGeo.setAttribute('position', new THREE.BufferAttribute(nPos, 3));
nGeo.setAttribute('tint', new THREE.BufferAttribute(nTint, 3));
nGeo.setAttribute('size', new THREE.BufferAttribute(nSize, 1));
nGeo.setAttribute('energy', new THREE.BufferAttribute(nEnergy, 1));
const neurons = new THREE.Points(nGeo, mkMat());
scene.add(neurons);

// cielo de estrellas lejano (una sola geometría)
{
  const S = mobile ? 700 : 1600, sp = new Float32Array(S * 3), stt = new Float32Array(S * 3), ss = new Float32Array(S), se = new Float32Array(S);
  for (let i = 0; i < S; i++) {
    const u = Math.random() * 2 - 1, a = Math.random() * Math.PI * 2, R = 450 + Math.random() * 500, q = Math.sqrt(1 - u * u);
    sp[i * 3] = R * q * Math.cos(a); sp[i * 3 + 1] = R * u; sp[i * 3 + 2] = R * q * Math.sin(a);
    const b = .25 + Math.random() * .45; stt[i * 3] = b * .8; stt[i * 3 + 1] = b * .9; stt[i * 3 + 2] = b;
    ss[i] = 2 + Math.random() * 4;
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute('position', new THREE.BufferAttribute(sp, 3)); sg.setAttribute('tint', new THREE.BufferAttribute(stt, 3));
  sg.setAttribute('size', new THREE.BufferAttribute(ss, 1)); sg.setAttribute('energy', new THREE.BufferAttribute(se, 1));
  scene.add(new THREE.Points(sg, mkMat()));
}

// centro de cada región (para sus etiquetas)
const regions = D.r.map((name, r) => {
  const ms = nodes.filter(n => n.r === r); if (ms.length < 4) return null;
  const c = new THREE.Vector3(); ms.forEach(n => c.add(n.p)); c.divideScalar(ms.length);
  return { name, p: c, size: ms.length };
}).filter(Boolean);

// sinapsis: una sola geometría de líneas
const lPos = new Float32Array(L * 6), lCol = new Float32Array(L * 6);
D.l.forEach(([s, t], i) => {
  nodes[s].p.toArray(lPos, i * 6); nodes[t].p.toArray(lPos, i * 6 + 3);
  for (let k = 0; k < 3; k++) { lCol[i * 6 + k] = base[s * 3 + k] * .5; lCol[i * 6 + 3 + k] = base[t * 3 + k] * .5; }
});
const lGeo = new THREE.BufferGeometry();
lGeo.setAttribute('position', new THREE.BufferAttribute(lPos, 3));
lGeo.setAttribute('color', new THREE.BufferAttribute(lCol, 3));
const lMat = new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: .32, blending: THREE.AdditiveBlending, depthWrite: false });
scene.add(new THREE.LineSegments(lGeo, lMat));

// sinapsis activas de la selección
const hGeo = new THREE.BufferGeometry();
const hMat = new THREE.LineBasicMaterial({ color: 0xffc56b, transparent: true, opacity: .85, blending: THREE.AdditiveBlending, depthWrite: false });
const hiLines = new THREE.LineSegments(hGeo, hMat); scene.add(hiLines);

// impulsos eléctricos: un pool fijo
const P = mobile ? 90 : 180;
const pPos = new Float32Array(P * 3), pTint = new Float32Array(P * 3), pSize = new Float32Array(P).fill(mobile ? 5 : 4.2), pEnergy = new Float32Array(P).fill(.6);
for (let i = 0; i < P; i++) { pTint[i * 3] = .75; pTint[i * 3 + 1] = .97; pTint[i * 3 + 2] = 1; pPos[i * 3 + 1] = 1e5; }
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeo.setAttribute('tint', new THREE.BufferAttribute(pTint, 3));
pGeo.setAttribute('size', new THREE.BufferAttribute(pSize, 1));
pGeo.setAttribute('energy', new THREE.BufferAttribute(pEnergy, 1));
scene.add(new THREE.Points(pGeo, mkMat()));
const pulses = Array.from({ length: P }, () => ({ on: false, a: 0, b: 0, t: 0, v: 0, hop: 0 }));
function launch(a, hop) {
  const opts = nb[a]; if (!opts.length) return;
  const p = pulses.find(q => !q.on); if (!p) return;
  Object.assign(p, { on: true, a, b: opts[(Math.random() * opts.length) | 0], t: 0, v: .018 + Math.random() * .02, hop });
}
const hubs = nodes.filter(n => n.deg > 3).map(n => n.id);

// ---------- etiquetas ----------
const labelsEl = document.getElementById('labels');
const ret = document.getElementById('reticle');
const topHubs = [...nodes].sort((a, b) => b.deg - a.deg).slice(0, mobile ? 9 : 18).map(n => n.id);
let shown = [];
function setLabels(ids, selId) {
  labelsEl.textContent = '';
  const mk = (cls, text, p) => { const el = document.createElement('div'); el.className = cls; el.textContent = text; labelsEl.appendChild(el); return { p, el }; };
  shown = [
    ...(selId == null ? regions.map(r => mk('lb rg', r.name, r.p)) : []),
    ...ids.map(id => mk('lb' + (id === selId ? ' sel' : selId != null ? ' nb' : ''),
      nodes[id].label.length > 34 ? nodes[id].label.slice(0, 33) + '…' : nodes[id].label, nodes[id].p)),
  ];
}
setLabels(topHubs, null);
const v = new THREE.Vector3();
function project(p) { v.copy(p).project(camera); return v.z < 1 ? [(v.x + 1) * innerWidth / 2, (1 - v.y) * innerHeight / 2] : null; }

// ---------- selección ----------
let sel = null;
const info = document.getElementById('info');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
let fly = null;
function pick(id) {
  sel = id;
  ctl.autoRotate = !calm && id == null;
  const tint = nGeo.attributes.tint.array;
  if (id == null) {
    tint.set(base); hGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(0), 3));
    lMat.opacity = .32; setLabels(topHubs, null); info.hidden = true; ret.hidden = true;
  } else {
    const near = new Set(nb[id]); near.add(id);
    for (let i = 0; i < N; i++) { const k = near.has(i) ? 1 : .12; for (let j = 0; j < 3; j++) tint[i * 3 + j] = base[i * 3 + j] * k; }
    tint[id * 3] = 1; tint[id * 3 + 1] = .72; tint[id * 3 + 2] = .28;
    const hp = new Float32Array(nb[id].length * 6);
    nb[id].forEach((t, i) => { nodes[id].p.toArray(hp, i * 6); nodes[t].p.toArray(hp, i * 6 + 3); });
    hGeo.setAttribute('position', new THREE.BufferAttribute(hp, 3));
    lMat.opacity = .08;
    const ranked = [...nb[id]].sort((a, b) => nodes[b].deg - nodes[a].deg).slice(0, mobile ? 6 : 12);
    setLabels([id, ...ranked], id);
    const n = nodes[id];
    info.innerHTML = `<button class="x" aria-label="Cerrar">×</button><div class="k">Neurona · ${esc(D.c[n.c] ?? '')}</div><h3>${esc(n.label)}</h3>
      <div class="f">${esc(n.file || '—')} · ${n.deg} sinapsis</div>
      ${[...nb[id]].sort((a, b) => nodes[b].deg - nodes[a].deg).slice(0, 40).map(i => `<span class="n" data-i="${i}">${esc(nodes[i].label)}</span>`).join('')}`;
    info.hidden = false; ret.hidden = false;
    const dir = camera.position.clone().sub(ctl.target).normalize();
    fly = { t: 0, fromT: ctl.target.clone(), toT: n.p.clone(), fromC: camera.position.clone(), toC: n.p.clone().add(dir.multiplyScalar(mobile ? 120 : 95)) };
    for (let k = 0; k < 6; k++) launch(id, 2);
  }
  nGeo.attributes.tint.needsUpdate = true;
}
info.addEventListener('click', e => {
  if (e.target.classList.contains('x')) pick(null);
  else if (e.target.dataset.i) pick(+e.target.dataset.i);
});

// toque: rayo contra los puntos (sin arrastre)
const ray = new THREE.Raycaster(); ray.params.Points.threshold = mobile ? 7 : 4;
let down = null;
renderer.domElement.addEventListener('pointerdown', e => { down = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 8) return;
  ray.setFromCamera({ x: e.clientX / innerWidth * 2 - 1, y: -(e.clientY / innerHeight) * 2 + 1 }, camera);
  const hit = ray.intersectObject(neurons)[0];
  pick(hit ? hit.index : null);
});

const q = document.getElementById('q');
q.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const s = q.value.trim().toLowerCase(); if (!s) return;
  const hit = nodes.filter(n => n.label.toLowerCase().includes(s)).sort((a, b) => b.deg - a.deg)[0];
  if (hit) { pick(hit.id); q.blur(); } else st.innerHTML = `sin coincidencias para <em>${esc(q.value.trim())}</em>`;
});
const home = { c: camera.position.clone(), t: new THREE.Vector3() };
document.getElementById('r').onclick = () => { pick(null); fly = { t: 0, fromT: ctl.target.clone(), toT: home.t.clone(), fromC: camera.position.clone(), toC: home.c.clone() }; };
st.innerHTML = `<em>${N}</em> neuronas · <em>${L}</em> sinapsis · <em>${D.r.length}</em> regiones`;

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

// ---------- bucle ----------
let last = performance.now(), spawn = 0, idleAt = performance.now(), cineNext = 0;
const cineEl = document.getElementById('cine');
const wake = () => { idleAt = performance.now(); if (!cineEl.hidden) { cineEl.hidden = true; if (fly && fly.slow) fly = null; } };
['pointerdown', 'wheel', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, wake, { passive: true }));
st.innerHTML += hot.length ? ` · <em>${hot.length}</em> activas` : '';
const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
function frame(now) {
  requestAnimationFrame(frame);
  if (document.hidden) return;
  const dt = Math.min((now - last) / 16.7, 3); last = now;

  if (fly) {
    fly.t = Math.min(1, fly.t + (fly.slow ? .006 : .022) * dt); const k = ease(fly.t);
    ctl.target.lerpVectors(fly.fromT, fly.toT, k); camera.position.lerpVectors(fly.fromC, fly.toC, k);
    if (fly.t >= 1) fly = null;
  }
  ctl.update();

  // disparos espontáneos; lo que cambió hace poco dispara más
  if (!calm) { spawn += dt; if (spawn > (mobile ? 7 : 4)) { spawn = 0;
    const src = sel ?? (hot.length && Math.random() < .5 ? hot[(Math.random() * hot.length) | 0] : hubs[(Math.random() * hubs.length) | 0]);
    launch(src, 0); } }

  // modo cine tras 10 s sin tocar
  if (!calm && sel == null && now - idleAt > 10000) {
    if (cineEl.hidden) { cineEl.hidden = false; cineNext = 0; }
    if (!fly && now > cineNext) {
      const t = Math.random() < .5 && regions.length ? regions[(Math.random() * regions.length) | 0].p : nodes[hubs[(Math.random() * hubs.length) | 0]].p;
      const dir = new THREE.Vector3(Math.random() - .5, (Math.random() - .3) * .6, Math.random() - .5).normalize();
      fly = { t: 0, slow: true, fromT: ctl.target.clone(), toT: t.clone(), fromC: camera.position.clone(), toC: t.clone().add(dir.multiplyScalar(110 + Math.random() * 120)) };
      cineNext = now + 9000;
    }
  }

  const en = nGeo.attributes.energy.array, tt = now / 1000;
  for (let i = 0; i < N; i++) if (en[i] > 0) en[i] = Math.max(0, en[i] - .03 * dt);
  for (const i of hot) en[i] = Math.max(en[i], nodes[i].heat * (.3 + .3 * Math.sin(tt * 3 + i)));
  for (let i = 0; i < P; i++) {
    const p = pulses[i];
    if (!p.on) continue;
    p.t += p.v * dt;
    if (p.t >= 1) {
      p.on = false; pPos[i * 3 + 1] = 1e5; en[p.b] = 1;
      if (p.hop < 4 && Math.random() < .7) { launch(p.b, p.hop + 1); if (Math.random() < .35) launch(p.b, p.hop + 1); }
      continue;
    }
    const A = nodes[p.a].p, B = nodes[p.b].p;
    pPos[i * 3] = A.x + (B.x - A.x) * p.t; pPos[i * 3 + 1] = A.y + (B.y - A.y) * p.t; pPos[i * 3 + 2] = A.z + (B.z - A.z) * p.t;
  }
  nGeo.attributes.energy.needsUpdate = true;
  pGeo.attributes.position.needsUpdate = true;

  renderer.render(scene, camera);

  // etiquetas sin encimarse: la primera (o la de mayor rango) gana el espacio
  const boxes = [];
  for (const s of shown) {
    const xy = project(s.p);
    let ok = !!xy;
    if (ok) {
      const w = s.w || (s.w = s.el.offsetWidth + 14), x = xy[0] + 8, y = xy[1] - 8;
      ok = !boxes.some(b => x < b[0] + b[2] && x + w > b[0] && Math.abs(y - b[1]) < 17);
      if (ok) { boxes.push([x, y, w]); s.el.style.transform = `translate(${x}px, ${y}px)`; }
    }
    s.el.style.visibility = ok ? '' : 'hidden';
  }
  if (sel != null) { const xy = project(nodes[sel].p); if (xy) ret.style.transform = `translate(${xy[0]}px, ${xy[1]}px)`; }
}
requestAnimationFrame(frame);
})();
</script>
</body></html>
