<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orbit</title>
<meta name="theme-color" content="#080B11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>.top{top:0!important;padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Sora:wght@400;500;600;700&display=swap">
<style>
/* Layout: one phone column, glass header, fixed tab bar. Figures in mono, totals in Sora. Single dark look by design. */
:root{
  --ink:#080B11; --panel:#0E131C; --panel-2:#131A26; --raise:#1A2232;
  --line:rgba(150,175,210,.11); --line-2:rgba(150,175,210,.22);
  --fg:#E9EEF5; --muted:#8693A8; --dim:#5A6577;
  --ion:#46E3C6; --ion-2:#4FA8FF; --ion-ink:#04140F;
  --ok:#3DD68C; --warn:#F2B84B; --bad:#FF6B6B; --reinv:#A08CFF; --idle:#7D8AA0;
  --display:'Sora',ui-sans-serif,-apple-system,system-ui,sans-serif;
  --body:-apple-system,BlinkMacSystemFont,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --r:18px;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--fg)}
body{margin:0;font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(60% 40% at 100% 0%,rgba(70,227,198,.10),transparent 70%),
   radial-gradient(50% 35% at 0% 20%,rgba(79,168,255,.08),transparent 70%),
   linear-gradient(rgba(150,175,210,.035) 1px,transparent 1px) 0 0/28px 28px,
   linear-gradient(90deg,rgba(150,175,210,.035) 1px,transparent 1px) 0 0/28px 28px;
  -webkit-mask-image:linear-gradient(#000 0%,#000 30%,transparent 75%);mask-image:linear-gradient(#000 0%,#000 30%,transparent 75%)}
*{box-sizing:border-box}
[hidden]{display:none!important}
.discreet .priv{display:none!important}
.presenting .top,.presenting .tabs{display:none!important}
.presenting main{padding-top:calc(16px + env(safe-area-inset-top,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ion);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.eyebrow{font:600 10.5px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,11,17,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px}
.top h1{margin:0;font:600 20px/1.15 var(--display);letter-spacing:-.02em;text-wrap:balance}
.top .ttl{flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);color:var(--fg);flex:none}
.iconbtn svg{width:20px;height:20px}
.addbtn{height:38px;padding:0 14px;border-radius:12px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--ion-ink);background:linear-gradient(135deg,var(--ion),var(--ion-2));box-shadow:0 6px 24px -8px rgba(70,227,198,.6)}
.addbtn svg{width:16px;height:16px}

main{padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
section{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px;padding-inline:2px}
.sec-h h2{margin:0;font:600 15px/1.2 var(--display);letter-spacing:-.01em}

.card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{position:relative;overflow:hidden;border:1px solid transparent;
  background:linear-gradient(160deg,#121A27,#0B1018) padding-box,linear-gradient(135deg,rgba(70,227,198,.6),rgba(79,168,255,.18) 45%,rgba(150,175,210,.14)) border-box}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(70,227,198,.18);box-shadow:0 0 0 26px rgba(70,227,198,.03),0 0 0 54px rgba(79,168,255,.025);pointer-events:none}
.big{font:600 34px/1.05 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px}
.big.ion{background:linear-gradient(90deg,var(--ion),var(--ion-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.stat .v{font:500 14.5px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .eyebrow{font-size:9.5px}

.month{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font:600 19px/1 var(--display)}
.ring .c span{font-size:9.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;display:block;margin-top:3px}
.kv{display:flex;justify-content:space-between;gap:12px;padding-block:5px;font-size:13.5px}
.kv .num{font-size:13.5px}

.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
button.row:active{background:var(--panel-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row .r .num{font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor;background:currentColor}
.bar{width:3px;align-self:stretch;border-radius:3px;flex:none;background:currentColor}

.chip{display:inline-flex;align-items:center;gap:5px;font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px;white-space:nowrap}
.s-pagado{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.s-parcial{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.s-atrasado{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.s-pendiente{color:var(--idle);background:color-mix(in srgb,var(--idle) 14%,transparent)}
.s-reinvertido{color:var(--reinv);background:color-mix(in srgb,var(--reinv) 15%,transparent)}
.s-liquidado{color:var(--muted);background:var(--raise)}
.tag{font:600 10px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ion);border:1px solid rgba(70,227,198,.35);padding:3px 6px;border-radius:6px;vertical-align:2px;margin-left:6px}

.split{height:8px;border-radius:8px;background:var(--raise);overflow:hidden;display:flex;margin-top:12px}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:8px;height:8px;box-shadow:none}

.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:42px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--raise);border:1px solid var(--line-2);color:var(--fg)}
.btn svg{width:17px;height:17px}
.btn.pri{background:linear-gradient(135deg,var(--ion),var(--ion-2));color:var(--ion-ink);border:0}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.wide{flex:1}
.seg{display:flex;background:var(--ink);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--raise);color:var(--fg)}
.seg.mini button{padding:5px 7px;font-size:10.5px;letter-spacing:.04em}
.seg.mini button.on.s-pendiente{background:var(--raise);color:var(--fg)}

.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 9.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 12px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:first-child td{border-top:0}
.ar{text-align:right}
table.tight th,table.tight td{padding-inline:8px}table.tight{font-size:12.5px}
tr.tap{cursor:pointer} tr.tap:active td{background:var(--panel-2)}

/* calendar */
.calnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.calnav h2{margin:0;font:600 18px/1 var(--display);text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:12px}
.cal .wd{font:600 10px/1 var(--body);letter-spacing:.1em;color:var(--dim);text-align:center;padding-bottom:4px}
.cal .d{min-height:50px;border-radius:12px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:6px 2px 7px;font:500 12.5px/1 var(--mono)}
.cal .d.out{visibility:hidden}
.cal .d.today{border-color:var(--ion);box-shadow:inset 0 0 0 1px var(--ion)}
.cal .d.sel{background:var(--raise)}
.cal .d.late{border-color:color-mix(in srgb,var(--bad) 60%,transparent);background:color-mix(in srgb,var(--bad) 8%,var(--panel))}
.cal .d.done{background:color-mix(in srgb,var(--ok) 7%,var(--panel))}
.cal .dots{display:flex;gap:3px;flex-wrap:wrap;justify-content:center;max-width:100%}
.cal .dots i{width:6px;height:6px;border-radius:50%;background:currentColor;display:block}
.cal .dots i.p{box-shadow:0 0 0 1.5px var(--panel),0 0 0 2.5px currentColor;width:5px;height:5px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(10,14,21,.82);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:grid;grid-template-columns:repeat(5,1fr);padding-inline:6px}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0 8px;color:var(--dim);font-size:10px;font-weight:600;letter-spacing:.02em}
.tabs svg{width:23px;height:23px}
.tabs button.on{color:var(--ion)}
.tabs button.on svg{filter:drop-shadow(0 0 8px rgba(70,227,198,.55))}

/* sheet */
.sheet{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:rgba(2,4,8,.6);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:fade .2s}
.panel{position:relative;width:100%;max-width:560px;max-height:90vh;overflow:auto;background:linear-gradient(180deg,#141B27,#0E131C);border:1px solid var(--line-2);border-bottom:0;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px));animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line-2);margin:4px auto 12px}
.panel h3{margin:0 0 4px;font:600 19px/1.2 var(--display);letter-spacing:-.02em}
.panel .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label{font:600 10.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:var(--ink);border:1px solid var(--line-2);border-radius:12px;padding:12px;font-size:16px;outline:none;min-height:46px}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--ion)}
.field .hint{font-size:12px;color:var(--dim)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.fund{display:grid;grid-template-columns:minmax(0,1fr) 112px 64px;gap:10px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.fund:first-child{border-top:0}
.fund.two{grid-template-columns:minmax(0,1fr) 84px}
.fund input{width:100%;background:var(--ink);border:1px solid var(--line-2);border-radius:10px;padding:9px 10px;font:500 15px var(--mono);text-align:right;min-height:40px}
.err{color:var(--bad);font-size:13px;min-height:1em}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches label{width:30px;height:30px;border-radius:50%;background:currentColor;cursor:pointer;display:block;position:relative}
.swatches input{position:absolute;opacity:0;inset:0}
.swatches input:checked+span{position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--fg)}
.check{display:flex;align-items:center;gap:10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--ion)}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-radius:14px;border:1px dashed rgba(242,184,75,.4);background:rgba(242,184,75,.06);font-size:13px;color:var(--warn)}
.banner button{color:var(--warn);font-weight:700;font-size:12px;text-decoration:underline}
.empty{text-align:center;padding:28px 18px;color:var(--muted);font-size:14px}
.empty b{display:block;color:var(--fg);font:600 17px/1.3 var(--display);margin-bottom:6px}
.steps{display:flex;flex-direction:column;gap:10px;text-align:left;margin:18px 0}
.steps div{display:flex;gap:12px;align-items:flex-start;font-size:14px;color:var(--fg)}
.steps i{font:600 12px/24px var(--mono);font-style:normal;width:24px;height:24px;flex:none;border-radius:8px;text-align:center;color:var(--ion);border:1px solid rgba(70,227,198,.35)}
#toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);opacity:0;transition:.25s;z-index:60;background:var(--raise);border:1px solid var(--line-2);padding:10px 16px;border-radius:12px;font-size:13.5px;font-weight:600;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:380px){.big{font-size:29px}.stat .v{font-size:13px}.month{grid-template-columns:78px 1fr}.ring{width:78px;height:78px}}
</style>

<div id="app">
  <header class="top"><div class="wrap">
    <button class="iconbtn" id="backBtn" data-act="back" aria-label="Atrás" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <div class="ttl"><div class="eyebrow" id="eyebrow"></div><h1 id="title"></h1></div>
    <div id="topAct"></div>
  </div></header>
  <main class="wrap" id="view"></main>
  <nav class="tabs" aria-label="Secciones"><div class="wrap" id="tabs"></div></nav>
  <div class="sheet" id="sheet" hidden><div class="scrim" data-act="closeSheet"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
  <div id="toast" role="status"></div>
</div>

<script src="jspdf.umd.min.js"></script>
<script>
(()=>{
'use strict';
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const curYM=()=>today().slice(0,7);
const ymOf=s=>String(s).slice(0,7);
function addM(ym,k){let[y,m]=ym.split('-').map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${pad(m)}`}
const dim=(y,m)=>new Date(y,m,0).getDate();
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ymLabel=ym=>{const[y,m]=ym.split('-').map(Number);return `${MES[m-1]} ${y}`};
const ymLong=ym=>{const[y,m]=ym.split('-').map(Number);return `${MESL[m-1]} ${y}`};
const dLong=s=>{const[y,m,d]=s.split('-').map(Number);return `${d} de ${MESL[m-1]} de ${y}`};
const dShort=s=>{const[,m,d]=s.split('-').map(Number);return `${d} ${MES[m-1]}`};
const r2=n=>Math.round(((+n)||0)*100+Number.EPSILON*100)/100;
const USD=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const fmt=n=>USD.format(r2(n));
const pct=n=>`${Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}%`;
const COLORS=['#46E3C6','#4FA8FF','#F2B84B','#FF7A9C','#A08CFF','#7BE07B','#FF9F5A','#5ED0FF','#E9EEF5'];
const STATUS_L={pagado:'Pagado',parcial:'Parcial',atrasado:'Atrasado',pendiente:'Pendiente',reinvertido:'Reinvertido',liquidado:'Liquidado'};
const chip=s=>`<span class="chip s-${s}">${STATUS_L[s]}</span>`;
const maxISO=(a,b)=>a>b?a:b;

/* ============ storage ============ */
const KEY='orbita.db.v1';
const blank=()=>({v:1,investors:[{id:'inv_'+uid(),name:'Yo',rate:0,owner:true,phone:'',note:''}],movements:[],borrowers:[],loans:[],payments:[],payouts:[],settings:{sample:false,lastBackup:null}});
let db, canSave=true;
function load(){
  try{const s=localStorage.getItem(KEY); if(s){db=JSON.parse(s);migrate();return}}catch(e){canSave=false}
  db=window.ORBITA_DEMO?sampleDB():blank();migrate();
}
function migrate(){db.loans.forEach(l=>{l.shares=l.shares||[]});db.settings=db.settings||{}}
function save(){
  if(!canSave)return;
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){canSave=false;toast('No se pudo guardar en este dispositivo')}
}

/* ============ domain ============ */
const inv=id=>db.investors.find(x=>x.id===id);
const bor=id=>db.borrowers.find(x=>x.id===id);
const loanById=id=>db.loans.find(x=>x.id===id);
const borName=l=>bor(l.borrowerId)?.name||'—';
const borColor=l=>bor(l.borrowerId)?.color||COLORS[0];
function dueISO(l,ym){const[y,m]=ym.split('-').map(Number);return `${ym}-${pad(Math.min(+l.payDay,dim(y,m)))}`}
const firstYM=l=>addM(ymOf(l.start),1);
function lastYM(l){
  let end=null;
  if(+l.term>0) end=addM(ymOf(l.start),+l.term);
  if(l.closed){let c=ymOf(l.closed); if(dueISO(l,c)>l.closed) c=addM(c,-1); end=end&&end<c?end:c}
  return end;
}
const hasPeriod=(l,ym)=>{const L=lastYM(l);return ym>=firstYM(l)&&(!L||ym<=L)};
function periods(l,until){const out=[],L=lastYM(l);const lim=L&&L<until?L:until;for(let p=firstYM(l);p<=lim;p=addM(p,1))out.push(p);return out}
const payOf=(id,ym)=>db.payments.find(p=>p.loanId===id&&p.period===ym);
const capBefore=(l,ym)=>db.payments.filter(p=>p.loanId===l.id&&p.period<ym).reduce((s,p)=>s+(+p.capital||0),0);
const outBefore=(l,ym)=>Math.max(0,r2(l.principal-capBefore(l,ym)));
const outNow=l=>l.closed?0:Math.max(0,r2(l.principal-db.payments.filter(p=>p.loanId===l.id).reduce((s,p)=>s+(+p.capital||0),0)));
const expected=(l,ym)=>r2(outBefore(l,ym)*l.rate/100);
function status(l,ym){
  const p=payOf(l.id,ym),due=expected(l,ym),paid=p?+p.interest||0:0;
  if(p&&paid>=due-0.005)return 'pagado';
  if(paid>0)return 'parcial';
  return dueISO(l,ym)<today()?'atrasado':'pendiente';
}
const isLate=(l,ym)=>{const s=status(l,ym);return s==='atrasado'||(s==='parcial'&&dueISO(l,ym)<today())};

function capitalOf(i){return r2(db.movements.filter(m=>m.investorId===i.id).reduce((s,m)=>s+(m.type==='retiro'?-1:1)*(+m.amount||0),0))}
const sliceOf=(l,i)=>l.funding.find(f=>f.investorId===i.id);
const shareOf=(l,i)=>(l.shares||[]).find(x=>x.investorId===i.id);
const sharesRate=l=>(l.shares||[]).reduce((s,x)=>s+(+x.rate||0),0);
const involved=(l,i)=>!!(sliceOf(l,i)||shareOf(l,i));
function invRate(i,l){if(i.owner)return r2(l.rate-sharesRate(l));const f=sliceOf(l,i);return f&&f.rate!=null&&f.rate!==''?+f.rate:+i.rate}
function placedNow(i){return r2(db.loans.reduce((s,l)=>{const f=sliceOf(l,i);return s+(f&&!l.closed&&l.principal?f.amount*outNow(l)/l.principal:0)},0))}
function shareBase(i){return r2(db.loans.reduce((s,l)=>s+(!l.closed&&shareOf(l,i)?outNow(l):0),0))}
function monthlyNow(i){return r2(db.loans.reduce((s,l)=>{if(l.closed||!l.principal)return s;const f=sliceOf(l,i),sh=shareOf(l,i),o=outNow(l);return s+(f?f.amount*o/l.principal*invRate(i,l)/100:0)+(sh?o*sh.rate/100:0)},0))}
function dividend(i,ym){return r2(db.loans.reduce((s,l)=>{if(!hasPeriod(l,ym)||!l.principal)return s;const f=sliceOf(l,i),sh=shareOf(l,i),o=outBefore(l,ym);return s+(f?f.amount*o/l.principal*invRate(i,l)/100:0)+(sh?o*sh.rate/100:0)},0))}
function invPeriods(i,until=curYM()){const set=new Set();db.loans.forEach(l=>{if(involved(l,i))periods(l,until).forEach(p=>set.add(p))});return [...set].sort().filter(p=>dividend(i,p)>0)}
function rateText(i){const set=new Set();db.loans.forEach(l=>{if(l.closed)return;if(sliceOf(l,i))set.add(invRate(i,l));const sh=shareOf(l,i);if(sh)set.add(+sh.rate)});const a=[...set].sort((x,y)=>x-y);if(!a.length)return i.owner?'Interés completo':(+i.rate?pct(i.rate)+' mensual':'Sin tasa');return (a.length>1?pct(a[0])+' a '+pct(a[a.length-1]):pct(a[0]))+' mensual'}
function summary(i){const cap=capitalOf(i),pl=placedNow(i),base=shareBase(i),mo=monthlyNow(i);return {cap,pl,fr:r2(cap-pl),base,mo,partner:cap<=0&&base>0,n:db.loans.filter(l=>!l.closed&&involved(l,i)).length}}
// where a person earns: their money (capital) and their participations (no capital)
function placements(i){const out=[];db.loans.forEach(l=>{if(l.closed||!l.principal)return;const o=outNow(l),f=sliceOf(l,i),sh=shareOf(l,i);
  if(f){const b=f.amount*o/l.principal;out.push({l,kind:'capital',base:b,rate:invRate(i,l),amt:b*invRate(i,l)/100})}
  if(sh)out.push({l,kind:'part',base:o,rate:+sh.rate,amt:o*sh.rate/100})});return out}
function reparto(l){const o=outNow(l),total=o*l.rate/100,parts=[];
  l.funding.forEach(f=>{const i=inv(f.investorId);if(!i||i.owner)return;const b=f.amount*o/l.principal;parts.push({i,kind:'capital',base:b,rate:invRate(i,l),amt:b*invRate(i,l)/100})});
  (l.shares||[]).forEach(x=>{const i=inv(x.investorId);if(!i)return;parts.push({i,kind:'part',base:o,rate:+x.rate,amt:o*x.rate/100})});
  const mine=total-parts.reduce((s,p)=>s+p.amt,0);return {o,total,parts,mine,minePct:o?mine/o*100:0}}
const payoutOf=(i,ym)=>db.payouts.find(p=>p.investorId===i.id&&p.period===ym);
const payoutStatus=(i,ym)=>payoutOf(i,ym)?.status||'pendiente';
const payoutAmt=(i,ym)=>payoutOf(i,ym)?.amount??dividend(i,ym);

const owner=()=>db.investors.find(i=>i.owner);
const deposits=i=>r2(db.movements.filter(m=>m.investorId===i.id&&m.type==='aporte').reduce((s,m)=>s+(+m.amount||0),0));
function monthsRange(){const f=db.loans.map(firstYM).sort()[0];const out=[];if(!f)return out;for(let p=f;p<=curYM();p=addM(p,1))out.push(p);return out}
// what I make in a month: interest collected minus what I owe investors and partners
function myMonth(ym){
  const due=db.loans.filter(l=>hasPeriod(l,ym));
  const expectedM=r2(due.reduce((s,l)=>s+expected(l,ym),0));
  const collected=r2(db.payments.filter(p=>p.period===ym).reduce((s,p)=>s+(+p.interest||0),0));
  const others=r2(db.investors.filter(i=>!i.owner).reduce((s,i)=>s+dividend(i,ym),0));
  const o=owner(),own=o?dividend(o,ym):0,est=r2(expectedM-others);
  return {ym,expectedM,collected,others,own,margin:r2(est-own),est,real:r2(collected-others),current:ym===curYM()};
}
function myHistory(){let acc=0;return monthsRange().map(p=>{const m=myMonth(p);const v=m.current?m.est:m.real;if(!m.current)acc+=m.real;m.value=v;m.acc=r2(acc);return m})}
function invHistory(i){let acc=0;return invPeriods(i).map(p=>{const a=payoutAmt(i,p);acc+=a;return {p,a,acc:r2(acc),st:payoutStatus(i,p),current:p===curYM()}})}
function portfolio(){const act=db.loans.filter(l=>!l.closed);const lent=r2(act.reduce((s,l)=>s+outNow(l),0)),interest=r2(act.reduce((s,l)=>s+outNow(l)*l.rate/100,0));
  const others=r2(act.reduce((s,l)=>{const R=reparto(l);return s+R.parts.reduce((a,p)=>a+p.amt,0)},0));
  return {lent,interest,others,mine:r2(interest-others),n:act.length,clients:new Set(act.map(l=>l.borrowerId)).size,avg:lent?interest/lent*100:0}}
function totals(ym=curYM()){
  const active=db.loans.filter(l=>!l.closed);
  const capital=r2(db.investors.reduce((s,i)=>s+capitalOf(i),0));
  const lent=r2(active.reduce((s,l)=>s+outNow(l),0));
  const due=db.loans.filter(l=>hasPeriod(l,ym));
  const expectedM=r2(due.reduce((s,l)=>s+expected(l,ym),0));
  const collected=r2(due.reduce((s,l)=>s+(+payOf(l.id,ym)?.interest||0),0));
  const divOthers=r2(db.investors.filter(i=>!i.owner).reduce((s,i)=>s+dividend(i,ym),0));
  return {capital,lent,free:r2(capital-lent),expectedM,collected,divOthers,profit:r2(expectedM-divOthers),active:active.length};
}
function lateItems(){const out=[];db.loans.forEach(l=>periods(l,curYM()).forEach(p=>{if(isLate(l,p))out.push({l,p})}));return out.sort((a,b)=>dueISO(a.l,a.p)<dueISO(b.l,b.p)?-1:1)}
function monthItems(ym){return db.loans.filter(l=>hasPeriod(l,ym)).map(l=>({l,p:ym,due:dueISO(l,ym)})).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:borName(a.l).localeCompare(borName(b.l)))}

  else if(v&&v.type==='profit')out=viewProfit();
  else if(v&&v.type==='loan')out=viewLoan(v.id);

function niceStep(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
// single-series monthly bars; tap a bar to read its value
function barsSVG(items,cap){
  if(!items.length)return '';
  const W=340,H=150,pl=40,pr=6,pt=18,pb=22,iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(...items.map(x=>x.value),0),step=niceStep(max/3)||1,top=Math.max(step,Math.ceil(max/step)*step);
  const slot=iw/items.length,bw=Math.min(22,slot*.62),y=v=>pt+ih-(Math.max(0,v)/top)*ih;
  const last=items.length-1,mi=items.reduce((b,x,k)=>x.value>items[b].value?k:b,0);
  let g='';for(let v=0;v<=top+1e-9;v+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(150,175,210,${v?'.10':'.28'})"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9" fill="#5A6577" font-family="var(--mono)">${v>=1000?'$'+(v/1000).toLocaleString('en-US',{maximumFractionDigits:1})+'k':'$'+v}</text>`}
  const bars=items.map((x,k)=>{const cx=pl+slot*k+slot/2,yy=y(x.value),hgt=pt+ih-yy,r=Math.min(4,hgt);
    const lbl=(k===last||k===mi)&&x.value>0?`<text x="${cx}" y="${yy-5}" text-anchor="middle" font-size="9.5" fill="#E9EEF5" font-family="var(--mono)">${fmt(x.value).replace('.00','')}</text>`:'';
    return `<g data-act="bar" data-v="${h(x.label+' · '+fmt(x.value)+(x.est?' (estimado)':''))}" data-cap="${cap}" style="cursor:pointer"><rect x="${pl+slot*k}" y="${pt}" width="${slot}" height="${ih}" fill="transparent"/>
      ${hgt>0?`<path d="M${cx-bw/2},${pt+ih} V${yy+r} Q${cx-bw/2},${yy} ${cx-bw/2+r},${yy} H${cx+bw/2-r} Q${cx+bw/2},${yy} ${cx+bw/2},${yy+r} V${pt+ih} Z" fill="${x.est?'rgba(70,227,198,.28)':'url(#bg)'}" ${x.est?'stroke="#46E3C6" stroke-dasharray="3 2"':''}/>`:''}${lbl}
      <text x="${cx}" y="${H-6}" text-anchor="middle" font-size="9" fill="#8693A8">${x.short}</text></g>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Gráfica mensual"><defs><linearGradient id="bg" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#4FA8FF"/><stop offset="1" stop-color="#46E3C6"/></linearGradient></defs>${g}${bars}</svg>
  <div class="muted" id="${cap}" style="font-size:12px;min-height:16px;margin-top:4px">Toca una barra para ver el monto</div>`;
}

function viewCal(){
  const ym=ui.calYM,[y,m]=ym.split('-').map(Number),items=monthItems(ym);
  const first=new Date(y,m-1,1),lead=(first.getDay()+6)%7,n=dim(y,m);
  const byDay={};items.forEach(x=>{const d=+x.due.slice(8);(byDay[d]=byDay[d]||[]).push(x)});
  let cells=['L','M','X','J','V','S','D'].map(d=>`<div class="wd">${d}</div>`).join('');
  for(let i=0;i<lead;i++)cells+='<div class="d out"></div>';
  for(let d=1;d<=n;d++){
    const list=byDay[d]||[],dIso=`${ym}-${pad(d)}`,sts=list.map(x=>status(x.l,x.p));
    const cls=[dIso===today()?'today':'',ui.calDay===d?'sel':'',sts.some((s,k)=>isLate(list[k].l,list[k].p))?'late':'',list.length&&sts.every(s=>s==='pagado')?'done':''].join(' ');
    cells+=`<button class="d ${cls}" data-act="calDay" data-v="${d}" aria-label="${d} ${MESL[m-1]}${list.length?', '+list.length+' cobros':''}"><span>${d}</span><span class="dots">${list.slice(0,4).map((x,k)=>`<i class="${sts[k]==='pagado'?'':'p'}" style="color:${borColor(x.l)}"></i>`).join('')}</span></button>`;
  }
  const exp=r2(items.reduce((s,x)=>s+expected(x.l,x.p),0)),col=r2(items.reduce((s,x)=>s+(+payOf(x.l.id,x.p)?.interest||0),0));
  const shown=ui.calDay?items.filter(x=>+x.due.slice(8)===ui.calDay):items;
  const bors=[...new Map(items.map(x=>[x.l.borrowerId,x.l])).values()];
  return {eyebrow:'Días de cobro',title:'Calendario',html:`
  <div class="card">
    <div class="calnav"><button class="iconbtn" data-act="calMove" data-v="-1" aria-label="Mes anterior">${ico('chevL')}</button><h2>${ymLong(ym)}</h2><button class="iconbtn" data-act="calMove" data-v="1" aria-label="Mes siguiente">${ico('chevR')}</button></div>
    <div class="cal">${cells}</div>
    ${bors.length?`<div class="legend" style="margin-top:12px">${bors.map(l=>{const rates=[...new Set(items.filter(x=>x.l.borrowerId===l.borrowerId).map(x=>pct(x.l.rate)))].join(' / ');return `<span><i class="dot" style="color:${borColor(l)}"></i>${h(borName(l))}<span class="priv"> · ${rates}</span></span>`}).join('')}</div>`:''}
    <div class="legend"><span>● cobrado</span><span>○ por cobrar</span><span style="color:var(--bad)">▢ atrasado</span></div>
  </div>
  <div class="stats card" style="margin-top:0">
    <div class="stat"><div class="eyebrow">Esperado</div><div class="v">${fmt(exp)}</div></div>
    <div class="stat"><div class="eyebrow">Cobrado</div><div class="v" style="color:var(--ok)">${fmt(col)}</div></div>
    <div class="stat"><div class="eyebrow">Falta</div><div class="v">${fmt(Math.max(0,exp-col))}</div></div>
  </div>
  <section><div class="sec-h"><h2>${ui.calDay?`${ui.calDay} de ${MESL[m-1]}`:'Todos los cobros del mes'}</h2>${ui.calDay?`<button class="muted" style="font-size:13px" data-act="calDay" data-v="0">Ver todo</button>`:''}</div>
  ${shown.length?`<div class="list">${shown.map(x=>itemRow(x.l,x.p)).join('')}</div>`:`<div class="list"><div class="empty">Sin cobros ${ui.calDay?'este día':'este mes'}.</div></div>`}</section>`};
}

function invChart(i,S,cap){
  const Hs=invHistory(i);if(!Hs.length)return '';const acc=Hs[Hs.length-1].acc,dep=deposits(i),closed=Hs.filter(x=>!x.current);
  const avg=closed.length?closed.reduce((s,x)=>s+x.a,0)/closed.length:0;
  return `<section><div class="sec-h"><h2>Rendimiento mensual</h2></div><div class="card">
    <div class="stats" style="margin-top:0;margin-bottom:12px">
      <div class="stat"><div class="eyebrow">Total generado</div><div class="v" style="color:var(--ion)">${fmt(acc)}</div></div>
      <div class="stat"><div class="eyebrow">${dep?'ROI acumulado':'Promedio/mes'}</div><div class="v">${dep?pct(r2(acc/dep*100)):fmt(avg)}</div></div>
      <div class="stat"><div class="eyebrow">${dep?'ROI mensual':'Meses'}</div><div class="v">${dep?pct(r2(avg/dep*100)):closed.length}</div></div>
    </div>
    ${barsSVG(Hs.map(x=>({label:ymLabel(x.p),short:shortM(x.p),value:x.a,est:x.current})),cap)}</div></section>`;

function heroFor(i,S){

/* ============ sheets ============ */
function openSheet(html){$('#sheetBody').innerHTML=html;$('#sheet').hidden=false;document.body.style.overflow='hidden';const f=$('#sheetBody input:not([type=hidden]):not([type=radio]):not([readonly])');if(f&&!('ontouchstart' in window))f.focus()}
function closeSheet(){$('#sheet').hidden=true;$('#sheetBody').innerHTML='';document.body.style.overflow=''}
const fld=(label,inner,hint='')=>`<div class="field"><label>${label}</label>${inner}${hint?`<div class="hint">${hint}</div>`:''}</div>`;
const money=(id,val='',extra='')=>`<input id="${id}" name="${id}" inputmode="decimal" type="text" value="${val===''?'':r2(val)}" placeholder="0.00" ${extra}>`;
const num=v=>{const n=parseFloat(String(v).replace(/[$,\s]/g,''));return isFinite(n)?n:0};

function sheetPay(lid,p){

  <div class="sub">Vence el ${dLong(dueISO(l,p))} · ${pct(l.rate)} sobre ${fmt(outBefore(l,p))} ${chip(st)}</div>

    <div class="err" id="err"></div>
    <div class="btns"><button class="btn pri wide" type="submit">Guardar</button>${pay?`<button type="button" class="btn danger" data-act="delPay" data-id="${pay.id}" data-confirm="1">Borrar</button>`:''}</div>
  </form>`);

function sheetLoan(id){
  const l=id?loanById(id):null,invs=db.investors,others=invs.filter(i=>!i.owner);
  const avail=i=>r2(capitalOf(i)-placedNow(i)+(l&&!l.closed&&sliceOf(l,i)?sliceOf(l,i).amount*outNow(l)/l.principal:0));
  const fr=i=>{const f=l&&sliceOf(l,i);return f&&f.rate!=null&&f.rate!==''?f.rate:''};
  openSheet(`<h3>${l?'Editar préstamo':'Nuevo préstamo'}</h3><div class="sub">Interés simple mensual sobre el capital pendiente.</div>
  <form data-form="loan" data-id="${l?.id||''}">
    ${fld('Cliente',`<select id="borrower" name="borrower">${db.borrowers.map(b=>`<option value="${b.id}" ${l?.borrowerId===b.id?'selected':''}>${h(b.name)}</option>`).join('')}<option value="__new" ${!db.borrowers.length?'selected':''}>+ Nuevo cliente…</option></select>`)}
    <div class="field" id="newBorWrap" ${db.borrowers.length?'hidden':''}><label>Nombre del cliente</label><input id="newBor" name="newBor" placeholder="Ej. Tony"></div>
    <div class="grid2">${fld('Monto prestado',money('principal',l?l.principal:''))}${fld('Tasa del cliente %',`<input id="rate" name="rate" inputmode="decimal" value="${l?l.rate:''}" placeholder="4">`)}</div>

      ${invs.map(i=>`<div class="fund"><div style="min-width:0"><div style="font-weight:600;font-size:14px">${h(i.name)}${i.owner?'<span class="tag">Tú</span>':''}</div><div class="hint">Disponible ${fmt(avail(i))}</div></div><input data-fund="${i.id}" inputmode="decimal" value="${l&&sliceOf(l,i)?r2(sliceOf(l,i).amount):''}" placeholder="0.00" aria-label="Monto de ${h(i.name)}">${i.owner?'<span class="hint" style="text-align:center">resto</span>':`<input data-frate="${i.id}" inputmode="decimal" value="${fr(i)}" placeholder="${+i.rate?i.rate:'%'}" aria-label="Porcentaje para ${h(i.name)}">`}</div>`).join('')}
    </div><div class="hint" id="fundHint"></div></div>
    ${others.length?`<div class="field"><label>Socios sin capital · % del préstamo</label><div class="list">
      ${others.map(i=>`<div class="fund two"><div style="min-width:0"><div style="font-weight:600;font-size:14px">${h(i.name)}</div><div class="hint">Cobra sin poner dinero</div></div><input data-share="${i.id}" inputmode="decimal" value="${l&&shareOf(l,i)?shareOf(l,i).rate:''}" placeholder="%" aria-label="Participación de ${h(i.name)}"></div>`).join('')}
    </div><div class="hint">Ejemplo: tu mamá 1%. Para agregar a alguien nuevo, créalo en Inversionistas sin aporte.</div></div>`:''}
    <div class="card" id="splitHint" style="padding:12px;font-size:13px"></div>
    ${fld('Nota',`<input id="lnote" name="note" value="${h(l?.note||'')}" placeholder="Opcional">`)}
    <div class="err" id="err"></div>
    <button class="btn pri" type="submit">${l?'Guardar cambios':'Crear préstamo'}</button>
  </form>`);
  fundHint();
}
function fundHint(){
  const f=$('form[data-form=loan]');if(!f)return;
  const p=num(f.principal.value),rate=num(f.rate.value),rows=[...f.querySelectorAll('[data-fund]')];
  const sum=rows.reduce((s,x)=>s+num(x.value),0),d=r2(p-sum);
  $('#fundHint').innerHTML=!p?'Asigna el monto entre los inversionistas.':d===0?'<span style="color:var(--ok)">Monto completo asignado ✓</span>':d>0?`Falta asignar <b class="num">${fmt(d)}</b> · <button type="button" style="color:var(--ion);font-weight:600" data-act="fundRest">Asignar a mí</button>`:`<span style="color:var(--bad)">Te pasaste por ${fmt(-d)}</span>`;
  if(!p||!rate){$('#splitHint').innerHTML='<span class="muted">Escribe monto y tasa para ver el reparto.</span>';return}
  const total=p*rate/100,lines=[];let paid=0;
  rows.forEach(x=>{const i=inv(x.dataset.fund),a=num(x.value);if(!a||i.owner)return;const rIn=f.querySelector(`[data-frate="${i.id}"]`),r=rIn&&rIn.value!==''?num(rIn.value):+i.rate,amt=a*r/100;paid+=amt;lines.push([i.name,`${pct(r)} sobre ${fmt(a)}`,amt])});
  f.querySelectorAll('[data-share]').forEach(x=>{const r=num(x.value);if(!r)return;const i=inv(x.dataset.share),amt=p*r/100;paid+=amt;lines.push([i.name,`${pct(r)} del préstamo`,amt])});
  const mine=total-paid;
  $('#splitHint').innerHTML=`<div class="kv"><span>Cliente paga ${pct(rate)}</span><span class="num">${fmt(total)}/mes</span></div>${lines.map(([n,t,a])=>`<div class="kv"><span class="muted">${h(n)} · ${t}</span><span class="num">−${fmt(a)}</span></div>`).join('')}<div class="kv" style="border-top:1px solid var(--line);margin-top:4px;padding-top:8px"><b>Te queda · ${pct(r2(mine/p*100))}</b><span class="num" style="font-weight:600;color:${mine<0?'var(--bad)':'var(--ion)'}">${fmt(mine)}/mes</span></div>`;
}

function sheetInv(id){
  const i=id?inv(id):null;

function sheetMove(id,type){
  const i=inv(id),free=r2(capitalOf(i)-placedNow(i));
  openSheet(`<h3>${type==='aporte'?'Aporte de capital':'Retiro de capital'}</h3><div class="sub">${h(i.name)} · en espera ${fmt(free)}</div>
  <form data-form="move" data-id="${id}" data-v="${type}">
    <div class="grid2">${fld('Monto',money('amount'))}${fld('Fecha',`<input id="mdate" name="date" type="date" value="${today()}">`)}</div>
    ${fld('Nota',`<input id="mnote" name="note" placeholder="Opcional">`)}
    <div class="err" id="err"></div>
    <button class="btn pri" type="submit">Registrar</button>
  </form>`);
}
function sheetBor(id){
  const b=bor(id),used=db.loans.some(l=>l.borrowerId===id);
  openSheet(`<h3>Cliente</h3><div class="sub">El color identifica sus cobros en el calendario.</div>
  <form data-form="bor" data-id="${id}">
    ${fld('Nombre',`<input id="bname" name="name" value="${h(b.name)}" required>`)}
    ${fld('Teléfono',`<input id="bphone" name="phone" inputmode="tel" value="${h(b.phone||'')}" placeholder="Opcional">`)}
    <div class="field"><label>Color</label><div class="swatches">${COLORS.map((c,k)=>`<label style="color:${c}"><input type="radio" name="color" value="${c}" ${b.color===c?'checked':''} aria-label="Color ${k+1}"><span></span></label>`).join('')}</div></div>
    ${fld('Nota',`<input id="bnote" name="note" value="${h(b.note||'')}" placeholder="Opcional">`)}
    <div class="btns"><button class="btn pri wide" type="submit">Guardar</button>${used?'':`<button type="button" class="btn danger" data-act="delBor" data-id="${id}" data-confirm="1">Eliminar</button>`}</div>
  </form>`);
}
function sheetClose(id){
  const l=loanById(id);
  if(l.closed){l.closed=null;save();render();toast('Préstamo reabierto');return}
  openSheet(`<h3>Liquidar préstamo</h3><div class="sub">${h(borName(l))} devuelve ${fmt(outNow(l))}. El capital vuelve a “en espera” para cada inversionista.</div>
  <form data-form="close" data-id="${id}">
    ${fld('Fecha de liquidación',`<input id="cdate" name="date" type="date" value="${today()}">`,'Registra antes el interés del último mes si lo cobraste.')}
    <button class="btn pri" type="submit">Liquidar</button>
  </form>`);
}

/* ============ actions ============ */
function setPayout(id,p,st){
  const i=inv(id),ex=payoutOf(i,p);
  if(ex){db.movements=db.movements.filter(m=>m.payoutId!==ex.id);db.payouts=db.payouts.filter(x=>x!==ex)}
  if(st!=='pendiente'){
    const amount=dividend(i,p),pid=uid();
    db.payouts.push({id:pid,investorId:id,period:p,amount,status:st,date:today()});
    if(st==='reinvertido')db.movements.push({id:uid(),investorId:id,type:'reinversion',amount,date:today(),note:'Rendimiento '+ymLabel(p),payoutId:pid});
  }
  save();render();toast(st==='reinvertido'?'Sumado a su capital':st==='pagado'?'Marcado como pagado':'Marcado pendiente');
}

const ACTIONS={
  tab:e=>go(e.dataset.v), back, closeSheet,
  goInv:()=>go('inv'),
  openLoan:e=>push({type:'loan',id:e.dataset.id}),
  openInv:e=>push({type:'inv',id:e.dataset.id}),
  pay:e=>sheetPay(e.dataset.l,e.dataset.p),
  fillFull:e=>{const f=$('form[data-form=pay]');f.interest.value=r2(e.dataset.v)},
  delPay:e=>{db.payments=db.payments.filter(p=>p.id!==e.dataset.id);save();closeSheet();render();toast('Registro borrado')},
  newLoan:()=>{if(!db.investors.length){toast('Agrega un inversionista primero');return}sheetLoan()},
  editLoan:e=>sheetLoan(e.dataset.id),
  closeLoan:e=>sheetClose(e.dataset.id),
  delLoan:e=>{const id=e.dataset.id;db.loans=db.loans.filter(l=>l.id!==id);db.payments=db.payments.filter(p=>p.loanId!==id);save();back();toast('Préstamo eliminado')},
  fundRest:()=>{const f=$('form[data-form=loan]'),o=db.investors.find(i=>i.owner)||db.investors[0];const x=f.querySelector(`[data-fund="${o.id}"]`);const sum=[...f.querySelectorAll('[data-fund]')].reduce((s,y)=>s+num(y.value),0);x.value=r2(num(x.value)+num(f.principal.value)-sum);fundHint()},
  newInv:()=>sheetInv(), editInv:e=>sheetInv(e.dataset.id),
  delInv:e=>{const id=e.dataset.id;if(db.loans.some(l=>l.funding.some(f=>f.investorId===id))){toast('Tiene préstamos asignados');return}db.investors=db.investors.filter(i=>i.id!==id);db.movements=db.movements.filter(m=>m.investorId!==id);db.payouts=db.payouts.filter(p=>p.investorId!==id);save();back();toast('Inversionista eliminado')},
  move:e=>sheetMove(e.dataset.id,e.dataset.v),
  delMove:e=>{db.movements=db.movements.filter(m=>m.id!==e.dataset.id);save();render();toast('Movimiento eliminado')},
  payout:e=>setPayout(e.dataset.id,e.dataset.p,e.dataset.v),
  editBor:e=>sheetBor(e.dataset.id),
  delBor:e=>{db.borrowers=db.borrowers.filter(b=>b.id!==e.dataset.id);save();closeSheet();render()},
  calMove:e=>{ui.calYM=addM(ui.calYM,+e.dataset.v);ui.calDay=null;render()},
  calDay:e=>{const d=+e.dataset.v;ui.calDay=d&&ui.calDay!==d?d:null;render()},
  loanFilter:e=>{ui.loanFilter=e.dataset.v;render()},
  pdf:e=>exportPDF(inv(e.dataset.id)),
  adminPdf:()=>exportAdminPDF(),
  profit:()=>push({type:'profit'}),
  bar:e=>{const c=document.getElementById(e.dataset.cap);if(c){c.textContent=e.dataset.v;c.style.color='var(--fg)'}},
  present:e=>push({type:'present',id:e.dataset.id}),
  discreet:()=>{db.settings.discreet=!db.settings.discreet;save();render();toast(db.settings.discreet?'Ganancias ocultas':'Ganancias visibles')},
  backup:()=>{const name=`orbit-respaldo-${today()}.json`;db.settings.lastBackup=new Date().toISOString();save();shareFile(new Blob([JSON.stringify(db,null,1)],{type:'application/json'}),name);render()},
  restore:()=>$('#restoreFile').click(),
  loadSample:()=>{db=sampleDB();save();go('home');toast('Ejemplo cargado')},
  clearSample:()=>{db=blank();save();go('home')},
  wipe:()=>{db=blank();save();go('home');toast('Datos borrados')}
};

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  if(el.dataset.confirm&&!el.classList.contains('armed')){
    ev.preventDefault();el.classList.add('btn','armed');el.dataset.label=el.innerHTML;el.textContent='¿Seguro? Toca otra vez';
    clearTimeout(el._t);el._t=setTimeout(()=>{el.classList.remove('armed');el.innerHTML=el.dataset.label},3500);return;
  }
  const fn=ACTIONS[el.dataset.act];if(fn){ev.preventDefault();fn(el)}
});
document.addEventListener('change',ev=>{
  if(ev.target.id==='borrower'){$('#newBorWrap').hidden=ev.target.value!=='__new'}
  if(ev.target.id==='restoreFile'){const file=ev.target.files[0];if(!file)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);if(!Array.isArray(d.loans)||!Array.isArray(d.investors))throw 0;d.payouts=d.payouts||[];d.movements=d.movements||[];d.payments=d.payments||[];d.borrowers=d.borrowers||[];d.settings=d.settings||{};db=d;migrate();save();go('home');toast('Respaldo importado')}catch(e){toast('Ese archivo no es un respaldo de Orbit')}};rd.readAsText(file);ev.target.value=''}
});
document.addEventListener('input',ev=>{if(ev.target.closest('form[data-form=loan]'))fundHint()});
document.addEventListener('keydown',ev=>{if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

document.addEventListener('submit',ev=>{
  const f=ev.target;ev.preventDefault();const err=m=>{f.querySelector('.err').textContent=m};
  const k=f.dataset.form;
  if(k==='pay'){
    const l=loanById(f.dataset.l),p=f.dataset.p,interest=r2(num(f.interest.value)),capital=r2(num(f.capital.value));
    if(capital>outBefore(l,p)+0.005)return err('El abono es mayor que el capital pendiente.');
    let pay=payOf(l.id,p);if(!pay){pay={id:uid(),loanId:l.id,period:p};db.payments.push(pay)}
    Object.assign(pay,{interest,capital,date:f.date.value||today(),note:f.note.value.trim()});
    let msg='Cobro guardado';
    if(!l.closed&&outNow(l)<=0){l.closed=maxISO(pay.date,dueISO(l,p));msg='Préstamo liquidado'}
    save();closeSheet();render();toast(msg);return;
  }
  if(k==='loan'){
    const principal=r2(num(f.principal.value)),rate=num(f.rate.value),payDay=parseInt(f.payDay.value,10),term=parseInt(f.term.value,10)||0;
    if(principal<=0)return err('Escribe el monto prestado.');
    if(rate<=0)return err('Escribe la tasa mensual.');
    if(!(payDay>=1&&payDay<=31))return err('El día de cobro va de 1 a 31.');
    if(!f.start.value)return err('Elige la fecha de inicio.');
    const funding=[...f.querySelectorAll('[data-fund]')].map(x=>{const ri=f.querySelector(`[data-frate="${x.dataset.fund}"]`);return {investorId:x.dataset.fund,amount:r2(num(x.value)),rate:ri&&ri.value.trim()!==''?num(ri.value):null}}).filter(x=>x.amount>0);
    const shares=[...f.querySelectorAll('[data-share]')].map(x=>({investorId:x.dataset.share,rate:num(x.value)})).filter(x=>x.rate>0);
    const sum=r2(funding.reduce((s,x)=>s+x.amount,0));
    if(Math.abs(sum-principal)>0.009)return err(`Lo asignado (${fmt(sum)}) debe sumar ${fmt(principal)}.`);
    let bid=f.borrower.value;
    if(bid==='__new'){const n=f.newBor.value.trim();if(!n)return err('Escribe el nombre del cliente.');const b={id:'b_'+uid(),name:n,phone:'',color:COLORS[db.borrowers.length%COLORS.length],note:''};db.borrowers.push(b);bid=b.id}
    const data={borrowerId:bid,principal,rate,payDay,start:f.start.value,term,funding,shares,note:f.note.value.trim()};
    let l=f.dataset.id?loanById(f.dataset.id):null;
    if(l)Object.assign(l,data);else{l={id:'l_'+uid(),closed:null,...data};db.loans.push(l)}
    save();closeSheet();if(!f.dataset.id){ui.tab='loans';ui.stack=[{type:'loan',id:l.id}]}render();toast(f.dataset.id?'Cambios guardados':'Préstamo creado');return;
  }
  if(k==='inv'){
    const name=f.name.value.trim();if(!name)return err('Escribe el nombre.');
    let i=f.dataset.id?inv(f.dataset.id):null;
    const rate=f.rate?num(f.rate.value):0;
    if(i)Object.assign(i,{name,rate:i.owner?0:rate,phone:f.phone.value.trim(),note:f.note.value.trim()});
    else{i={id:'inv_'+uid(),name,rate,owner:false,phone:f.phone.value.trim(),note:f.note.value.trim()};db.investors.push(i);
      const a=r2(num(f.amount.value));if(a>0)db.movements.push({id:uid(),investorId:i.id,type:'aporte',amount:a,date:f.date.value||today(),note:'Aporte inicial'});
      ui.tab='inv';ui.stack=[{type:'inv',id:i.id}];}
    save();closeSheet();render();toast('Guardado');return;
  }
  if(k==='move'){
    const a=r2(num(f.amount.value));if(a<=0)return err('Escribe el monto.');
    db.movements.push({id:uid(),investorId:f.dataset.id,type:f.dataset.v,amount:a,date:f.date.value||today(),note:f.note.value.trim()});
    save();closeSheet();render();toast(f.dataset.v==='aporte'?'Aporte registrado':'Retiro registrado');return;
  }
  if(k==='bor'){
    const b=bor(f.dataset.id);Object.assign(b,{name:f.name.value.trim()||b.name,phone:f.phone.value.trim(),note:f.note.value.trim(),color:(f.querySelector('input[name=color]:checked')||{}).value||b.color});
    save();closeSheet();render();return;
  }
  if(k==='close'){const l=loanById(f.dataset.id);l.closed=f.date.value||today();save();closeSheet();render();toast('Préstamo liquidado')}
});

let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),2200)}

/* ============ files ============ */
function shareFile(blob,name){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).catch(e=>{if(e&&e.name!=='AbortError')download(blob,name)});return;
  }
  download(blob,name);
}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}

/* ============ PDF ============ */
function pdfKit(headerRight){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'letter'});
  const W=612,H=792,M=44;
  const C={ink:[9,12,18],ion:[22,178,150],ionL:[70,227,198],blue:[79,168,255],fg:[17,22,30],muted:[112,122,138],faint:[165,173,186],line:[226,230,236],soft:[245,247,250],ok:[20,150,105],reinv:[110,90,220],bad:[210,70,70]};
  const k={doc,W,H,M,C,y:0};
  k.col=c=>doc.setTextColor(...c);k.fill=c=>doc.setFillColor(...c);k.draw=c=>doc.setDrawColor(...c);
  k.font=(sz,w='normal')=>{doc.setFont('helvetica',w);doc.setFontSize(sz)};
  k.T=(s,x,yy,o={})=>doc.text(String(s),x,yy,o);
  k.label=(s,x,yy,o={})=>{k.font(7.5,'bold');k.col(C.muted);k.T(s.toUpperCase(),x,yy,{charSpace:1.3,...o})};
  k.band=(full,title,sub,tag)=>{
    k.fill(C.ink);doc.rect(0,0,W,full?128:34,'F');
    if(full){k.draw([24,31,44]);doc.setLineWidth(.4);for(let x=0;x<W;x+=22)doc.line(x,0,x,128);for(let yy=0;yy<128;yy+=22)doc.line(0,yy,W,yy)}
    const by=full?128:34;for(let j=0;j<80;j++){const t=j/79;k.fill([0,1,2].map(n=>C.ionL[n]+(C.blue[n]-C.ionL[n])*t));doc.rect(j*W/80,by,W/80+.6,2.5,'F')}
    const lx=M+11,ly=full?38:17;k.draw(C.ionL);doc.setLineWidth(1.1);doc.ellipse(lx,ly,11,4.4,'S');k.fill(C.ionL);doc.circle(lx,ly,3.6,'F');k.fill(C.blue);doc.circle(lx+10,ly-2.5,1.4,'F');
    k.font(8,'bold');k.col(C.ionL);k.T('ORBIT  ·  CAPITAL PRIVADO',M+30,ly+3,{charSpace:1.6});
    k.font(8);k.col([150,162,182]);k.T(full?'Generado el '+dLong(today()):headerRight,W-M,ly+3,{align:'right'});
    if(full){k.font(26,'bold');k.col([255,255,255]);k.T(title,M,86);k.font(10);k.col([150,162,182]);k.T(sub,M,106);k.font(8,'bold');k.col(C.ionL);k.T(tag.toUpperCase(),W-M,106,{align:'right',charSpace:1.2})}
  };
  k.ensure=need=>{if(k.y+need>H-58){doc.addPage();k.band(false);k.y=70}};
  // big number panel: headline + up to 4 small stats
  k.panel=(lbl,val,stats)=>{
    const y=k.y;k.fill(C.soft);doc.roundedRect(M,y,W-2*M,112,10,10,'F');k.fill(C.ion);doc.rect(M,y+16,3,30,'F');
    k.label(lbl,M+20,y+26);k.font(28,'bold');k.col(C.ion);k.T(val,W-M-20,y+40,{align:'right'});
    k.draw(C.line);doc.setLineWidth(.8);doc.line(M+20,y+58,W-M-20,y+58);
    const cw=(W-2*M-40)/stats.length;stats.forEach(([v,l,c],j)=>{const cx=M+20+cw*j+cw/2;k.font(stats.length>3?11.5:13,'bold');k.col(c||C.fg);k.T(v,cx,y+82,{align:'center'});k.font(6.8);k.col(C.muted);k.T(l.toUpperCase(),cx,y+96,{align:'center',charSpace:.8})});
    k.y+=136;
  };
  k.table=(title,cols,rows,note)=>{
    k.ensure(70);k.label(title,M,k.y);k.y+=12;let x=M;k.font(7.2,'bold');k.col(C.faint);
    cols.forEach(c=>{k.T(c.h.toUpperCase(),c.a==='r'?x+c.w-8:x+8,k.y+10,{align:c.a==='r'?'right':'left',charSpace:.9});x+=c.w});
    k.y+=18;k.draw(C.fg);doc.setLineWidth(1.2);doc.line(M,k.y,W-M,k.y);
    rows.forEach(r=>{const rh=r.group?28:23;k.ensure(rh+4);
      if(r.group||r.total){k.fill(r.total?[232,248,244]:C.soft);doc.rect(M,k.y,W-2*M,rh,'F')}
      x=M;r.cells.forEach((cell,j)=>{const c=cols[j],o=typeof cell==='object'?cell:{t:cell};k.font(o.s||9.2,o.b||r.total?'bold':'normal');k.col(o.c||C.fg);
        k.T(o.t,c.a==='r'?x+c.w-8:x+8+(o.ind||0),k.y+rh/2+3.3,{align:c.a==='r'?'right':'left'});x+=c.w});
      k.y+=rh;k.draw(C.line);doc.setLineWidth(.6);doc.line(M,k.y,W-M,k.y)});
    if(note){k.font(7.5);k.col(C.faint);k.y+=13;k.T(note,M,k.y)}
    k.y+=28;
  };
  // monthly bars, one series, labels on the max and the latest month
  k.chart=(title,items,kpis)=>{
    if(!items.length)return;k.ensure(kpis?220:180);k.label(title,M,k.y);k.y+=10;
    if(kpis){const cw=(W-2*M)/kpis.length;kpis.forEach(([v,l,c],j)=>{const x=M+cw*j;k.font(14,'bold');k.col(c||C.fg);k.T(v,x,k.y+18);k.font(6.8);k.col(C.muted);k.T(l.toUpperCase(),x,k.y+30,{charSpace:.8})});k.y+=44}
    const x0=M+44,x1=W-M,ch=120,top=k.y+14,base=top+ch;
    const max=Math.max(...items.map(x=>x.value),0),step=niceStep(max/3)||1,tp=Math.max(step,Math.ceil(max/step)*step),Y=v=>base-(Math.max(0,v)/tp)*ch;
    for(let v=0;v<=tp+1e-9;v+=step){k.draw(v?[236,239,243]:[190,196,205]);doc.setLineWidth(v?.5:.9);doc.line(x0,Y(v),x1,Y(v));k.font(7);k.col(C.faint);k.T(v>=1000?'$'+(v/1000).toLocaleString('en-US',{maximumFractionDigits:1})+'k':'$'+v,x0-6,Y(v)+2.5,{align:'right'})}
    const slot=(x1-x0)/items.length,bw=Math.min(30,slot*.58),last=items.length-1,mi=items.reduce((b,x,j)=>x.value>items[b].value?j:b,0);
    items.forEach((x,j)=>{const cx=x0+slot*j+slot/2,yy=Y(x.value),hh=base-yy;
      if(hh>0.5){if(x.est){k.fill([206,244,236]);k.draw(C.ion);doc.setLineDashPattern([2,1.5],0);doc.setLineWidth(.7);doc.roundedRect(cx-bw/2,yy,bw,hh,2.5,2.5,'FD');doc.setLineDashPattern([],0)}
        else{k.fill(C.ion);doc.roundedRect(cx-bw/2,yy,bw,hh,2.5,2.5,'F');if(hh>3)doc.rect(cx-bw/2,base-3,bw,3,'F')}}
      if((j===last||j===mi)&&x.value>0){k.font(7.8,'bold');k.col(C.fg);k.T(fmt(x.value).replace('.00',''),cx,yy-5,{align:'center'})}
      k.font(7.2);k.col(C.muted);k.T(x.short,cx,base+12,{align:'center'})});
    k.y=base+22;if(items.some(x=>x.est)){k.font(7);k.col(C.faint);k.T('Barra punteada: mes en curso, estimado.',x0,k.y);k.y+=8}
    k.y+=22;
  };
  k.finish=(name,disclaimer)=>{const n=doc.getNumberOfPages();
    for(let p=1;p<=n;p++){doc.setPage(p);k.draw(C.line);doc.setLineWidth(.6);doc.line(M,H-46,W-M,H-46);
      if(p===n&&disclaimer){k.font(6.8);k.col(C.faint);disclaimer.forEach((t,j)=>k.T(t,M,H-34+j*9))}
      k.font(7.5,'bold');k.col(C.muted);k.T('Orbit  ·  Documento confidencial',W/2,H-14,{align:'center'});k.font(7.5);k.T(`${p} / ${n}`,W-M,H-14,{align:'right'})}
    window.__lastPdf=doc;shareFile(doc.output('blob'),name)};
  return k;
}
const fileSafe=s=>String(s).replace(/[^\wÁÉÍÓÚáéíóúñÑ]+/g,'-');

function exportPDF(i){
  if(!window.jspdf){toast('No se pudo cargar el generador de PDF');return}
  const S=summary(i),ym=curYM(),k=pdfKit(`${i.name}  ·  Estado de cuenta`),{doc,W,M,C}=k;
  k.band(true,'Estado de Cuenta','Inversión activa  ·  Préstamos privados','Corte '+ymLong(ym));
  k.y=166;
  k.label('Inversionista',M,k.y);k.label('Modalidad',W-M,k.y,{align:'right'});
  k.font(20,'bold');k.col(C.fg);k.T(i.name,M,k.y+24);
  k.font(10,'bold');k.T(`Rendimiento de ${rateText(i)}`,W-M,k.y+15,{align:'right'});
  k.font(9);k.col(C.muted);k.T(S.partner?'Participación sobre capital prestado  ·  pago mensual':'Sobre capital colocado  ·  pago mensual',W-M,k.y+29,{align:'right'});
  k.y+=46;k.draw(C.line);doc.setLineWidth(.8);doc.line(M,k.y,W-M,k.y);k.y+=20;
  if(S.partner)k.panel('Rendimiento mensual estimado',fmt(S.mo),[[fmt(S.base),'Capital de referencia'],[String(S.n),'Préstamos activos'],[rateText(i).replace(' mensual',''),'Tasa mensual',C.ion]]);
  else k.panel('Saldo total de su inversión',fmt(S.cap),[[fmt(S.pl),'Invertido · generando'],[fmt(S.fr),'En espera de ser prestado'],[fmt(S.mo),'Rendimiento mensual estimado',C.ion]]);

  const Hs=invHistory(i),dep=deposits(i),acc=Hs.length?Hs[Hs.length-1].acc:0,closed=Hs.filter(x=>!x.current),avg=closed.length?closed.reduce((s,x)=>s+x.a,0)/closed.length:0;
  k.chart('Rendimiento generado por mes',Hs.map(x=>({short:shortM(x.p),value:x.a,est:x.current})),
    dep?[[fmt(dep),'Capital aportado'],[fmt(acc),'Total generado',C.ion],[pct(r2(acc/dep*100)),'ROI acumulado',C.ion],[pct(r2(avg/dep*100)),'ROI mensual promedio']]
       :[[fmt(acc),'Total generado',C.ion],[fmt(avg),'Promedio mensual'],[String(closed.length),'Meses cobrados']]);

  const SC={pagado:C.ok,reinvertido:C.reinv,pendiente:C.muted};
  if(Hs.length)k.table('Crecimiento de su inversión',[{h:'Mes',w:131},{h:'Rendimiento',w:131,a:'r'},{h:'Estado',w:131,a:'r'},{h:'Total generado',w:131,a:'r'}],
    Hs.map(x=>({cells:[{t:ymLabel(x.p),b:true},{t:'+'+fmt(x.a),c:C.ion,b:true},{t:x.st==='pagado'?'Pagado en efectivo':STATUS_L[x.st],c:SC[x.st],s:8.5,b:true},{t:fmt(x.acc),b:true}]})),
    'El rendimiento reinvertido se suma a su capital y queda en espera de ser prestado.');

  const pls=placements(i),groups=new Map();pls.forEach(x=>{if(!groups.has(x.l.borrowerId))groups.set(x.l.borrowerId,[]);groups.get(x.l.borrowerId).push(x)});
  const det=[];let totM=0;
  groups.forEach((xs,bid)=>{const b=bor(bid),capSum=xs.filter(x=>x.kind==='capital').reduce((s,x)=>s+x.base,0),m=xs.reduce((s,x)=>s+x.amt,0);totM+=m;
    det.push({group:true,cells:[{t:b?.name||'—',b:true,s:10.5},{t:`${xs.length} préstamo${xs.length>1?'s':''}${capSum&&S.pl?`  ·  ${Math.round(capSum/S.pl*1000)/10}% de su capital`:''}`,c:C.muted,s:8},{t:capSum?fmt(capSum):'',b:true},{t:fmt(m)+'/mes',c:C.ion,b:true}]});
    xs.forEach(x=>det.push({cells:[{t:'Día '+x.l.payDay,b:true,ind:14},{t:x.kind==='part'?`Participación ${pct(x.rate)} sobre ${fmt(x.base)}`:`${pct(x.rate)} mensual`,c:C.muted,s:9},{t:x.kind==='part'?'—':fmt(x.base)},{t:fmt(x.amt),c:C.ion,b:true}]}))});
  if(det.length){
    k.table('Detalle por cliente',[{h:'Día de cobro',w:115},{h:'',w:189},{h:'Capital',w:110,a:'r'},{h:'Monto mensual',w:110,a:'r'}],det);
    k.y-=16;k.ensure(40);k.fill(C.ink);doc.roundedRect(M,k.y,W-2*M,38,8,8,'F');k.font(8,'bold');k.col([170,182,200]);k.T('TOTAL MENSUAL ESTIMADO',M+16,k.y+23,{charSpace:1.3});k.font(16,'bold');k.col(C.ionL);k.T(fmt(totM),W-M-16,k.y+25,{align:'right'});k.y+=66;
  }
  const moves=db.movements.filter(m=>m.investorId===i.id).sort((a,b)=>a.date<b.date?-1:1);
  if(moves.length)k.table('Movimientos de capital',[{h:'Fecha',w:157},{h:'Concepto',w:236},{h:'Monto',w:131,a:'r'}],moves.map(m=>({cells:[dLong(m.date),{t:m.type==='aporte'?'Aporte':m.type==='retiro'?'Retiro':'Reinversión  ·  '+(m.note||''),c:C.muted},{t:(m.type==='retiro'?'-':'+')+fmt(m.amount),b:true,c:m.type==='retiro'?C.bad:m.type==='reinversion'?C.reinv:C.ok}]})));
  k.finish(`Estado-de-cuenta-${fileSafe(i.name)}-${ym}.pdf`,['Los montos corresponden al rendimiento pactado sobre el capital activo. Sujeto a variación por pagos anticipados o abonos a capital.','Este documento es informativo y no constituye un contrato.']);
}

// private report: the whole portfolio and what I keep
function exportAdminPDF(){
  if(!window.jspdf){toast('No se pudo cargar el generador de PDF');return}
  const ym=curYM(),k=pdfKit('Reporte de cartera  ·  Uso interno'),{doc,W,M,C}=k;
  const o=owner(),m=myMonth(ym),Hh=myHistory(),acc=Hh.length?Hh[Hh.length-1].acc:0,P=portfolio(),t=totals(),cap=o?capitalOf(o):0,pl=o?placedNow(o):0;
  k.band(true,'Reporte de Cartera','Administrador  ·  Uso interno, no compartir','Corte '+ymLong(ym));
  k.y=166;
  k.panel('Tu ganancia estimada del mes',fmt(m.est),[[fmt(m.own),'De tu capital'],[fmt(m.margin),'Margen sobre otros'],[fmt(acc),'Ganancia acumulada',C.ion],[fmt(cap),'Tu capital propio']]);
  k.panel('Capital administrado',fmt(t.capital),[[fmt(P.lent),'Prestado'],[fmt(t.free),'En espera'],[fmt(P.interest),'Interés mensual'],[fmt(P.others),'Pagas a otros / mes']]);
  const closed=Hh.filter(x=>!x.current),avg=closed.length?closed.reduce((s,x)=>s+x.real,0)/closed.length:0;
  k.chart('Tu ganancia por mes',Hh.map(x=>({short:shortM(x.ym),value:Math.max(0,x.value),est:x.current})),
    [[fmt(acc),'Acumulado real',C.ion],[fmt(avg),'Promedio mensual'],[pct(r2(P.avg)),'Tasa promedio cartera'],[`${P.n} / ${P.clients}`,'Préstamos / clientes']]);
  const act=db.loans.filter(l=>!l.closed);
  const rows=act.map(l=>{const R=reparto(l);return {cells:[{t:`${borName(l)}  ·  Día ${l.payDay}`,b:true},fmt(R.o),pct(l.rate),fmt(R.total),{t:'-'+fmt(R.total-R.mine),c:C.muted},{t:fmt(R.mine),b:true,c:R.mine<0?C.bad:C.ion}]}});
  rows.push({total:true,cells:['Total',fmt(P.lent),pct(r2(P.avg)),fmt(P.interest),'-'+fmt(P.others),{t:fmt(P.mine),c:C.ion}]});
  k.table('Por préstamo',[{h:'Cliente',w:134},{h:'Capital',w:84,a:'r'},{h:'Tasa',w:52,a:'r'},{h:'Interés/mes',w:84,a:'r'},{h:'Pagas',w:84,a:'r'},{h:'Tu parte',w:86,a:'r'}],rows);
  const SC={pagado:C.ok,reinvertido:C.reinv,pendiente:C.muted};
  k.table('Inversionistas y socios',[{h:'Nombre',w:124},{h:'Capital',w:84,a:'r'},{h:'Prestado',w:84,a:'r'},{h:'Tasa',w:84,a:'r'},{h:'Pago/mes',w:76,a:'r'},{h:'Estado '+shortM(ym),w:72,a:'r'}],
    db.investors.map(i=>{const S=summary(i),st=payoutStatus(i,ym);return {cells:[{t:i.name+(i.owner?'  (tú)':S.partner?'  (socio)':''),b:true},fmt(S.cap),fmt(S.pl),{t:rateText(i).replace(' mensual',''),c:C.muted,s:8.5},fmt(S.mo),i.owner?{t:'—',c:C.faint}:{t:STATUS_L[st],c:SC[st],b:true,s:8.5}]}}));
  if(Hh.length)k.table('Historial mensual',[{h:'Mes',w:120},{h:'Cobrado',w:101,a:'r'},{h:'Pagas a otros',w:101,a:'r'},{h:'Tu ganancia',w:101,a:'r'},{h:'Acumulado',w:101,a:'r'}],
    Hh.map(x=>({cells:[{t:ymLabel(x.ym)+(x.current?'  (en curso)':''),b:true},fmt(x.collected),{t:'-'+fmt(x.others),c:C.muted},{t:fmt(x.value),b:true,c:x.value<0?C.bad:C.ion},fmt(x.acc)]})),
    'Meses cerrados: cobrado real menos lo que pagas. Mes en curso: estimado.');
  k.finish(`Reporte-cartera-${ym}.pdf`,['Documento interno. Incluye tasas de clientes y márgenes: no compartir con inversionistas.']);
}
