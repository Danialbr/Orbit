<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Orbit</title>
<meta name="theme-color" content="#080B11">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Orbit">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>.top{top:0!important;padding-top:env(safe-area-inset-top,0px)}</style>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one phone column, glass header, fixed tab bar. Manrope throughout, tabular figures. Single dark look by design. */
:root{
  --ink:#080B11; --panel:#0E131C; --panel-2:#131A26; --raise:#1A2232;
  --line:rgba(150,175,210,.11); --line-2:rgba(150,175,210,.22);
  --fg:#E9EEF5; --muted:#8693A8; --dim:#5A6577;
  --ion:#46E3C6; --ion-2:#4FA8FF; --ion-ink:#04140F;
  --ok:#3DD68C; --warn:#F2B84B; --bad:#FF6B6B; --reinv:#A08CFF; --idle:#7D8AA0;
  --display:'Manrope',ui-sans-serif,-apple-system,system-ui,sans-serif;
  --body:'Manrope',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,sans-serif;
  --mono:'Manrope',-apple-system,system-ui,sans-serif;
  --code:ui-monospace,'SF Mono',Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--fg)}
body{margin:0;font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(60% 40% at 100% 0%,rgba(70,227,198,.10),transparent 70%),
   radial-gradient(50% 35% at 0% 20%,rgba(79,168,255,.08),transparent 70%),
   linear-gradient(rgba(150,175,210,.035) 1px,transparent 1px) 0 0/28px 28px,
   linear-gradient(90deg,rgba(150,175,210,.035) 1px,transparent 1px) 0 0/28px 28px;
  -webkit-mask-image:linear-gradient(#000 0%,#000 30%,transparent 75%);mask-image:linear-gradient(#000 0%,#000 30%,transparent 75%)}
*{box-sizing:border-box}
[hidden]{display:none!important}
.discreet .priv{display:none!important}
.presenting .top,.presenting .tabs{display:none!important}
.presenting main{padding-top:calc(16px + env(safe-area-inset-top,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ion);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:'tnum';font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 10.5px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,11,17,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px}
.top h1{margin:0;font:600 20px/1.15 var(--display);letter-spacing:-.02em;text-wrap:balance}
.top .ttl{flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);color:var(--fg);flex:none}
.iconbtn svg{width:20px;height:20px}
.addbtn{height:38px;padding:0 14px;border-radius:12px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--ion-ink);background:linear-gradient(135deg,var(--ion),var(--ion-2));box-shadow:0 6px 24px -8px rgba(70,227,198,.6)}
.addbtn svg{width:16px;height:16px}

main{padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
section{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px;padding-inline:2px}
.sec-h h2{margin:0;font:600 15px/1.2 var(--display);letter-spacing:-.01em}

.card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{position:relative;overflow:hidden;border:1px solid transparent;
  background:linear-gradient(160deg,#121A27,#0B1018) padding-box,linear-gradient(135deg,rgba(70,227,198,.6),rgba(79,168,255,.18) 45%,rgba(150,175,210,.14)) border-box}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(70,227,198,.18);box-shadow:0 0 0 26px rgba(70,227,198,.03),0 0 0 54px rgba(79,168,255,.025);pointer-events:none}
.big{font:600 34px/1.05 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px}
.big.ion{background:linear-gradient(90deg,var(--ion),var(--ion-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.stat .v{font:500 14.5px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .eyebrow{font-size:9.5px}

.month{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font:600 19px/1 var(--display)}
.ring .c span{font-size:9.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;display:block;margin-top:3px}
.kv{display:flex;justify-content:space-between;gap:12px;padding-block:5px;font-size:13.5px}
.kv .num{font-size:13.5px;white-space:nowrap}

.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
button.row:active{background:var(--panel-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row .r .num{font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor;background:currentColor}
.bar{width:3px;align-self:stretch;border-radius:3px;flex:none;background:currentColor}

.chip{display:inline-flex;align-items:center;gap:5px;font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px;white-space:nowrap}
.s-pagado{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.s-parcial{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.s-atrasado{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.s-pendiente{color:var(--idle);background:color-mix(in srgb,var(--idle) 14%,transparent)}
.s-enespera{color:var(--ion-2);background:color-mix(in srgb,var(--ion-2) 15%,transparent)}
.s-reinvertido{color:var(--reinv);background:color-mix(in srgb,var(--reinv) 15%,transparent)}
.s-liquidado{color:var(--muted);background:var(--raise)}
.tag{font:600 10px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ion);border:1px solid rgba(70,227,198,.35);padding:3px 6px;border-radius:6px;vertical-align:2px;margin-left:6px}

.split{height:8px;border-radius:8px;background:var(--raise);overflow:hidden;display:flex;margin-top:12px}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:8px;height:8px;box-shadow:none}

.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:42px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--raise);border:1px solid var(--line-2);color:var(--fg)}
.btn svg{width:17px;height:17px}
.btn.pri{background:linear-gradient(135deg,var(--ion),var(--ion-2));color:var(--ion-ink);border:0}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.wide{flex:1}
.seg{display:flex;background:var(--ink);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--raise);color:var(--fg)}
.seg.mini button{padding:5px 7px;font-size:10.5px;letter-spacing:.04em}
.seg.mini button.on.s-pendiente{background:var(--raise);color:var(--fg)}

.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 9.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 12px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:first-child td{border-top:0}
.ar{text-align:right}
table.tight th,table.tight td{padding-inline:8px}table.tight{font-size:12.5px}
tr.tap{cursor:pointer} tr.tap:active td{background:var(--panel-2)}

/* cars */
.cars{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 8px;scrollbar-width:none}.cars::-webkit-scrollbar{display:none}
.carc{flex:0 0 86%;scroll-snap-align:center;text-align:left;border-radius:16px;padding:16px 18px 14px;color:#EEF3F9;position:relative;overflow:hidden;
  background:radial-gradient(80% 70% at 50% 62%,rgba(79,168,255,.22),transparent 70%),linear-gradient(160deg,#1A2130,#090C12);border:1px solid rgba(255,255,255,.12);box-shadow:0 22px 40px -24px #000,0 1px 0 rgba(255,255,255,.14) inset}
.carc::before{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 18px);pointer-events:none}
.carc-top{display:flex;justify-content:space-between;align-items:baseline;font:700 15px var(--display)}.carc-d{font:600 10px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.car-svg{width:100%;height:auto;display:block;margin:8px 0 4px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.carc-bot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.carc-bot small{display:block;font:600 8.5px/1 var(--body);letter-spacing:.16em;opacity:.6;margin-bottom:5px}.carc-bot b{font:700 14px var(--display)}
.wc-carbon{background:radial-gradient(120% 120% at 100% 0%,rgba(79,168,255,.18),transparent 55%),repeating-linear-gradient(45deg,#1B1F27 0 4px,#14171D 4px 8px);color:#EEF3F9}
.an-in .car-svg{animation:drive .9s .2s cubic-bezier(.2,.8,.2,1) both}@keyframes drive{from{transform:translateX(-40px);opacity:0}}
/* credit cards: stack + face */
.ccstack{display:flex;flex-direction:column}
.ccs{position:relative;display:block;width:100%;text-align:left;color:#fff;border-radius:14px;margin-top:-10px;padding:0 16px;background:radial-gradient(120% 140% at 100% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(135deg,var(--a),var(--b));border:1px solid rgba(255,255,255,.16);box-shadow:0 -8px 20px -12px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.22) inset}
.ccs:first-child{margin-top:0}
.ccs-h{display:flex;justify-content:space-between;align-items:center;height:62px;gap:10px}
.ccs-h span{display:flex;flex-direction:column;font:700 15px/1.15 var(--display)}.ccs-h small{font:600 9.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;opacity:.75;margin-bottom:4px}
.ccs-r{align-items:flex-end;text-align:right}.ccs-r b{font:700 17px var(--display)}.ccs-r small{margin:4px 0 0!important;letter-spacing:.04em!important;text-transform:none!important}
.ccf{position:relative;aspect-ratio:1.586;border-radius:16px;padding:18px 20px;color:#fff;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.2),transparent 55%),linear-gradient(135deg,var(--a),var(--b));border:1px solid rgba(255,255,255,.18);box-shadow:0 24px 40px -22px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.28) inset}
.ccf::after{content:"";position:absolute;top:-60%;left:-60%;width:50%;height:220%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);animation:sheen 5s .4s ease-in-out infinite}
.ccf-top{display:flex;justify-content:space-between;align-items:baseline}.ccf-iss{font:700 11px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;opacity:.85}.ccf-name{font:700 15px/1 var(--display)}
.ccf-chip{width:40px;height:30px;border-radius:6px;margin-top:16px;background:linear-gradient(135deg,#F2F4F7,#A9B1BC 60%,#D7DCE2);display:grid;grid-template-rows:repeat(3,1fr);padding:4px 6px;gap:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}.ccf-chip i{border-top:1px solid rgba(0,0,0,.18)}
.ccf-num{font:500 15px/1 var(--code);letter-spacing:.06em;margin-top:auto;opacity:.92;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.ccf-bot{display:flex;justify-content:space-between;margin-top:12px}.ccf-bot small{display:block;font:600 8.5px/1 var(--body);letter-spacing:.18em;opacity:.7;margin-bottom:4px}.ccf-bot b{font:700 18px/1 var(--display);letter-spacing:-.02em}
.ccf-bar{height:3px;border-radius:3px;background:rgba(255,255,255,.22);margin-top:10px;overflow:hidden}.ccf-bar i{display:block;height:100%;width:var(--w);background:#fff}
.grade{font:800 10.5px/1 var(--body);padding:4px 7px;border-radius:7px;letter-spacing:.04em;vertical-align:2px;margin-left:6px}
.gradebig{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font:800 24px var(--display);flex:none}
.g-N{color:var(--muted);background:var(--raise)}.g-A{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.g-B{color:var(--ion);background:color-mix(in srgb,var(--ion) 15%,transparent)}.g-C{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}.g-D{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
/* credit cards */
.cc-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 8px;scrollbar-width:none}.cc-row::-webkit-scrollbar{display:none}
.cc{flex:0 0 78%;scroll-snap-align:center;aspect-ratio:1.586;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;text-align:left;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.18),transparent 50%),linear-gradient(135deg,var(--a),var(--b));border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 36px -20px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.25) inset}
.cc::after{content:"";position:absolute;inset:0;opacity:.25;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px);pointer-events:none}
.cc-top{display:flex;justify-content:space-between;font:600 10px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.cc-chip{width:34px;height:25px;border-radius:5px;margin-top:14px;background:linear-gradient(135deg,#E9EDF2,#9AA3AF);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.cc-name{font:600 15px/1.2 var(--display);margin-top:auto;letter-spacing:-.01em}
.cc-bal{font:600 24px/1.1 var(--display);letter-spacing:-.04em;margin-top:2px}
.cc-bar{height:3px;border-radius:3px;background:rgba(255,255,255,.22);margin-top:8px;overflow:hidden}.cc-bar i{display:block;height:100%;width:var(--w);background:#fff}
.cc-bot{display:flex;justify-content:space-between;margin-top:8px;font:500 11px/1 var(--code);opacity:.85}
.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.preset{height:58px;border-radius:12px;padding:8px 12px;text-align:left;color:#fff;font:600 10px/1.3 var(--body);letter-spacing:.12em;text-transform:uppercase;background:linear-gradient(135deg,var(--a),var(--b));border:2px solid transparent}
.preset b{display:block;font:600 13.5px/1.2 var(--display);letter-spacing:0;text-transform:none;margin-top:3px}.preset.on{border-color:#fff}
/* panel: metal card + wallet stack */
.metal{position:relative;aspect-ratio:1.586;max-width:100%;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;color:#EAF7F4;isolation:isolate;
  background:radial-gradient(120% 90% at 0% 0%,#1E5B55 0%,transparent 55%),radial-gradient(90% 80% at 100% 100%,#1C3E78 0%,transparent 60%),linear-gradient(135deg,#0F2B2E,#0B1426 60%,#080C16);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 60px -28px rgba(0,0,0,.9),0 0 0 1px rgba(70,227,198,.08) inset,0 1px 0 rgba(255,255,255,.18) inset}
.metal::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.35;background:repeating-linear-gradient(100deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.metal::after{content:"";position:absolute;top:-60%;left:-60%;width:60%;height:220%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);animation:sheen 6s 1.2s ease-in-out infinite}
@keyframes sheen{0%{left:-60%}35%,100%{left:140%}}
.metal-top{display:flex;align-items:center;gap:10px}.metal-logo{width:30px;height:30px;display:block}.metal-logo svg{width:100%;height:100%}
.metal-brand{font:800 15px/1 var(--display);letter-spacing:.42em}.metal-tier{margin-left:auto;font:700 9.5px/1 var(--body);letter-spacing:.3em;opacity:.65}
.metal-l{font:600 10.5px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;opacity:.7}
.metal-v{font:700 38px/1.1 var(--display);letter-spacing:-.03em;margin-top:6px;background:linear-gradient(90deg,#FFFFFF,#BFF6EA 60%,#9CCBFF);-webkit-background-clip:text;background-clip:text;color:transparent}
.metal-v .num{font:inherit}
.metal-bot{display:flex;justify-content:space-between;align-items:flex-end}.metal-name{font:500 12px/1 var(--code);letter-spacing:.22em;opacity:.8}
.metal-net{text-align:right;font:700 15px/1.1 var(--display)}.metal-net small{display:block;font:600 8.5px/1 var(--body);letter-spacing:.2em;opacity:.6;margin-bottom:4px}
.wallet{display:flex;flex-direction:column;margin-top:-6px}
.wc{position:relative;border-radius:14px;padding:0 18px;margin-top:-14px;cursor:pointer;border:1px solid rgba(255,255,255,.1);box-shadow:0 -10px 24px -14px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.12) inset;transition:transform .35s cubic-bezier(.2,.8,.2,1),margin .35s}
.wc:first-child{margin-top:0}
.wc-h{display:flex;justify-content:space-between;align-items:center;height:64px;gap:10px}
.wc-t{font:700 14px var(--display);letter-spacing:-.01em}.wc-a{font:700 17px var(--display)}
.wc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s cubic-bezier(.2,.8,.2,1)}.wc-b>div{overflow:hidden}
.wc.open .wc-b{grid-template-rows:1fr}.wc.open{margin-bottom:18px}.wc.open+.wc{margin-top:0}
.wc .kv{font-size:13.5px;opacity:.9;padding-block:6px;border-top:1px solid rgba(255,255,255,.08)}
.wc-btn{margin:10px 0 16px;width:100%;height:40px;border-radius:12px;background:rgba(255,255,255,.12);font-weight:700;font-size:13.5px;color:inherit;border:1px solid rgba(255,255,255,.14)}
.wc-teal{background:linear-gradient(135deg,#1A6B62,#0E3B3C);color:#E8FFFA}
.wc-blue{background:linear-gradient(135deg,#1F4F9A,#0F2650);color:#EAF2FF}
.wc-slate{background:linear-gradient(135deg,#2A3346,#161C29);color:#E9EEF5}
.wc-graphite{background:linear-gradient(135deg,#2B2226,#15121A);color:#F5E9EA}.wc-graphite .wc-a{color:#F59A9A}

#splash .o-ring{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1s .1s cubic-bezier(.65,0,.25,1) forwards}
#splash .o-trail{stroke-dasharray:100;stroke-dashoffset:100;animation:draw .7s .7s ease-out forwards}

@keyframes draw{to{stroke-dashoffset:0}}

<script src="jspdf.umd.min.js"></script>
<script>window.XLSX_SRC='xlsx.full.min.js'</script>
<script>
(()=>{
'use strict';
/* ============ utils ============ */
const $=s=>document.querySelector(s);
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>iso(new Date());
const curYM=()=>today().slice(0,7);
const ymOf=s=>String(s).slice(0,7);
function addM(ym,k){let[y,m]=ym.split('-').map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${pad(m)}`}
const dim=(y,m)=>new Date(y,m,0).getDate();
const MES=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
const MESL=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const ymLabel=ym=>{const[y,m]=ym.split('-').map(Number);return `${MES[m-1]} ${y}`};
const ymLong=ym=>{const[y,m]=ym.split('-').map(Number);return `${MESL[m-1]} ${y}`};
const dLong=s=>{const[y,m,d]=s.split('-').map(Number);return `${d} de ${MESL[m-1]} de ${y}`};
const dShort=s=>{const[,m,d]=s.split('-').map(Number);return `${d} ${MES[m-1]}`};
const r2=n=>Math.round(((+n)||0)*100+Number.EPSILON*100)/100;
const USD=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const fmt=n=>USD.format(r2(n));
const pct=n=>`${Number(n||0).toLocaleString('en-US',{maximumFractionDigits:2})}%`;
const COLORS=['#46E3C6','#4FA8FF','#F2B84B','#FF7A9C','#A08CFF','#7BE07B','#FF9F5A','#5ED0FF','#E9EEF5'];
const STATUS_L={pagado:'Pagado',parcial:'Parcial',atrasado:'Atrasado',pendiente:'Pendiente',reinvertido:'Reinvertido',enespera:'En espera',liquidado:'Liquidado'};
const chip=s=>`<span class="chip s-${s}">${STATUS_L[s]}</span>`;
const maxISO=(a,b)=>a>b?a:b;

/* ============ logo: pixel-star spiral galaxy + orbital ring ============ */
function logoSVG(o={}){
  const id=o.id||'lg';
  // "O" with a gap, a satellite at the gap and a fading trail behind it
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" ${o.size?`width="${o.size}" height="${o.size}"`:''} aria-hidden="true">
  <defs>
    <linearGradient id="${id}t" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#46E3C6" stop-opacity="0"/><stop offset="1" stop-color="#46E3C6"/></linearGradient>
    <linearGradient id="${id}o" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE4EF"/></linearGradient>
    <linearGradient id="${id}bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#121A28"/><stop offset="1" stop-color="#06080D"/></linearGradient>
  </defs>
  ${o.bg?`<rect width="100" height="100" fill="url(#${id}bg)"/>`:''}
  <g ${o.bg?'transform="translate(50 50) scale(.82) translate(-50 -50)"':''}>
    <path class="o-ring" d="M77 33 A31 31 0 1 1 62 21.5" fill="none" stroke="url(#${id}o)" stroke-width="10" stroke-linecap="round" pathLength="100"/>
    <path class="o-trail" d="M14 52 A38 38 0 0 1 70 15" fill="none" stroke="url(#${id}t)" stroke-width="3.2" stroke-linecap="round" pathLength="100"/>
    <circle class="o-sat" cx="78" cy="21" r="7" fill="#46E3C6"/>
  </g>
</svg>`;
}
let LOGO_PNG=null;
function prepLogoPNG(){try{const img=new Image();img.onload=()=>{try{const c=document.createElement('canvas');c.width=c.height=256;c.getContext('2d').drawImage(img,0,0,256,256);LOGO_PNG=c.toDataURL('image/png')}catch(e){}};img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(logoSVG({id:'pdf',bg:true}))}catch(e){}}
function splash(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const el=document.createElement('div');el.id='splash';el.innerHTML=`<div class="sp-in">${logoSVG({id:'sp',size:120})}<div class="sp-word">ORBIT</div><div class="sp-sub">Private Capital</div></div>`;
  document.body.appendChild(el);
  const done=()=>{el.classList.add('out');setTimeout(()=>el.remove(),500)};
  el.addEventListener('click',done);setTimeout(done,reduce?600:1900);
}

/* ============ storage ============ */
const KEY='orbita.db.v1';
const blank=()=>({v:2,cards:[],investors:[{id:'inv_'+uid(),name:'Yo',rate:0,owner:true,phone:'',note:''}],movements:[],borrowers:[],loans:[],payments:[],payouts:[],settings:{sample:false,lastBackup:null}});
let db, canSave=true;
function load(){
  try{const s=localStorage.getItem(KEY); if(s){db=JSON.parse(s);if((db.v||1)<2){try{localStorage.setItem(KEY+'.antes-v2',s)}catch(e){}}migrate();save();return}}catch(e){canSave=false}
  db=window.ORBITA_DEMO?sampleDB():blank();migrate();
}
// v2: partner shares live on each slice of money (funding row) instead of the whole loan; payouts carry payment details
function migrate(){
  db.goals=db.goals||[];db.cars=db.cars||[];
  db.settings=db.settings||{};db.cards=db.cards||[];db.payouts=db.payouts||[];db.movements=db.movements||[];
  db.loans.forEach(l=>{l.funding.forEach(f=>{f.shares=f.shares||[]});
    if(l.shares&&l.shares.length){l.funding.forEach(f=>l.shares.forEach(x=>{if(x.investorId!==f.investorId&&!f.shares.some(y=>y.investorId===x.investorId))f.shares.push({investorId:x.investorId,rate:+x.rate})}))}
    l.shares=[]});
  db.payouts.forEach(p=>{if(p.gross==null)p.gross=+p.amount||0;p.deductions=p.deductions||[];if(p.net==null)p.net=p.gross;p.method=p.method||'';p.dest=p.dest||''});
  db.v=2;
}
function save(){
  if(!canSave)return;
  try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){canSave=false;toast('No se pudo guardar en este dispositivo')}
}

/* ============ domain ============ */
const inv=id=>db.investors.find(x=>x.id===id);
const bor=id=>db.borrowers.find(x=>x.id===id);
const loanById=id=>db.loans.find(x=>x.id===id);
const borName=l=>bor(l.borrowerId)?.name||'—';
const borColor=l=>bor(l.borrowerId)?.color||COLORS[0];
function dueISO(l,ym){const[y,m]=ym.split('-').map(Number);return `${ym}-${pad(Math.min(+l.payDay,dim(y,m)))}`}
const firstYM=l=>addM(ymOf(l.start),1);
function lastYM(l){
  let end=null;
  if(+l.term>0) end=addM(ymOf(l.start),+l.term);
  if(l.closed){let c=ymOf(l.closed); if(dueISO(l,c)>l.closed) c=addM(c,-1); end=end&&end<c?end:c}
  return end;
}
const hasPeriod=(l,ym)=>{const L=lastYM(l);return ym>=firstYM(l)&&(!L||ym<=L)};
function periods(l,until){const out=[],L=lastYM(l);const lim=L&&L<until?L:until;for(let p=firstYM(l);p<=lim;p=addM(p,1))out.push(p);return out}
const payOf=(id,ym)=>db.payments.find(p=>p.loanId===id&&p.period===ym);
const capBefore=(l,ym)=>db.payments.filter(p=>p.loanId===l.id&&p.period<ym).reduce((s,p)=>s+(+p.capital||0),0);
const outBefore=(l,ym)=>Math.max(0,r2(l.principal-capBefore(l,ym)));
const outNow=l=>l.closed?0:Math.max(0,r2(l.principal-db.payments.filter(p=>p.loanId===l.id).reduce((s,p)=>s+(+p.capital||0),0)));
const crate=(f,l)=>f.crate!=null&&f.crate!==''?+f.crate:+l.rate;
const loanInt=(l,o)=>l.principal?l.funding.reduce((s,f)=>s+f.amount*o/l.principal*crate(f,l)/100,0):0;
const expected=(l,ym)=>r2(loanInt(l,outBefore(l,ym)));
function rateLabel(l){const a=[...new Set(l.funding.map(f=>r2(crate(f,l))))].sort((x,y)=>x-y);return a.length?a.map(pct).join(' · '):pct(l.rate)}
function status(l,ym){
  const p=payOf(l.id,ym),due=expected(l,ym),paid=p?+p.interest||0:0;
  if(p&&paid>=due-0.005)return 'pagado';
  if(paid>0)return 'parcial';
  return dueISO(l,ym)<today()?'atrasado':'pendiente';
}
const isLate=(l,ym)=>{const s=status(l,ym);return s==='atrasado'||(s==='parcial'&&dueISO(l,ym)<today())};

function capitalOf(i){return r2(db.movements.filter(m=>m.investorId===i.id).reduce((s,m)=>s+(m.type==='retiro'?-1:1)*(+m.amount||0),0))}
const sliceOf=(l,i)=>l.funding.find(f=>f.investorId===i.id);
const fShares=f=>f.shares||[];
const involved=(l,i)=>l.funding.some(f=>f.investorId===i.id||fShares(f).some(x=>x.investorId===i.id));
// rate the money owner of a slice receives; the owner (me) keeps what's left after partners on that slice
function rateFor(f,l){const i=inv(f.investorId);if(!i)return 0;const sh=fShares(f).reduce((s,x)=>s+(+x.rate||0),0);if(i.owner)return r2(crate(f,l)-sh);return f.rate!=null&&f.rate!==''?+f.rate:+i.rate}
function invRate(i,l){const f=sliceOf(l,i);return f?rateFor(f,l):0}
const fBase=(l,f,o)=>l.principal?f.amount*o/l.principal:0;
function linesFor(i,l,o){const out=[];l.funding.forEach(f=>{const b=fBase(l,f,o);
  if(f.investorId===i.id){const r=rateFor(f,l);out.push({kind:'capital',base:b,rate:r,amt:b*r/100,f})}
  fShares(f).forEach(x=>{if(x.investorId===i.id)out.push({kind:'part',base:b,rate:+x.rate,amt:b*x.rate/100,f})})});return out}
const sumAmt=a=>a.reduce((s,x)=>s+x.amt,0);
function placedNow(i){return r2(db.loans.reduce((s,l)=>l.closed?s:s+l.funding.filter(f=>f.investorId===i.id).reduce((a,f)=>a+fBase(l,f,outNow(l)),0),0))}
function shareBase(i){return r2(db.loans.reduce((s,l)=>l.closed?s:s+linesFor(i,l,outNow(l)).filter(x=>x.kind==='part').reduce((a,x)=>a+x.base,0),0))}
function monthlyNow(i){return r2(db.loans.reduce((s,l)=>l.closed?s:s+sumAmt(linesFor(i,l,outNow(l))),0))}
function dividend(i,ym){return r2(db.loans.reduce((s,l)=>hasPeriod(l,ym)?s+sumAmt(linesFor(i,l,outBefore(l,ym))):s,0))}
function invPeriods(i,until=curYM()){const set=new Set();db.loans.forEach(l=>{if(involved(l,i))periods(l,until).forEach(p=>set.add(p))});return [...set].sort().filter(p=>dividend(i,p)>0||payoutOf(i,p))}
function rateText(i){const set=new Set();db.loans.forEach(l=>{if(!l.closed)linesFor(i,l,outNow(l)).forEach(x=>set.add(r2(x.rate)))});const a=[...set].sort((x,y)=>x-y);if(!a.length)return i.owner?'Interés completo':(+i.rate?pct(i.rate)+' mensual':'Sin tasa');return (a.length>1?pct(a[0])+' a '+pct(a[a.length-1]):pct(a[0]))+' mensual'}
function summary(i){const cap=capitalOf(i),pl=placedNow(i),base=shareBase(i),mo=monthlyNow(i);return {cap,pl,fr:r2(cap-pl),base,mo,partner:cap<=0&&base>0,n:db.loans.filter(l=>!l.closed&&involved(l,i)).length}}
function placements(i){const out=[];db.loans.forEach(l=>{if(l.closed||!l.principal)return;linesFor(i,l,outNow(l)).forEach(x=>out.push({l,...x}))});return out}
function reparto(l){const o=outNow(l),total=loanInt(l,o),parts=[];
  l.funding.forEach(f=>{const i=inv(f.investorId);if(!i)return;const b=fBase(l,f,o);
    if(!i.owner){const r=rateFor(f,l);parts.push({i,kind:'capital',base:b,rate:r,amt:b*r/100})}
    fShares(f).forEach(x=>{const pi=inv(x.investorId);if(pi)parts.push({i:pi,kind:'part',base:b,rate:+x.rate,amt:b*x.rate/100,of:i})})});
  const mine=total-sumAmt(parts);return {o,total,parts,mine,minePct:o?mine/o*100:0}}
const payoutOf=(i,ym)=>db.payouts.find(p=>p.investorId===i.id&&p.period===ym);
const payoutStatus=(i,ym)=>payoutOf(i,ym)?.status||'pendiente';
const payoutAmt=(i,ym)=>{const p=payoutOf(i,ym);return p?+p.gross:dividend(i,ym)};
// when I owe an investor for a month: their own pay day, otherwise the last client pay day of their loans that month
function payoutDue(i,ym){if(+i.payDay){const[y,m]=ym.split('-').map(Number);return `${ym}-${pad(Math.min(+i.payDay,dim(y,m)))}`}
  let d=null;db.loans.forEach(l=>{if(hasPeriod(l,ym)&&involved(l,i)){const x=dueISO(l,ym);if(!d||x>d)d=x}});return d||`${ym}-28`}
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
function payoutDelay(i,ym){const p=payoutOf(i,ym),due=payoutDue(i,ym);if(p)return Math.max(0,daysBetween(due,p.date||due));return today()>due?daysBetween(due,today()):0}
function pendingPayouts(){const out=[];db.investors.filter(i=>!i.owner).forEach(i=>invPeriods(i).forEach(p=>{if(!payoutOf(i,p)&&dividend(i,p)>0)out.push({i,p,due:payoutDue(i,p),amt:dividend(i,p)})}));return out.sort((a,b)=>a.due<b.due?-1:1)}
const METHODS=['Zelle','Wire','ACH / Transferencia','Efectivo','Cheque','Otro'];
function viaText(po){if(!po||po.status==='pendiente')return '';if(po.status!=='pagado')return po.status==='enespera'?'En su cuenta, en espera de ser prestado':'Reinvertido a su capital';return [po.method,po.dest].filter(Boolean).join(' · ')}
// my own money: savings vs credit cards
function ownSources(){const o=owner();if(!o)return {ahorro:0,tarjetas:0,byCard:{}};const byCard={};let ahorro=0,tar=0;
  db.movements.filter(m=>m.investorId===o.id&&m.type==='aporte').forEach(m=>{if(m.source&&m.source!=='ahorro'){byCard[m.source]=(byCard[m.source]||0)+(+m.amount||0);tar+=+m.amount||0}else ahorro+=+m.amount||0});
  return {ahorro:r2(ahorro),tarjetas:r2(tar),byCard}}
const debtApr=c=>c.promoEnd&&c.promoEnd>=today()?0:(+c.apr||0);
const carsStock=()=>(db.cars||[]).filter(c=>!c.sold);
const carCost=c=>r2((+c.buy||0)+(c.costs||[]).reduce((s,x)=>s+(+x.amount||0),0));
function finances(){const debt=r2(db.cards.reduce((s,c)=>s+(+c.balance||0),0)),cost=r2(db.cards.reduce((s,c)=>s+(+c.balance||0)*debtApr(c)/1200,0)),o=owner(),capOwn=o?capitalOf(o):0,sav=+db.settings.savings||0,m=myMonth(curYM());
  const cars=r2(carsStock().reduce((s,c)=>s+carCost(c),0));return {debt,cost,capOwn,sav,cars,net:r2(m.est-cost),worth:r2(sav+capOwn+cars-debt),src:ownSources()}}
const owner=()=>db.investors.find(i=>i.owner);
const deposits=i=>r2(db.movements.filter(m=>m.investorId===i.id&&m.type==='aporte').reduce((s,m)=>s+(+m.amount||0),0));
function monthsRange(){const f=db.loans.map(firstYM).sort()[0];const out=[];if(!f)return out;for(let p=f;p<=curYM();p=addM(p,1))out.push(p);return out}
// what I make in a month: interest collected minus what I owe investors and partners
function myMonth(ym){
  const due=db.loans.filter(l=>hasPeriod(l,ym));
  const expectedM=r2(due.reduce((s,l)=>s+expected(l,ym),0));
  const collected=r2(db.payments.filter(p=>p.period===ym).reduce((s,p)=>s+(+p.interest||0),0));
  const others=r2(db.investors.filter(i=>!i.owner).reduce((s,i)=>s+dividend(i,ym),0));
  const o=owner(),own=o?dividend(o,ym):0,est=r2(expectedM-others);
  return {ym,expectedM,collected,others,own,margin:r2(est-own),est,real:r2(collected-others),current:ym===curYM()};
}
function myHistory(){let acc=0;return monthsRange().map(p=>{const m=myMonth(p);const v=m.current?m.est:m.real;if(!m.current)acc+=m.real;m.value=v;m.acc=r2(acc);return m})}
function invHistory(i){let acc=0;return invPeriods(i).map(p=>{const a=payoutAmt(i,p);acc+=a;return {p,a,acc:r2(acc),st:payoutStatus(i,p),current:p===curYM()}})}
function portfolio(){const act=db.loans.filter(l=>!l.closed);const lent=r2(act.reduce((s,l)=>s+outNow(l),0)),interest=r2(act.reduce((s,l)=>s+loanInt(l,outNow(l)),0));
  const others=r2(act.reduce((s,l)=>{const R=reparto(l);return s+R.parts.reduce((a,p)=>a+p.amt,0)},0));
  return {lent,interest,others,mine:r2(interest-others),n:act.length,clients:new Set(act.map(l=>l.borrowerId)).size,avg:lent?interest/lent*100:0}}
function totals(ym=curYM()){
  const active=db.loans.filter(l=>!l.closed);
  const capital=r2(db.investors.reduce((s,i)=>s+capitalOf(i),0));
  const lent=r2(active.reduce((s,l)=>s+outNow(l),0));
  const due=db.loans.filter(l=>hasPeriod(l,ym));
  const expectedM=r2(due.reduce((s,l)=>s+expected(l,ym),0));
  const collected=r2(due.reduce((s,l)=>s+(+payOf(l.id,ym)?.interest||0),0));
  const divOthers=r2(db.investors.filter(i=>!i.owner).reduce((s,i)=>s+dividend(i,ym),0));
  return {capital,lent,free:r2(capital-lent),expectedM,collected,divOthers,profit:r2(expectedM-divOthers),active:active.length};
}
function lateItems(){const out=[];db.loans.forEach(l=>periods(l,curYM()).forEach(p=>{if(isLate(l,p))out.push({l,p})}));return out.sort((a,b)=>dueISO(a.l,a.p)<dueISO(b.l,b.p)?-1:1)}
function monthItems(ym){return db.loans.filter(l=>hasPeriod(l,ym)).map(l=>({l,p:ym,due:dueISO(l,ym)})).sort((a,b)=>a.due<b.due?-1:a.due>b.due?1:borName(a.l).localeCompare(borName(b.l)))}

function niceStep(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v))),f=v/e;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*e}
// single-series monthly bars; tap a bar to read its value
function barsSVG(items,cap){
  if(!items.length)return '';
  const W=340,H=150,pl=40,pr=6,pt=18,pb=22,iw=W-pl-pr,ih=H-pt-pb;
  const max=Math.max(...items.map(x=>x.value),0),step=niceStep(max/3)||1,top=Math.max(step,Math.ceil(max/step)*step);
  const slot=iw/items.length,bw=Math.min(22,slot*.62),y=v=>pt+ih-(Math.max(0,v)/top)*ih;
  const last=items.length-1,mi=items.reduce((b,x,k)=>x.value>items[b].value?k:b,0);
  let g='';for(let v=0;v<=top+1e-9;v+=step){g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(v)}" y2="${y(v)}" stroke="rgba(150,175,210,${v?'.10':'.28'})"/><text x="${pl-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9" fill="#5A6577" font-family="var(--mono)">${v>=1000?'$'+(v/1000).toLocaleString('en-US',{maximumFractionDigits:1})+'k':'$'+v}</text>`}
  const bars=items.map((x,k)=>{const cx=pl+slot*k+slot/2,yy=y(x.value),hgt=pt+ih-yy,r=Math.min(4,hgt);

/* ============ client score ============ */
// 100 = always on time. Each day late on average costs points; partial and unpaid months cost more.
// Builds over time: needs 3 due payments before it shows a grade; recent months weigh double.
const SCORE_MIN=3;
function clientScore(bid){const items=[];db.loans.filter(l=>l.borrowerId===bid).forEach(l=>periods(l,curYM()).forEach(p=>{const due=dueISO(l,p);if(due>today())return;const st=status(l,p),pay=payOf(l.id,p);
    const d=pay&&st!=='parcial'?Math.max(0,daysBetween(due,pay.date||due)):daysBetween(due,today());items.push({p,d,st})}));
  const n=items.length;if(!n)return null;if(n<SCORE_MIN)return {pending:true,n};
  items.sort((a,b)=>a.p<b.p?-1:1);let W=0,pts=0,late=0,partial=0,open=0,days=0;
  items.forEach((x,k)=>{const w=k>=n-6?2:1;let sc=100-Math.min(60,x.d*2.5);if(x.st==='parcial'){sc-=20;partial++}if(x.st==='atrasado'){sc-=35;open++}if(x.d>2)late++;days+=x.d;pts+=Math.max(0,sc)*w;W+=w});
  const score=Math.round(pts/W),grade=score>=90?'A':score>=75?'B':score>=60?'C':'D';
  return {score,grade,avg:Math.round(days/n*10)/10,onTime:Math.round((n-late)/n*100),n,partial,open}}
const scoreChip=S=>!S?'<span class="grade g-N">Nuevo</span>':S.pending?`<span class="grade g-N">Nuevo · ${S.n}/${SCORE_MIN}</span>`:`<span class="grade g-${S.grade}" title="Score ${S.score}">${S.grade} · ${S.score}</span>`;

/* ============ debt payoff plan ============ */
const SKINS={citi:['#F06A1E','#9E3A0A'],sapphire:['#163B78','#071530'],freedom:['#2A72D6','#0E3474'],student:['#1C93B4','#0B4A63'],onyx:['#2B2F38','#0E1015'],teal:['#1A6B62','#0B2E2E']};
const PRESETS=[{name:'Home Depot',issuer:'Citibank',skin:'citi',kind:'tarjeta'},{name:'Freedom Unlimited',issuer:'Chase',skin:'freedom',kind:'tarjeta'},{name:'Freedom Student',issuer:'Chase',skin:'student',kind:'tarjeta'},{name:'Sapphire',issuer:'Chase',skin:'sapphire',kind:'tarjeta'}];
const KIND_L={tarjeta:'Tarjeta',prestamo:'Préstamo',auto:'Auto',otro:'Otra deuda'};
function budget(){const st=db.settings,F=finances(),sal=+st.salary||0,exp=+st.expenses||0,orb=st.useOrbit===false?0:Math.max(0,F.net+F.cost);
  // money left each month after living expenses; card interest is handled inside the simulation
  return {sal,exp,orb,free:r2(sal-exp+orb)}}
function simulate(strategy,extraTotal){
  let ds=db.cards.filter(c=>(+c.balance||0)>0).map(c=>({id:c.id,name:c.name,bal:+c.balance,apr:+c.apr||0,promo:c.promoEnd||'',min:Math.min(+c.balance,+c.minPay||Math.max(25,(+c.balance)*.02)),paidOff:null,interest:0}));
  if(!ds.length)return {months:0,interest:0,order:[],first:[],ok:true};
  const minSum=ds.reduce((s,d)=>s+d.min,0),pay=Math.max(extraTotal,0);if(pay<minSum-0.01)return {ok:false,minSum,months:null};
  let ym=curYM(),month=0,total=0;const first={};
  const order=()=>ds.filter(d=>d.bal>0.005).sort((a,b)=>{if(strategy==='snow')return a.bal-b.bal;const ra=a.promo&&a.promo>=ym+'-31'?0:a.apr,rb=b.promo&&b.promo>=ym+'-31'?0:b.apr;
    // a promo ending within 3 months goes first so it is cleared before interest starts
    const soon=d=>d.promo&&d.promo>=ym&&d.promo<=addM(ym,3)+'-31'?1:0;if(soon(a)!==soon(b))return soon(b)-soon(a);return rb-ra||a.bal-b.bal});
  while(ds.some(d=>d.bal>0.005)&&month<600){
    ds.forEach(d=>{if(d.bal<=0)return;const r=d.promo&&d.promo>=ym+'-01'?0:d.apr;const i=d.bal*r/1200;d.bal+=i;d.interest+=i;total+=i});
    let left=pay;const live=order();
    live.forEach(d=>{const m=Math.min(d.min,d.bal);d.bal-=m;left-=m;if(month===0)first[d.id]=(first[d.id]||0)+m});
    for(const d of order()){if(left<=0)break;const x=Math.min(left,d.bal);d.bal-=x;left-=x;if(month===0)first[d.id]=(first[d.id]||0)+x}
    ds.forEach(d=>{if(d.bal<=0.005&&!d.paidOff){d.bal=0;d.paidOff=addM(ym,0)}});
    month++;ym=addM(ym,1);
  }
  return {ok:month<600,months:month,interest:r2(total),end:addM(curYM(),month-1),order:[...ds].sort((a,b)=>(a.paidOff||'9')<(b.paidOff||'9')?-1:1),first,minSum};
}
function debtPlan(){
  const B=budget(),strat=db.settings.strategy||'aval',free=B.free;
  const plan=simulate(strat,free),alt=simulate(strat==='aval'?'snow':'aval',free),mins=simulate(strat,db.cards.reduce((s,c)=>s+Math.min(+c.balance||0,+c.minPay||Math.max(25,(+c.balance||0)*.02)),0));
  const tips=[];const F=finances();
  if(!db.cards.some(c=>+c.balance>0))return {plan,tips,B,strat,none:true};
  if(!B.sal)tips.push('Agrega tu ingreso mensual del trabajo para calcular cuánto puedes pagar cada mes.');
  if(plan.ok===false)tips.push(`Con ${fmt(free)} al mes no cubres los pagos mínimos (${fmt(plan.minSum)}). Baja gastos o deja de reinvertir por un tiempo.`);
  const top=plan.order&&[...plan.order].sort((a,b)=>((plan.first[b.id]||0)-b.min)-((plan.first[a.id]||0)-a.min))[0];
  if(plan.ok&&top)tips.push(`Pon todo el dinero extra en <b>${h(top.name)}</b> y paga el mínimo en las demás.`);
  if(plan.ok&&alt.ok&&alt.interest-plan.interest>1)tips.push(`Este orden te ahorra <b>${fmt(alt.interest-plan.interest)}</b> en intereses comparado con el otro método.`);
  if(plan.ok&&mins.ok&&mins.interest-plan.interest>1)tips.push(`Pagando solo mínimos pagarías <b>${fmt(mins.interest)}</b> de intereses y tardarías ${mins.months} meses. Con este plan, ${fmt(plan.interest)} y ${plan.months} meses.`);
  db.cards.filter(c=>c.promoEnd&&c.promoEnd>=today()&&+c.balance>0).forEach(c=>{const m=Math.max(1,daysBetween(today(),c.promoEnd)/30.4|0);tips.push(`La promo 0% de <b>${h(c.name)}</b> termina el ${dLong(c.promoEnd)}. Para liquidarla antes necesitas <b>${fmt(c.balance/m)}</b> al mes.`)});
  // is lending card money worth it?
  const P=portfolio(),avgM=P.avg,o=owner();
  db.cards.filter(c=>(+c.apr||0)>0&&F.src.byCard[c.id]).forEach(c=>{const yearly=avgM*12,net=yearly-(+c.apr);tips.push(net>0?`El dinero de <b>${h(c.name)}</b> que prestas rinde ~${pct(r2(yearly))} al año contra ${pct(c.apr)} de la tarjeta: te deja ~${pct(r2(net))} neto, pero es el que más riesgo tiene. Págala primero si un cliente se atrasa.`:`El dinero de <b>${h(c.name)}</b> te cuesta más (${pct(c.apr)}) de lo que rinde prestado. Conviene pagarla ya.`)});
  return {plan,tips,B,strat,alt};
}
function debtPlanSection(){
  const D=debtPlan(),B=D.B,pl=D.plan;
  const head=D.none?`<div class="empty">Sin deudas registradas. Agrega tus tarjetas o préstamos para armar el plan.</div>`

}

function invChart(i,S,cap){

    <div class="stats" style="margin-top:0;margin-bottom:12px">
      <div class="stat"><div class="eyebrow">Total generado</div><div class="v" style="color:var(--ion)">${fmt(acc)}</div></div>
      <div class="stat"><div class="eyebrow">${dep?'ROI acumulado':'Promedio/mes'}</div><div class="v">${dep?pct(r2(acc/dep*100)):fmt(avg)}</div></div>
      <div class="stat"><div class="eyebrow">${dep?'ROI mensual':'Meses'}</div><div class="v">${dep?pct(r2(avg/dep*100)):closed.length}</div></div>

    fr.disabled=!!i.owner;fr.placeholder=i.owner?'resto':(+i.rate?String(i.rate):'%');if(i.owner)fr.value='';

    el.querySelector('.part-av').textContent=`${i.name}: disponible ${fmt(capitalOf(i)-placedNow(i)+mine)}`});
  const sum=sl.reduce((s,x)=>s+x.amount,0),d=r2(p-sum);
  $('#fundHint').innerHTML=!p?'Escribe el monto total y repártelo en partes.':d===0?'<span style="color:var(--ok)">Monto completo asignado ✓</span>':d>0?`Falta asignar <b class="num">${fmt(d)}</b> · <button type="button" style="color:var(--ion);font-weight:600" data-act="fundRest">Ponerlo a mi nombre</button>`:`<span style="color:var(--bad)">Te pasaste por ${fmt(-d)}</span>`;
  if(!sl.length||(!rate&&sl.some(x=>x.crate==null))){$('#splitHint').innerHTML='<span class="muted">Escribe montos y tasas para ver el reparto.</span>';return}
  let mineT=0,totT=0;
  const blocks=sl.map(x=>{const i=inv(x.investorId),cr=x.crate??rate,tot=x.amount*cr/100,shr=x.shares.reduce((s,y)=>s+y.rate,0),ir=i.owner?cr-shr:(x.rate??+i.rate),myR=i.owner?ir:cr-ir-shr,mine=x.amount*myR/100;mineT+=mine;totT+=tot;
    const parts=[...(i.owner?[]:[[i.name,ir,x.amount*ir/100]]),...x.shares.map(y=>[inv(y.investorId)?.name,y.rate,x.amount*y.rate/100])];
    return `<div style="padding:6px 0;border-top:1px solid var(--line)"><div class="kv" style="padding-block:2px"><b>${h(i.name)} · ${fmt(x.amount)} al ${pct(cr)}</b><span class="num">${fmt(tot)}/mes</span></div>
      ${parts.map(([n,r,a])=>`<div class="kv" style="padding-block:1px"><span class="muted">${h(n)} · ${pct(r)}</span><span class="num muted">−${fmt(a)}</span></div>`).join('')}
      <div class="kv" style="padding-block:1px"><span style="color:${mine<0?'var(--bad)':'var(--ion)'}">Tú · ${pct(r2(myR))}</span><span class="num" style="color:${mine<0?'var(--bad)':'var(--ion)'}">${fmt(mine)}</span></div></div>`}).join('');
  $('#splitHint').innerHTML=`<div class="kv" style="padding-top:0"><span>Cliente paga en total</span><span class="num">${fmt(totT)}/mes</span></div>${blocks}<div class="kv" style="border-top:1px solid var(--line-2);padding-top:8px"><b>Te queda en total</b><span class="num" style="font-weight:700;color:${mineT<0?'var(--bad)':'var(--ion)'}">${fmt(mineT)}/mes</span></div>`;
}

const dedRow=(d={})=>`<div class="fund ded"><input data-dc value="${h(d.concept||'')}" placeholder="Concepto (ej. Wire fee)" aria-label="Concepto"><input data-da inputmode="decimal" value="${d.amount??''}" placeholder="0.00" aria-label="Monto"><button type="button" class="dim" data-act="rmDed" aria-label="Quitar">✕</button></div>`;
function sheetPayout(id,p){

  const lines=db.loans.filter(l=>hasPeriod(l,p)&&involved(l,i)).map(l=>{const a=sumAmt(linesFor(i,l,outBefore(l,p)));const s=status(l,p);return `<div class="kv"><span class="muted">${h(borName(l))} · Día ${l.payDay} ${s==='pagado'?'':`<span class="chip s-${s}" style="padding:3px 6px">${STATUS_L[s]}</span>`}</span><span class="num">${fmt(a)}</span></div>`}).join('');

    <div class="hint" id="poHint"></div>

    <div class="grid2 po-pay">${fld('Método',`<select id="method" name="method">${METHODS.map(m=>`<option ${(po?.method||i.payMethod||'Zelle')===m?'selected':''}>${m}</option>`).join('')}</select>`)}${fld('Enviado a',`<input id="dest" name="dest" value="${h(po?.dest||i.payDest||'')}" placeholder="Zelle, cuenta…">`)}</div>

function readDeds(){return [...document.querySelectorAll('#deds .ded')].map(r=>({concept:r.querySelector('[data-dc]').value.trim()||'Deducción',amount:r2(num(r.querySelector('[data-da]').value))})).filter(x=>x.amount>0)}
function poUpdate(){
  const f=$('form[data-form=payout]');if(!f)return;const st=f.status.value,i=inv(f.dataset.id),p=f.dataset.p;
  const gross=r2(num(f.gross.value)),ded=readDeds().reduce((s,x)=>s+x.amount,0),net=r2(gross-ded),late=daysBetween(payoutDue(i,p),f.date.value||today());
  f.querySelectorAll('.po-pay').forEach(x=>x.hidden=st!=='pagado');
  $('#poHint').innerHTML=st==='pagado'?(late>0?`<span style="color:var(--warn)">${late} días después de la fecha de pago</span>`:'A tiempo'):st==='enespera'?'El dinero se queda en tu cuenta y se suma a su capital en espera de ser prestado.':st==='reinvertido'?'Se suma a su capital para volver a prestarlo.':'Aún no le has pagado.';
  $('#poNet').innerHTML=st==='pendiente'?'<span class="muted">Sin pago registrado.</span>':`<div class="kv"><span class="muted">Rendimiento</span><span class="num">${fmt(gross)}</span></div>${readDeds().map(d=>`<div class="kv"><span class="muted">${h(d.concept)}</span><span class="num" style="color:var(--bad)">−${fmt(d.amount)}</span></div>`).join('')}<div class="kv" style="border-top:1px solid var(--line);padding-top:8px"><b>${st==='pagado'?'Pagado':'Se suma a su capital'}</b><span class="num" style="font-weight:700;color:var(--ion)">${fmt(net)}</span></div>`;
}
function savePayout(f){
  const i=inv(f.dataset.id),p=f.dataset.p,st=f.status.value,ex=payoutOf(i,p);
  if(ex){db.movements=db.movements.filter(m=>m.payoutId!==ex.id);db.payouts=db.payouts.filter(x=>x!==ex)}
  if(st!=='pendiente'){
    const gross=r2(num(f.gross.value)),deductions=readDeds(),net=r2(gross-deductions.reduce((s,x)=>s+x.amount,0)),date=f.date.value||today(),id=ex?.id||uid();
    const rec={id,investorId:i.id,period:p,amount:gross,gross,deductions,net,status:st,date,method:st==='pagado'?f.method.value:'',dest:st==='pagado'?f.dest.value.trim():'',note:f.note.value.trim()};
    db.payouts.push(rec);
    if(st==='pagado'){i.payMethod=rec.method;if(rec.dest)i.payDest=rec.dest}
    else db.movements.push({id:uid(),investorId:i.id,type:'reinversion',amount:net,date,note:(st==='enespera'?'En espera · ':'Reinvertido · ')+ymLabel(p),payoutId:id,held:st==='enespera'});
  }
  save();closeSheet();render();toast(st==='pendiente'?'Marcado pendiente':st==='pagado'?'Pago registrado':'Sumado a su capital');
}

function collectAll(bid){
  const ym=curYM(),ids=[];
  db.loans.filter(l=>l.borrowerId===bid&&!l.closed&&hasPeriod(l,ym)&&status(l,ym)!=='pagado').forEach(l=>{let pay=payOf(l.id,ym);if(!pay){pay={id:uid(),loanId:l.id,period:ym,capital:0,note:''};db.payments.push(pay)}pay.interest=expected(l,ym);pay.date=today();ids.push(l.id)});
  save();render();if(ids.length){toast(`${ids.length} cobro${ids.length>1?'s':''} marcado${ids.length>1?'s':''}`);sheetOwe(ids,ym)}
}

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  if(el.dataset.confirm&&!el.classList.contains('armed')){
    ev.preventDefault();el.classList.add('btn','armed');el.dataset.label=el.innerHTML;el.textContent='¿Seguro? Toca otra vez';
    clearTimeout(el._t);el._t=setTimeout(()=>{el.classList.remove('armed');el.innerHTML=el.dataset.label},3500);return;
  }
  const fn=ACTIONS[el.dataset.act];if(fn){ev.preventDefault();fn(el)}
});

document.addEventListener('submit',ev=>{
  const f=ev.target;ev.preventDefault();const err=m=>{f.querySelector('.err').textContent=m};
  const k=f.dataset.form;
  if(k==='pay'){
    const l=loanById(f.dataset.l),p=f.dataset.p,interest=r2(num(f.interest.value)),capital=r2(num(f.capital.value));
    if(capital>outBefore(l,p)+0.005)return err('El abono es mayor que el capital pendiente.');
    let pay=payOf(l.id,p);if(!pay){pay={id:uid(),loanId:l.id,period:p};db.payments.push(pay)}
    Object.assign(pay,{interest,capital,date:f.date.value||today(),note:f.note.value.trim()});
    let msg='Cobro guardado';
    if(!l.closed&&outNow(l)<=0){l.closed=maxISO(pay.date,dueISO(l,p));msg='Préstamo liquidado'}
    save();render();toast(msg);if(pay.interest>0)sheetOwe([l.id],p);else closeSheet();return;
  }
  if(k==='payout'){savePayout(f);return}
  if(k==='car'){const c=f.dataset.id?db.cars.find(x=>x.id===f.dataset.id):null,name=f.name.value.trim();if(!name)return err('Escribe el carro.');const d={name,buy:r2(num(f.buy.value)),date:f.date.value||today(),ask:r2(num(f.ask.value)),note:f.note.value.trim(),costs:readDeds().map(x=>({concept:x.concept,amount:x.amount}))};if(f.soldPrice&&num(f.soldPrice.value)>0){d.sold=true;d.soldPrice=r2(num(f.soldPrice.value));d.soldDate=f.soldDate.value||today()}else{d.sold=false}if(c)Object.assign(c,d);else db.cars.push({id:uid(),...d});save();closeSheet();render();toast(d.sold?'Carro vendido':'Guardado');return}
  if(k==='cctx'){const c=db.cards.find(x=>x.id===f.dataset.id),a=r2(num(f.amount.value)),ty=f.dataset.v;if(a<=0)return err('Escribe el monto.');if(ty==='pago'&&a>c.balance+0.005)return err('El abono es mayor que el saldo.');c.txns=c.txns||[];c.txns.push({id:uid(),type:ty,amount:a,date:f.date.value||today(),note:f.note.value.trim()});c.balance=r2((+c.balance||0)+(ty==='pago'?-a:a));save();render();sheetCC(c.id);toast(ty==='pago'?'Abono registrado':'Cargo registrado');return}
  if(k==='goal'){const g=f.dataset.id?db.goals.find(x=>x.id===f.dataset.id):null,d={type:f.type.value,title:f.title.value.trim()||GOAL_T[f.type.value],target:r2(num(f.target.value)),date:f.date.value||'',manual:r2(num(f.manual?.value||0))};if(g)Object.assign(g,d);else db.goals.push({id:uid(),start:today(),startVal:d.type==='sindeuda'?finances().debt:0,...d});save();closeSheet();render();return}
  if(k==='income'){Object.assign(db.settings,{salary:r2(num(f.salary.value)),expenses:r2(num(f.expenses.value)),useOrbit:f.useOrbit.checked});save();closeSheet();render();return}
  if(k==='card'){const c=f.dataset.id?db.cards.find(x=>x.id===f.dataset.id):null,d={name:f.name.value.trim()||'Deuda',kind:f.kind.value,balance:r2(num(f.balance.value)),apr:num(f.apr.value),minPay:r2(num(f.minPay.value))||0,promoEnd:f.promoEnd.value||'',limit:r2(num(f.limit.value))||0,dueDay:parseInt(f.dueDay.value,10)||0,last4:f.last4.value.replace(/\D/g,'').slice(0,4),skin:f.skin.value||'onyx',issuer:f.issuer.value};if(c)Object.assign(c,d);else db.cards.push({id:'c_'+uid(),...d});save();closeSheet();render();return}
  if(k==='savings'){db.settings.savings=r2(num(f.savings.value));save();closeSheet();render();return}
  if(k==='loan'){
    const principal=r2(num(f.principal.value)),rate=num(f.rate.value),payDay=parseInt(f.payDay.value,10),term=parseInt(f.term.value,10)||0;
    if(principal<=0)return err('Escribe el monto prestado.');

    if(!(payDay>=1&&payDay<=31))return err('El día de cobro va de 1 a 31.');
    if(!f.start.value)return err('Elige la fecha de inicio.');
    const funding=readSlices(f),shares=[];
    if(rate<=0&&funding.some(x=>x.crate==null))return err('Escribe la tasa general o la tasa de cada parte.');
    const sum=r2(funding.reduce((s,x)=>s+x.amount,0));
    if(Math.abs(sum-principal)>0.009)return err(`Lo asignado (${fmt(sum)}) debe sumar ${fmt(principal)}.`);
    let bid=f.borrower.value;
    if(bid==='__new'){const n=f.newBor.value.trim();if(!n)return err('Escribe el nombre del cliente.');const b={id:'b_'+uid(),name:n,phone:'',color:COLORS[db.borrowers.length%COLORS.length],note:''};db.borrowers.push(b);bid=b.id}
    const data={borrowerId:bid,principal,rate,payDay,start:f.start.value,term,funding,shares,note:f.note.value.trim()};
    let l=f.dataset.id?loanById(f.dataset.id):null;
    if(l)Object.assign(l,data);else{l={id:'l_'+uid(),closed:null,...data};db.loans.push(l)}
    save();closeSheet();if(!f.dataset.id){ui.tab='loans';ui.stack=[{type:'loan',id:l.id}]}render();toast(f.dataset.id?'Cambios guardados':'Préstamo creado');return;
  }
  if(k==='inv'){
    const name=f.name.value.trim();if(!name)return err('Escribe el nombre.');
    let i=f.dataset.id?inv(f.dataset.id):null;
    const rate=f.rate?num(f.rate.value):0;
    const pay=f.payMethod?{payMethod:f.payMethod.value,payDest:f.payDest.value.trim(),payDay:parseInt(f.payDay.value,10)||0}:{};
    if(i)Object.assign(i,{name,rate:i.owner?0:rate,phone:f.phone.value.trim(),note:f.note.value.trim()},pay);
    else{i={id:'inv_'+uid(),name,rate,owner:false,phone:f.phone.value.trim(),note:f.note.value.trim(),...pay};db.investors.push(i);
      const a=r2(num(f.amount.value));if(a>0)db.movements.push({id:uid(),investorId:i.id,type:'aporte',amount:a,date:f.date.value||today(),note:'Aporte inicial'});
      ui.tab='inv';ui.stack=[{type:'inv',id:i.id}];}
    save();closeSheet();render();toast('Guardado');return;
  }
  if(k==='move'){
    const a=r2(num(f.amount.value));if(a<=0)return err('Escribe el monto.');
    let source;if(f.source){source=f.source.value;if(source==='__new'){const n=f.newCard.value.trim();if(!n)return err('Escribe el nombre de la tarjeta.');const c={id:'c_'+uid(),name:n,balance:a,apr:0};db.cards.push(c);source=c.id}else if(source!=='ahorro'){const c=db.cards.find(x=>x.id===source);if(c)c.balance=r2((+c.balance||0)+a)}}
    db.movements.push({id:uid(),investorId:f.dataset.id,type:f.dataset.v,amount:a,date:f.date.value||today(),note:f.note.value.trim(),...(source?{source}:{})});
    save();closeSheet();render();toast(f.dataset.v==='aporte'?'Aporte registrado':'Retiro registrado');return;
  }
  if(k==='bor'){
    const b=bor(f.dataset.id);Object.assign(b,{name:f.name.value.trim()||b.name,phone:f.phone.value.trim(),note:f.note.value.trim(),color:(f.querySelector('input[name=color]:checked')||{}).value||b.color});
    save();closeSheet();render();return;
  }
  if(k==='close'){const l=loanById(f.dataset.id);l.closed=f.date.value||today();save();closeSheet();render();toast('Préstamo liquidado')}
});

/* ============ calendar reminders (.ics) ============ */
function exportICS(){
  const esc=t=>String(t).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,' ');
  const t=today(),stamp=t.replace(/-/g,'')+'T120000Z';
  const next=day=>{let ym=curYM();for(let k=0;k<3;k++){const[y,m]=ym.split('-').map(Number);const d=`${ym}-${pad(Math.min(day,dim(y,m)))}`;if(d>=t)return d.replace(/-/g,'');ym=addM(ym,1)}return t.replace(/-/g,'')};
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Orbit//Prestamos//ES','CALSCALE:GREGORIAN','X-WR-CALNAME:Orbit'];
  const ev=(uidv,title,day,desc)=>{L.push('BEGIN:VEVENT','UID:'+uidv+'@orbit','DTSTAMP:'+stamp,'DTSTART:'+next(day)+'T090000','DURATION:PT30M',`RRULE:FREQ=MONTHLY;BYMONTHDAY=${day>28?-1:day}`,'SUMMARY:'+esc(title),'DESCRIPTION:'+esc(desc),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc(title),'TRIGGER:PT0M','END:VALARM','END:VEVENT')};
  let n=0;
  db.loans.filter(l=>!l.closed).forEach(l=>{ev('cobro-'+l.id,`Orbit · Cobrar a ${borName(l)} ${fmt(loanInt(l,outNow(l)))}`,+l.payDay,'Marca el cobro en Orbit');n++});
  db.investors.filter(i=>!i.owner&&monthlyNow(i)>0).forEach(i=>{const days=db.loans.filter(l=>!l.closed&&involved(l,i)).map(l=>+l.payDay);const d=+i.payDay||Math.max(...days);ev('pago-'+i.id,`Orbit · Pagar a ${i.name} ${fmt(monthlyNow(i))}`,d,'Registra el pago en Orbit');n++});
  db.cards.filter(c=>+c.dueDay&&+c.balance>0).forEach(c=>{ev('tdc-'+c.id,`Orbit · Pagar ${c.name}`,+c.dueDay,'Pago de tarjeta');n++});
  if(!n){toast('No hay préstamos activos');return}
  shareFile(new Blob([L.concat('END:VCALENDAR').join('\r\n')],{type:'text/calendar'}),'orbit-recordatorios.ics');
}

/* ============ files ============ */
function shareFile(blob,name){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).catch(e=>{if(e&&e.name!=='AbortError')download(blob,name)});return;
  }
  download(blob,name);
}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}

function pdfKit(headerRight){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'letter'});
  const W=612,H=792,M=44;

    const by=full?128:34;for(let j=0;j<80;j++){const t=j/79;k.fill([0,1,2].map(n=>C.ionL[n]+(C.blue[n]-C.ionL[n])*t));doc.rect(j*W/80,by,W/80+.6,2.5,'F')}
    const lx=M+11,ly=full?38:17,ls=full?26:18;if(LOGO_PNG){try{doc.addImage(LOGO_PNG,'PNG',lx-ls/2,ly-ls/2,ls,ls)}catch(e){}}else{k.draw(C.ionL);doc.setLineWidth(1.1);doc.ellipse(lx,ly,11,4.4,'S');k.fill(C.ionL);doc.circle(lx,ly,3.6,'F')}
    k.font(9,'bold');k.col([255,255,255]);k.T('ORBIT',M+30,ly+3.2,{charSpace:3});k.font(7.5,'bold');k.col(C.ionL);k.T('PRIVATE CAPITAL',M+30+doc.getTextWidth('ORBIT')+28,ly+3,{charSpace:1.6});
    k.font(8);k.col([150,162,182]);k.T(full?'Generado el '+dLong(today()):headerRight,W-M,ly+3,{align:'right'});
    if(full){k.font(26,'bold');k.col([255,255,255]);k.T(title,M,86);k.font(10);k.col([150,162,182]);k.T(sub,M,106);k.font(8,'bold');k.col(C.ionL);k.T(tag.toUpperCase(),W-M,106,{align:'right',charSpace:1.2})}
  };
  k.ensure=need=>{if(k.y+need>H-58){doc.addPage();k.band(false);k.y=70}};
  // big number panel: headline + up to 4 small stats
  k.panel=(lbl,val,stats)=>{
    const y=k.y;k.fill(C.soft);doc.roundedRect(M,y,W-2*M,112,10,10,'F');k.fill(C.ion);doc.rect(M,y+16,3,30,'F');
    k.label(lbl,M+20,y+26);k.font(28,'bold');k.col(C.ion);k.T(val,W-M-20,y+40,{align:'right'});
    k.draw(C.line);doc.setLineWidth(.8);doc.line(M+20,y+58,W-M-20,y+58);
    const cw=(W-2*M-40)/stats.length;stats.forEach(([v,l,c],j)=>{const cx=M+20+cw*j+cw/2;k.font(stats.length>3?11.5:13,'bold');k.col(c||C.fg);k.T(v,cx,y+82,{align:'center'});k.font(6.8);k.col(C.muted);k.T(l.toUpperCase(),cx,y+96,{align:'center',charSpace:.8})});
    k.y+=136;
  };
  k.table=(title,cols,rows,note)=>{

        k.T(o.t,c.a==='r'?x+c.w-8:x+8+(o.ind||0),k.y+rh/2+3.3,{align:c.a==='r'?'right':'left'});x+=c.w});
      k.y+=rh;k.draw(C.line);doc.setLineWidth(.6);doc.line(M,k.y,W-M,k.y)});

    const slot=(x1-x0)/items.length,bw=Math.min(30,slot*.58),last=items.length-1,mi=items.reduce((b,x,j)=>x.value>items[b].value?j:b,0);

        else{k.fill(C.ion);doc.roundedRect(cx-bw/2,yy,bw,hh,2.5,2.5,'F');if(hh>3)doc.rect(cx-bw/2,base-3,bw,3,'F')}}
      if((j===last||j===mi)&&x.value>0){k.font(7.8,'bold');k.col(C.fg);k.T(fmt(x.value).replace('.00',''),cx,yy-5,{align:'center'})}
      k.font(7.2);k.col(C.muted);k.T(x.short,cx,base+12,{align:'center'})});
    k.y=base+22;if(items.some(x=>x.est)){k.font(7);k.col(C.faint);k.T('Barra punteada: mes en curso, estimado.',x0,k.y);k.y+=8}
    k.y+=22;
  };
  k.finish=(name,disclaimer)=>{const n=doc.getNumberOfPages();
    for(let p=1;p<=n;p++){doc.setPage(p);k.draw(C.line);doc.setLineWidth(.6);doc.line(M,H-46,W-M,H-46);
      if(p===n&&disclaimer){k.font(6.8);k.col(C.faint);disclaimer.forEach((t,j)=>k.T(t,M,H-34+j*9))}
      k.font(7.5,'bold');k.col(C.muted);k.T('Orbit  ·  Documento confidencial',W/2,H-14,{align:'center'});k.font(7.5);k.T(`${p} / ${n}`,W-M,H-14,{align:'right'})}
    window.__lastPdf=doc;shareFile(doc.output('blob'),name)};
  return k;
}
const fileSafe=s=>String(s).replace(/[^\wÁÉÍÓÚáéíóúñÑ]+/g,'-');

function exportPDF(i){
  if(!window.jspdf){toast('No se pudo cargar el generador de PDF');return}
  const S=summary(i),ym=curYM(),k=pdfKit(`${i.name}  ·  Estado de cuenta`),{doc,W,M,C}=k;
  k.band(true,'Estado de Cuenta','Inversión activa  ·  Préstamos privados','Corte '+ymLong(ym));
  k.y=166;
  k.label('Inversionista',M,k.y);k.label('Modalidad',W-M,k.y,{align:'right'});
  k.font(20,'bold');k.col(C.fg);k.T(i.name,M,k.y+24);
  k.font(10,'bold');k.T(`Rendimiento de ${rateText(i)}`,W-M,k.y+15,{align:'right'});
  k.font(9);k.col(C.muted);k.T(S.partner?'Participación sobre capital prestado  ·  pago mensual':'Sobre capital colocado  ·  pago mensual',W-M,k.y+29,{align:'right'});
  k.y+=46;k.draw(C.line);doc.setLineWidth(.8);doc.line(M,k.y,W-M,k.y);k.y+=20;
  if(S.partner)k.panel('Rendimiento mensual estimado',fmt(S.mo),[[fmt(S.base),'Capital de referencia'],[String(S.n),'Préstamos activos'],[rateText(i).replace(' mensual',''),'Tasa mensual',C.ion]]);
  else k.panel('Saldo total de su inversión',fmt(S.cap),[[fmt(S.pl),'Invertido · generando'],[fmt(S.fr),'En espera de ser prestado'],[fmt(S.mo),'Rendimiento mensual estimado',C.ion]]);

  const Hs=invHistory(i),dep=deposits(i),acc=Hs.length?Hs[Hs.length-1].acc:0,closed=Hs.filter(x=>!x.current),avg=closed.length?closed.reduce((s,x)=>s+x.a,0)/closed.length:0;
  k.chart('Rendimiento generado por mes',Hs.map(x=>({short:shortM(x.p),value:x.a,est:x.current})),
    dep?[[fmt(dep),'Capital aportado'],[fmt(acc),'Total generado',C.ion],[pct(r2(acc/dep*100)),'ROI acumulado',C.ion],[pct(r2(avg/dep*100)),'ROI mensual promedio']]
       :[[fmt(acc),'Total generado',C.ion],[fmt(avg),'Promedio mensual'],[String(closed.length),'Meses cobrados']]);

  const SC={pagado:C.ok,reinvertido:C.reinv,enespera:C.blue,pendiente:C.muted};
  const SL={pagado:'Pagado',reinvertido:'Reinvertido',enespera:'En espera',pendiente:'Pendiente'};
  if(Hs.length)k.table('Pagos de rendimiento',[{h:'Mes',w:66},{h:'Generado',w:74,a:'r'},{h:'Deducción',w:70,a:'r'},{h:'Neto',w:74,a:'r'},{h:'Estado',w:70},{h:'Fecha · Vía',w:170}],
    Hs.map(x=>{const po=payoutOf(i,x.p),ded=po?.deductions?.reduce((s,d)=>s+d.amount,0)||0,st=po?.status||'pendiente',via=po?(dShort(po.date)+(po.status==='pagado'?'  ·  '+[po.method,po.dest].filter(Boolean).join(' · '):'  ·  en su capital')):'Vence '+dShort(payoutDue(i,x.p));
      return {cells:[{t:ymLabel(x.p),b:true},{t:fmt(x.a),c:C.ion,b:true},{t:ded?'-'+fmt(ded):'—',c:ded?C.bad:C.faint},{t:fmt(po?po.net:x.a),b:true},{t:SL[st],c:SC[st]||C.muted,b:true,s:8.5},{t:via.length>40?via.slice(0,39)+'…':via,c:C.muted,s:8}]}}),
    'En espera / reinvertido: el rendimiento se suma a su capital y queda en espera de ser prestado.');
  const dl=[];Hs.forEach(x=>{const po=payoutOf(i,x.p);(po?.deductions||[]).forEach(d=>dl.push(`${ymLabel(x.p)}: ${d.concept} -${fmt(d.amount)}`))});
  if(dl.length){k.y-=14;k.font(7.5);k.col(C.muted);k.T('Deducciones: '+dl.join('   ·   '),M,k.y,{maxWidth:W-2*M});k.y+=24}

  const pls=placements(i),groups=new Map();pls.forEach(x=>{if(!groups.has(x.l.borrowerId))groups.set(x.l.borrowerId,[]);groups.get(x.l.borrowerId).push(x)});
  const det=[];let totM=0;
  groups.forEach((xs,bid)=>{const b=bor(bid),capSum=xs.filter(x=>x.kind==='capital').reduce((s,x)=>s+x.base,0),m=xs.reduce((s,x)=>s+x.amt,0);totM+=m;
    det.push({group:true,cells:[{t:b?.name||'—',b:true,s:10.5},{t:`${xs.length} préstamo${xs.length>1?'s':''}${capSum&&S.pl?`  ·  ${Math.round(capSum/S.pl*1000)/10}% de su capital`:''}`,c:C.muted,s:8},{t:capSum?fmt(capSum):'',b:true},{t:fmt(m)+'/mes',c:C.ion,b:true}]});
    xs.forEach(x=>det.push({cells:[{t:'Día '+x.l.payDay,b:true,ind:14},{t:x.kind==='part'?`Participación ${pct(x.rate)} sobre ${fmt(x.base)}`:`${pct(x.rate)} mensual`,c:C.muted,s:9},{t:x.kind==='part'?'—':fmt(x.base)},{t:fmt(x.amt),c:C.ion,b:true}]}))});
  if(det.length){
    k.table('Detalle por cliente',[{h:'Día de cobro',w:115},{h:'',w:189},{h:'Capital',w:110,a:'r'},{h:'Monto mensual',w:110,a:'r'}],det);
    k.y-=16;k.ensure(40);k.fill(C.ink);doc.roundedRect(M,k.y,W-2*M,38,8,8,'F');k.font(8,'bold');k.col([170,182,200]);k.T('TOTAL MENSUAL ESTIMADO',M+16,k.y+23,{charSpace:1.3});k.font(16,'bold');k.col(C.ionL);k.T(fmt(totM),W-M-16,k.y+25,{align:'right'});k.y+=66;
  }
  const moves=db.movements.filter(m=>m.investorId===i.id).sort((a,b)=>a.date<b.date?-1:1);
  if(moves.length)k.table('Movimientos de capital',[{h:'Fecha',w:157},{h:'Concepto',w:236},{h:'Monto',w:131,a:'r'}],moves.map(m=>({cells:[dLong(m.date),{t:m.type==='aporte'?'Aporte':m.type==='retiro'?'Retiro':'Reinversión  ·  '+(m.note||''),c:C.muted},{t:(m.type==='retiro'?'-':'+')+fmt(m.amount),b:true,c:m.type==='retiro'?C.bad:m.type==='reinversion'?C.reinv:C.ok}]})));
  k.finish(`Estado-de-cuenta-${fileSafe(i.name)}-${ym}.pdf`,['Los montos corresponden al rendimiento pactado sobre el capital activo. Sujeto a variación por pagos anticipados o abonos a capital.','Este documento es informativo y no constituye un contrato.']);
}

// private report: the whole portfolio and what I keep
function exportAdminPDF(){
  if(!window.jspdf){toast('No se pudo cargar el generador de PDF');return}
  const ym=curYM(),k=pdfKit('Reporte de cartera  ·  Uso interno'),{doc,W,M,C}=k;
  const o=owner(),m=myMonth(ym),Hh=myHistory(),acc=Hh.length?Hh[Hh.length-1].acc:0,P=portfolio(),t=totals(),cap=o?capitalOf(o):0,pl=o?placedNow(o):0;
  k.band(true,'Reporte de Cartera','Administrador  ·  Uso interno, no compartir','Corte '+ymLong(ym));
  k.y=166;
  k.panel('Tu ganancia estimada del mes',fmt(m.est),[[fmt(m.own),'De tu capital'],[fmt(m.margin),'Margen sobre otros'],[fmt(acc),'Ganancia acumulada',C.ion],[fmt(cap),'Tu capital propio']]);
  const F=finances();if(db.cards.length||F.sav)k.panel('Ganancia neta después de tarjetas',fmt(F.net),[[fmt(F.src.ahorro),'Tu capital · ahorros'],[fmt(F.src.tarjetas),'Tu capital · tarjetas'],[fmt(F.cost),'Intereses TDC / mes',C.bad],[fmt(F.worth),'Si pagas TDC hoy']]);
  k.panel('Capital administrado',fmt(t.capital),[[fmt(P.lent),'Prestado'],[fmt(t.free),'En espera'],[fmt(P.interest),'Interés mensual'],[fmt(P.others),'Pagas a otros / mes']]);
  const closed=Hh.filter(x=>!x.current),avg=closed.length?closed.reduce((s,x)=>s+x.real,0)/closed.length:0;
  k.chart('Tu ganancia por mes',Hh.map(x=>({short:shortM(x.ym),value:Math.max(0,x.value),est:x.current})),
    [[fmt(acc),'Acumulado real',C.ion],[fmt(avg),'Promedio mensual'],[pct(r2(P.avg)),'Tasa promedio cartera'],[`${P.n} / ${P.clients}`,'Préstamos / clientes']]);
  const act=db.loans.filter(l=>!l.closed);
  const rows=act.map(l=>{const R=reparto(l);return {cells:[{t:`${borName(l)}  ·  Día ${l.payDay}`,b:true},fmt(R.o),rateLabel(l),fmt(R.total),{t:'-'+fmt(R.total-R.mine),c:C.muted},{t:fmt(R.mine),b:true,c:R.mine<0?C.bad:C.ion}]}});
  rows.push({total:true,cells:['Total',fmt(P.lent),pct(r2(P.avg)),fmt(P.interest),'-'+fmt(P.others),{t:fmt(P.mine),c:C.ion}]});
  k.table('Por préstamo',[{h:'Cliente',w:134},{h:'Capital',w:84,a:'r'},{h:'Tasa',w:52,a:'r'},{h:'Interés/mes',w:84,a:'r'},{h:'Pagas',w:84,a:'r'},{h:'Tu parte',w:86,a:'r'}],rows);
  const SC={pagado:C.ok,reinvertido:C.reinv,enespera:C.blue,pendiente:C.muted};
  k.table('Inversionistas y socios',[{h:'Nombre',w:124},{h:'Capital',w:84,a:'r'},{h:'Prestado',w:84,a:'r'},{h:'Tasa',w:84,a:'r'},{h:'Pago/mes',w:76,a:'r'},{h:'Estado '+shortM(ym),w:72,a:'r'}],
    db.investors.map(i=>{const S=summary(i),st=payoutStatus(i,ym);return {cells:[{t:i.name+(i.owner?'  (tú)':S.partner?'  (socio)':''),b:true},fmt(S.cap),fmt(S.pl),{t:rateText(i).replace(' mensual',''),c:C.muted,s:8.5},fmt(S.mo),i.owner?{t:'—',c:C.faint}:{t:STATUS_L[st],c:SC[st]||C.muted,b:true,s:8.5}]}}));
  if(Hh.length)k.table('Historial mensual',[{h:'Mes',w:120},{h:'Cobrado',w:101,a:'r'},{h:'Pagas a otros',w:101,a:'r'},{h:'Tu ganancia',w:101,a:'r'},{h:'Acumulado',w:101,a:'r'}],
    Hh.map(x=>({cells:[{t:ymLabel(x.ym)+(x.current?'  (en curso)':''),b:true},fmt(x.collected),{t:'-'+fmt(x.others),c:C.muted},{t:fmt(x.value),b:true,c:x.value<0?C.bad:C.ion},fmt(x.acc)]})),
    'Meses cerrados: cobrado real menos lo que pagas. Mes en curso: estimado.');
  k.finish(`Reporte-cartera-${ym}.pdf`,['Documento interno. Incluye tasas de clientes y márgenes: no compartir con inversionistas.']);
}
