<style>
/* Layout: one phone column, glass header, fixed tab bar. Manrope throughout, tabular figures. Single dark look by design. */
:root{
  --ink:#080B11; --panel:#0E131C; --panel-2:#131A26; --raise:#1A2232;
  --line:rgba(150,175,210,.11); --line-2:rgba(150,175,210,.22);
  --fg:#E9EEF5; --muted:#8693A8; --dim:#5A6577;
  --ion:#46E3C6; --ion-2:#4FA8FF; --ion-ink:#04140F;
  --ok:#3DD68C; --warn:#F2B84B; --bad:#FF6B6B; --reinv:#A08CFF; --idle:#7D8AA0;
  --display:'Manrope',ui-sans-serif,-apple-system,system-ui,sans-serif;
  --body:'Manrope',-apple-system,BlinkMacSystemFont,system-ui,'Segoe UI',Roboto,sans-serif;
  --mono:'Manrope',-apple-system,system-ui,sans-serif;
  --code:ui-monospace,'SF Mono',Menlo,monospace;
  --r:14px;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--fg)}
body{margin:0;font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
   radial-gradient(60% 40% at 100% 0%,rgba(70,227,198,.10),transparent 70%),
   radial-gradient(50% 35% at 0% 20%,rgba(79,168,255,.08),transparent 70%),
   linear-gradient(rgba(150,175,210,.035) 1px,transparent 1px) 0 0/28px 28px,
   linear-gradient(90deg,rgba(150,175,210,.035) 1px,transparent 1px) 0 0/28px 28px;
  -webkit-mask-image:linear-gradient(#000 0%,#000 30%,transparent 75%);mask-image:linear-gradient(#000 0%,#000 30%,transparent 75%)}
*{box-sizing:border-box}
[hidden]{display:none!important}
.discreet .priv{display:none!important}
.presenting .top,.presenting .tabs{display:none!important}
.presenting main{padding-top:calc(16px + env(safe-area-inset-top,0px))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:2px solid var(--ion);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:'tnum';font-weight:600;letter-spacing:-.01em}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.eyebrow{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font:600 10.5px/1.2 var(--body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(8,11,17,.72);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;min-height:58px;padding-block:8px}
.top h1{margin:0;font:600 20px/1.15 var(--display);letter-spacing:-.02em;text-wrap:balance}
.top .ttl{flex:1;min-width:0}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--panel-2);border:1px solid var(--line);color:var(--fg);flex:none}
.iconbtn svg{width:20px;height:20px}
.addbtn{height:38px;padding:0 14px;border-radius:12px;display:flex;align-items:center;gap:6px;font-weight:600;font-size:14px;color:var(--ion-ink);background:linear-gradient(135deg,var(--ion),var(--ion-2));box-shadow:0 6px 24px -8px rgba(70,227,198,.6)}
.addbtn svg{width:16px;height:16px}

main{padding-block:16px 120px;display:flex;flex-direction:column;gap:14px}
section{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:6px;padding-inline:2px}
.sec-h h2{margin:0;font:600 15px/1.2 var(--display);letter-spacing:-.01em}

.card{background:linear-gradient(180deg,var(--panel-2),var(--panel));border:1px solid var(--line);border-radius:var(--r);padding:16px}
.hero{position:relative;overflow:hidden;border:1px solid transparent;
  background:linear-gradient(160deg,#121A27,#0B1018) padding-box,linear-gradient(135deg,rgba(70,227,198,.6),rgba(79,168,255,.18) 45%,rgba(150,175,210,.14)) border-box}
.hero::after{content:"";position:absolute;right:-60px;top:-70px;width:220px;height:220px;border-radius:50%;border:1px solid rgba(70,227,198,.18);box-shadow:0 0 0 26px rgba(70,227,198,.03),0 0 0 54px rgba(79,168,255,.025);pointer-events:none}
.big{font:600 34px/1.05 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;margin-top:6px}
.big.ion{background:linear-gradient(90deg,var(--ion),var(--ion-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:16px}
.stat .v{font:500 14.5px/1.2 var(--mono);font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .eyebrow{font-size:9.5px}

.month{display:grid;grid-template-columns:92px 1fr;gap:16px;align-items:center}
.ring{width:92px;height:92px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .c b{font:600 19px/1 var(--display)}
.ring .c span{font-size:9.5px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;display:block;margin-top:3px}
.kv{display:flex;justify-content:space-between;gap:12px;padding-block:5px;font-size:13.5px}
.kv .num{font-size:13.5px;white-space:nowrap}

.list{display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:13px 14px;border-top:1px solid var(--line);text-align:left;width:100%}
.row:first-child{border-top:0}
button.row:active{background:var(--panel-2)}
.row .main{flex:1;min-width:0}
.row .t{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{text-align:right;flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.row .r .num{font-size:14px}
.dot{width:10px;height:10px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor;background:currentColor}
.bar{width:3px;align-self:stretch;border-radius:3px;flex:none;background:currentColor}

.chip{display:inline-flex;align-items:center;gap:5px;font:700 10px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:999px;white-space:nowrap}
.s-pagado{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent)}
.s-parcial{color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent)}
.s-atrasado{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
.s-pendiente{color:var(--idle);background:color-mix(in srgb,var(--idle) 14%,transparent)}
.s-enespera{color:var(--ion-2);background:color-mix(in srgb,var(--ion-2) 15%,transparent)}
.s-reinvertido{color:var(--reinv);background:color-mix(in srgb,var(--reinv) 15%,transparent)}
.s-liquidado{color:var(--muted);background:var(--raise)}
.tag{font:600 10px/1 var(--body);letter-spacing:.1em;text-transform:uppercase;color:var(--ion);border:1px solid rgba(70,227,198,.35);padding:3px 6px;border-radius:6px;vertical-align:2px;margin-left:6px}

.split{height:8px;border-radius:8px;background:var(--raise);overflow:hidden;display:flex;margin-top:12px}
.split i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .dot{width:8px;height:8px;box-shadow:none}

.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{height:42px;padding:0 16px;border-radius:12px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--raise);border:1px solid var(--line-2);color:var(--fg)}
.btn svg{width:17px;height:17px}
.btn.pri{background:linear-gradient(135deg,var(--ion),var(--ion-2));color:var(--ion-ink);border:0}
.btn.danger{color:var(--bad)}
.btn.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.wide{flex:1}
.seg{display:flex;background:var(--ink);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 8px;border-radius:8px;font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--raise);color:var(--fg)}
.seg.mini button{padding:5px 7px;font-size:10.5px;letter-spacing:.04em}
.seg.mini button.on.s-pendiente{background:var(--raise);color:var(--fg)}

.tbl-wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font:600 9.5px/1 var(--body);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);text-align:left;padding:12px 12px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:11px 12px;border-top:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:first-child td{border-top:0}
.ar{text-align:right}
table.tight th,table.tight td{padding-inline:8px}table.tight{font-size:12.5px}
tr.tap{cursor:pointer} tr.tap:active td{background:var(--panel-2)}

/* cars */
.cars{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 8px;scrollbar-width:none}.cars::-webkit-scrollbar{display:none}
.carc{flex:0 0 86%;scroll-snap-align:center;text-align:left;border-radius:16px;padding:16px 18px 14px;color:#EEF3F9;position:relative;overflow:hidden;
  background:radial-gradient(80% 70% at 50% 62%,rgba(79,168,255,.22),transparent 70%),linear-gradient(160deg,#1A2130,#090C12);border:1px solid rgba(255,255,255,.12);box-shadow:0 22px 40px -24px #000,0 1px 0 rgba(255,255,255,.14) inset}
.carc::before{content:"";position:absolute;inset:auto 0 0 0;height:40%;background:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 1px,transparent 1px 18px);pointer-events:none}
.carc-top{display:flex;justify-content:space-between;align-items:baseline;font:700 15px var(--display)}.carc-d{font:600 10px var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.car-def{mix-blend-mode:screen;filter:none!important;height:auto!important;aspect-ratio:560/300;object-fit:contain!important;width:72%!important;margin:2px auto 0!important;max-width:none}
.car-img{width:100%;height:150px;object-fit:contain;display:block;margin:6px 0 2px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.6))}
.car-svg{width:100%;height:auto;display:block;margin:8px 0 4px;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
.carc-bot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.carc-bot small{display:block;font:600 8.5px/1 var(--body);letter-spacing:.16em;opacity:.6;margin-bottom:5px}.carc-bot b{font:700 14px var(--display)}
.wc-house{background:linear-gradient(135deg,#3A3226,#1A1610);color:#F6EFE3}.wc-house .wc-a{color:#F2C980}
.wc-k401{background:linear-gradient(135deg,#2E2A1C,#141209);color:#F5EED9}.wc-k401 .wc-a{color:#E9C46A}
.k401c{background:radial-gradient(80% 70% at 50% 45%,rgba(70,180,255,.14),transparent 70%),linear-gradient(160deg,#1A2130,#090C12)}
.kret{text-align:center;font:600 10px/1 var(--body);letter-spacing:.14em;text-transform:uppercase;opacity:.6;margin:2px 0 10px}
.catimg{aspect-ratio:1!important;width:150px!important;mask-size:auto;height:150px!important;margin:0 auto!important;max-width:150px;-webkit-mask-image:radial-gradient(closest-side,#000 70%,transparent 100%);mask-image:radial-gradient(closest-side,#000 70%,transparent 100%);filter:drop-shadow(0 0 12px rgba(70,227,198,.35))!important}
.k67{height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.k67 span{font:800 104px/1 var(--display);letter-spacing:-.06em;background:linear-gradient(180deg,#FFF6DA,#E9C46A 55%,#8C6A2F);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(233,196,106,.35))}
.k67 small{font:700 9.5px/1 var(--body);letter-spacing:.24em;opacity:.6;margin-top:4px}
.wc-carbon{background:radial-gradient(120% 120% at 100% 0%,rgba(79,168,255,.18),transparent 55%),repeating-linear-gradient(45deg,#1B1F27 0 4px,#14171D 4px 8px);color:#EEF3F9}
.an-in .car-svg{animation:carIn 1.1s .2s cubic-bezier(.2,.8,.2,1) both}@keyframes carIn{from{opacity:0;transform:translateX(-24px);filter:blur(4px)}}
/* credit cards: stack + face */
.ccstack{display:flex;flex-direction:column}
.ccs{position:relative;display:block;width:100%;text-align:left;color:#fff;border-radius:14px;margin-top:-10px;padding:0 16px;background:radial-gradient(120% 140% at 100% 0%,rgba(255,255,255,.16),transparent 55%),linear-gradient(135deg,var(--a),var(--b));border:1px solid rgba(255,255,255,.16);box-shadow:0 -8px 20px -12px rgba(0,0,0,.8),0 1px 0 rgba(255,255,255,.22) inset}
.ccs:first-child{margin-top:0}
.ccs-h{display:flex;justify-content:space-between;align-items:center;height:62px;gap:10px}
.ccs-h span{display:flex;flex-direction:column;font:700 15px/1.15 var(--display)}.ccs-h small{font:600 9.5px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;opacity:.75;margin-bottom:4px}
.ccs-r{align-items:flex-end;text-align:right}.ccs-r b{font:700 17px var(--display)}.ccs-r small{margin:4px 0 0!important;letter-spacing:.04em!important;text-transform:none!important}
.ccf{position:relative;aspect-ratio:1.586;border-radius:16px;padding:18px 20px;color:#fff;display:flex;flex-direction:column;overflow:hidden;background:radial-gradient(120% 90% at 100% 0%,rgba(255,255,255,.2),transparent 55%),linear-gradient(135deg,var(--a),var(--b));border:1px solid rgba(255,255,255,.18);box-shadow:0 24px 40px -22px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.28) inset}
.ccf::after{content:"";position:absolute;top:-60%;left:-60%;width:50%;height:220%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent);animation:sheen 5s .4s ease-in-out infinite}
.ccf-top{display:flex;justify-content:space-between;align-items:baseline}.ccf-iss{font:700 11px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;opacity:.85}.ccf-name{font:700 15px/1 var(--display)}
.ccf-chip{width:40px;height:30px;border-radius:6px;margin-top:16px;background:linear-gradient(135deg,#F2F4F7,#A9B1BC 60%,#D7DCE2);display:grid;grid-template-rows:repeat(3,1fr);padding:4px 6px;gap:3px;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}.ccf-chip i{border-top:1px solid rgba(0,0,0,.18)}
.ccf-num{font:500 15px/1 var(--code);letter-spacing:.06em;margin-top:auto;opacity:.92;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.ccf-bot{display:flex;justify-content:space-between;margin-top:12px}.ccf-bot small{display:block;font:600 8.5px/1 var(--body);letter-spacing:.18em;opacity:.7;margin-bottom:4px}.ccf-bot b{font:700 18px/1 var(--display);letter-spacing:-.02em}
.ccf-bar{height:3px;border-radius:3px;background:rgba(255,255,255,.22);margin-top:10px;overflow:hidden}.ccf-bar i{display:block;height:100%;width:var(--w);background:#fff}
.grade{font:800 10.5px/1 var(--body);padding:4px 7px;border-radius:7px;letter-spacing:.04em;vertical-align:2px;margin-left:6px}
.gradebig{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font:800 24px var(--display);flex:none}
.g-N{color:var(--muted);background:var(--raise)}.g-A{color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}.g-B{color:var(--ion);background:color-mix(in srgb,var(--ion) 15%,transparent)}.g-C{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}.g-D{color:var(--bad);background:color-mix(in srgb,var(--bad) 15%,transparent)}
/* credit cards */
.cc-row{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;margin-inline:-16px;padding:2px 16px 8px;scrollbar-width:none}.cc-row::-webkit-scrollbar{display:none}
.cc{flex:0 0 78%;scroll-snap-align:center;aspect-ratio:1.586;border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;text-align:left;color:#fff;position:relative;overflow:hidden;
  background:radial-gradient(120% 80% at 100% 0%,rgba(255,255,255,.18),transparent 50%),linear-gradient(135deg,var(--a),var(--b));border:1px solid rgba(255,255,255,.16);box-shadow:0 18px 36px -20px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.25) inset}
.cc::after{content:"";position:absolute;inset:0;opacity:.25;background:repeating-linear-gradient(115deg,rgba(255,255,255,.05) 0 1px,transparent 1px 4px);pointer-events:none}
.cc-top{display:flex;justify-content:space-between;font:600 10px/1 var(--body);letter-spacing:.18em;text-transform:uppercase;opacity:.85}
.cc-chip{width:34px;height:25px;border-radius:5px;margin-top:14px;background:linear-gradient(135deg,#E9EDF2,#9AA3AF);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.cc-name{font:600 15px/1.2 var(--display);margin-top:auto;letter-spacing:-.01em}
.cc-bal{font:600 24px/1.1 var(--display);letter-spacing:-.04em;margin-top:2px}
.cc-bar{height:3px;border-radius:3px;background:rgba(255,255,255,.22);margin-top:8px;overflow:hidden}.cc-bar i{display:block;height:100%;width:var(--w);background:#fff}

.presets{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}

/* panel: metal card + wallet stack */
.metal{position:relative;aspect-ratio:1.586;max-width:100%;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;color:#EAF7F4;isolation:isolate;
  background:radial-gradient(120% 90% at 0% 0%,#1E5B55 0%,transparent 55%),radial-gradient(90% 80% at 100% 100%,#1C3E78 0%,transparent 60%),linear-gradient(135deg,#0F2B2E,#0B1426 60%,#080C16);
  border:1px solid rgba(255,255,255,.14);box-shadow:0 30px 60px -28px rgba(0,0,0,.9),0 0 0 1px rgba(70,227,198,.08) inset,0 1px 0 rgba(255,255,255,.18) inset}
.metal::before{content:"";position:absolute;inset:0;z-index:-1;opacity:.35;background:repeating-linear-gradient(100deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.metal::after{content:"";position:absolute;top:-60%;left:-60%;width:60%;height:220%;transform:rotate(18deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.14),transparent);animation:sheen 6s 1.2s ease-in-out infinite}

.metal-top{display:flex;align-items:center;gap:10px}.metal-logo{width:30px;height:30px;display:block}.metal-logo svg{width:100%;height:100%}

/* ============ client score ============ */
// 100 = always on time. Each day late on average costs points; partial and unpaid months cost more.
// Builds over time: needs 3 due payments before it shows a grade; recent months weigh double.
const SCORE_MIN=3;
function clientScore(bid){const items=[];db.loans.filter(l=>l.borrowerId===bid&&!l.manager).forEach(l=>periods(l,curYM()).forEach(p=>{const due=dueISO(l,p);if(due>today())return;const st=status(l,p),pay=payOf(l.id,p);
    const d=pay&&st!=='parcial'?Math.max(0,daysBetween(due,pay.date||due)):daysBetween(due,today());items.push({p,d,st})}));
  const n=items.length;if(!n)return null;if(n<SCORE_MIN)return {pending:true,n};
  items.sort((a,b)=>a.p<b.p?-1:1);let W=0,pts=0,late=0,partial=0,open=0,days=0;
  items.forEach((x,k)=>{const w=k>=n-6?2:1;let sc=100-Math.min(60,x.d*2.5);if(x.st==='parcial'){sc-=20;partial++}if(x.st==='atrasado'){sc-=35;open++}if(x.d>2)late++;days+=x.d;pts+=Math.max(0,sc)*w;W+=w});
  const score=Math.round(pts/W),grade=score>=90?'A':score>=75?'B':score>=60?'C':'D';
  return {score,grade,avg:Math.round(days/n*10)/10,onTime:Math.round((n-late)/n*100),n,partial,open}}
const scoreChip=S=>!S?'<span class="grade g-N">Nuevo</span>':S.pending?`<span class="grade g-N">Nuevo · ${S.n}/${SCORE_MIN}</span>`:`<span class="grade g-${S.grade}" title="Score ${S.score}">${S.grade} · ${S.score}</span>`;

/* ============ debt payoff plan ============ */
const SKINS={citi:['#F06A1E','#9E3A0A'],sapphire:['#163B78','#071530'],freedom:['#2A72D6','#0E3474'],student:['#1C93B4','#0B4A63'],onyx:['#2B2F38','#0E1015'],teal:['#1A6B62','#0B2E2E']};
const PRESETS=[{name:'Home Depot',issuer:'Citibank',skin:'citi',kind:'tarjeta'},{name:'Freedom Unlimited',issuer:'Chase',skin:'freedom',kind:'tarjeta'},{name:'Freedom Student',issuer:'Chase',skin:'student',kind:'tarjeta'},{name:'Sapphire',issuer:'Chase',skin:'sapphire',kind:'tarjeta'}];
const KIND_L={tarjeta:'Tarjeta',prestamo:'Préstamo',auto:'Auto',otro:'Otra deuda'};
function budget(){const st=db.settings,F=finances(),sal=+st.salary||0,exp=+st.expenses||0,orb=st.useOrbit===false?0:Math.max(0,F.net+F.cost);
  // money left each month after living expenses; card interest is handled inside the simulation
  return {sal,exp,orb,free:r2(sal-exp+orb)}}
function simulate(strategy,extraTotal){
  let ds=db.cards.filter(c=>(+c.balance||0)>0).map(c=>({id:c.id,name:c.name,bal:+c.balance,apr:+c.apr||0,promo:c.promoEnd||'',min:Math.min(+c.balance,+c.minPay||Math.max(25,(+c.balance)*.02)),paidOff:null,interest:0}));
  if(!ds.length)return {months:0,interest:0,order:[],first:[],ok:true};
  const minSum=ds.reduce((s,d)=>s+d.min,0),pay=Math.max(extraTotal,0);if(pay<minSum-0.01)return {ok:false,minSum,months:null};
  let ym=curYM(),month=0,total=0;const first={};
  const order=()=>ds.filter(d=>d.bal>0.005).sort((a,b)=>{if(strategy==='snow')return a.bal-b.bal;const ra=a.promo&&a.promo>=ym+'-31'?0:a.apr,rb=b.promo&&b.promo>=ym+'-31'?0:b.apr;
    // a promo ending within 3 months goes first so it is cleared before interest starts
    const soon=d=>d.promo&&d.promo>=ym&&d.promo<=addM(ym,3)+'-31'?1:0;if(soon(a)!==soon(b))return soon(b)-soon(a);return rb-ra||a.bal-b.bal});
  while(ds.some(d=>d.bal>0.005)&&month<600){
    ds.forEach(d=>{if(d.bal<=0)return;const r=d.promo&&d.promo>=ym+'-01'?0:d.apr;const i=d.bal*r/1200;d.bal+=i;d.interest+=i;total+=i});
    let left=pay;const live=order();
    live.forEach(d=>{const m=Math.min(d.min,d.bal);d.bal-=m;left-=m;if(month===0)first[d.id]=(first[d.id]||0)+m});
    for(const d of order()){if(left<=0)break;const x=Math.min(left,d.bal);d.bal-=x;left-=x;if(month===0)first[d.id]=(first[d.id]||0)+x}
    ds.forEach(d=>{if(d.bal<=0.005&&!d.paidOff){d.bal=0;d.paidOff=addM(ym,0)}});
    month++;ym=addM(ym,1);
  }
  return {ok:month<600,months:month,interest:r2(total),end:addM(curYM(),month-1),order:[...ds].sort((a,b)=>(a.paidOff||'9')<(b.paidOff||'9')?-1:1),first,minSum};
}
function debtPlan(){
  const B=budget(),strat=db.settings.strategy||'aval',free=B.free;
  const plan=simulate(strat,free),alt=simulate(strat==='aval'?'snow':'aval',free),mins=simulate(strat,db.cards.reduce((s,c)=>s+Math.min(+c.balance||0,+c.minPay||Math.max(25,(+c.balance||0)*.02)),0));
  const tips=[];const F=finances();
  if(!db.cards.some(c=>+c.balance>0))return {plan,tips,B,strat,none:true};
  if(!B.sal)tips.push('Agrega tu ingreso mensual del trabajo para calcular cuánto puedes pagar cada mes.');
  if(plan.ok===false)tips.push(`Con ${fmt(free)} al mes no cubres los pagos mínimos (${fmt(plan.minSum)}). Baja gastos o deja de reinvertir por un tiempo.`);
  const top=plan.order&&[...plan.order].sort((a,b)=>((plan.first[b.id]||0)-b.min)-((plan.first[a.id]||0)-a.min))[0];
  if(plan.ok&&top)tips.push(`Pon todo el dinero extra en <b>${h(top.name)}</b> y paga el mínimo en las demás.`);
  if(plan.ok&&alt.ok&&alt.interest-plan.interest>1)tips.push(`Este orden te ahorra <b>${fmt(alt.interest-plan.interest)}</b> en intereses comparado con el otro método.`);
  if(plan.ok&&mins.ok&&mins.interest-plan.interest>1)tips.push(`Pagando solo mínimos pagarías <b>${fmt(mins.interest)}</b> de intereses y tardarías ${mins.months} meses. Con este plan, ${fmt(plan.interest)} y ${plan.months} meses.`);
  db.cards.filter(c=>c.promoEnd&&c.promoEnd>=today()&&+c.balance>0).forEach(c=>{const m=Math.max(1,daysBetween(today(),c.promoEnd)/30.4|0);tips.push(`La promo 0% de <b>${h(c.name)}</b> termina el ${dLong(c.promoEnd)}. Para liquidarla antes necesitas <b>${fmt(c.balance/m)}</b> al mes.`)});
  // is lending card money worth it?
  const P=portfolio(),avgM=P.avg,o=owner();
  db.cards.filter(c=>(+c.apr||0)>0&&F.src.byCard[c.id]).forEach(c=>{const yearly=avgM*12,net=yearly-(+c.apr);tips.push(net>0?`El dinero de <b>${h(c.name)}</b> que prestas rinde ~${pct(r2(yearly))} al año contra ${pct(c.apr)} de la tarjeta: te deja ~${pct(r2(net))} neto, pero es el que más riesgo tiene. Págala primero si un cliente se atrasa.`:`El dinero de <b>${h(c.name)}</b> te cuesta más (${pct(c.apr)}) de lo que rinde prestado. Conviene pagarla ya.`)});
  return {plan,tips,B,strat,alt};
}

function viewCal(){

function animateIn(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  document.querySelectorAll('#view .an').forEach((el,k)=>{el.style.animationDelay=(k*70)+'ms';el.classList.add('an-in')});
  document.querySelectorAll('#view [data-count]').forEach(el=>{const to=+el.dataset.count,t0=performance.now(),d=1000;
    const step=now=>{const k=Math.min(1,(now-t0)/d),e=1-Math.pow(1-k,4);el.textContent=fmt(to*e);if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)});
}

const fld=(label,inner,hint='')=>`<div class="field"><label>${label}</label>${inner}${hint?`<div class="hint">${hint}</div>`:''}</div>`;
const money=(id,val='',extra='')=>`<input id="${id}" name="${id}" inputmode="decimal" type="text" value="${val===''?'':r2(val)}" placeholder="0.00" ${extra}>`;
const num=v=>{const n=parseFloat(String(v).replace(/[$,\s]/g,''));return isFinite(n)?n:0};

function readSlices(f){return [...f.querySelectorAll('#parts .slice')].map(el=>{const id=el.querySelector('[data-pi]').value,a=r2(num(el.querySelector('[data-fund]').value)),ci=el.querySelector('[data-crate]').value.trim(),ri=el.querySelector('[data-frate]').value.trim(),o=inv(id)?.owner;
  const shares=[...el.querySelectorAll('.shrow')].map(r=>({investorId:r.querySelector('[data-sp]').value,rate:num(r.querySelector('[data-sr]').value)})).filter(x=>x.rate>0&&x.investorId&&x.investorId!==id);
  return {investorId:id,amount:a,crate:ci!==''?num(ci):null,rate:!o&&ri!==''?num(ri):null,shares}}).filter(x=>x.amount>0)}
function fundHint(){
  const f=$('form[data-form=loan]');if(!f)return;
  const p=num(f.principal.value),rate=num(f.rate.value),sl=readSlices(f),lid=f.dataset.id,l=lid?loanById(lid):null;
  // per-part helpers: investor % box and available capital
  f.querySelectorAll('#parts .slice').forEach(el=>{const i=inv(el.querySelector('[data-pi]').value),fr=el.querySelector('[data-frate]');if(!i)return;
    fr.disabled=!!i.owner;fr.placeholder=i.owner?'resto':(+i.rate?String(i.rate):'%');if(i.owner)fr.value='';
    const mine=l&&!l.closed?l.funding.filter(x=>x.investorId===i.id).reduce((s,x)=>s+fBase(l,x,outNow(l)),0):0;

  if(!sl.length||(!rate&&sl.some(x=>x.crate==null))){$('#splitHint').innerHTML='<span class="muted">Escribe montos y tasas para ver el reparto.</span>';return}
  let mineT=0,totT=0;

  $('#splitHint').innerHTML=`<div class="kv" style="padding-top:0"><span>Cliente paga en total</span><span class="num">${fmt(totT)}/mes</span></div>${blocks}<div class="kv" style="border-top:1px solid var(--line-2);padding-top:8px"><b>Te queda en total</b><span class="num" style="font-weight:700;color:${mineT<0?'var(--bad)':'var(--ion)'}">${fmt(mineT)}/mes</span></div>`;
}

function sheetPayout(id,p){

    <div class="grid2 po-pay">${fld('Método',`<select id="method" name="method">${METHODS.map(m=>`<option ${(po?.method||i.payMethod||'Zelle')===m?'selected':''}>${m}</option>`).join('')}</select>`)}${fld('Enviado a',`<input id="dest" name="dest" value="${h(po?.dest||i.payDest||'')}" placeholder="Zelle, cuenta…">`)}</div>

function readDeds(){return [...document.querySelectorAll('#deds .ded')].map(r=>({concept:r.querySelector('[data-dc]').value.trim()||'Deducción',amount:r2(num(r.querySelector('[data-da]').value))})).filter(x=>x.amount>0)}
function poUpdate(){
  const f=$('form[data-form=payout]');if(!f)return;const st=f.status.value,i=inv(f.dataset.id),p=f.dataset.p;
  const gross=r2(num(f.gross.value)),ded=readDeds().reduce((s,x)=>s+x.amount,0),net=r2(gross-ded),late=daysBetween(payoutDue(i,p),f.date.value||today());
  f.querySelectorAll('.po-pay').forEach(x=>x.hidden=st!=='pagado');
  $('#poHint').innerHTML=st==='pagado'?(late>0?`<span style="color:var(--warn)">${late} días después de la fecha de pago</span>`:'A tiempo'):st==='enespera'?'El dinero se queda en tu cuenta y se suma a su capital en espera de ser prestado.':st==='reinvertido'?'Se suma a su capital para volver a prestarlo.':'Aún no le has pagado.';
  $('#poNet').innerHTML=st==='pendiente'?'<span class="muted">Sin pago registrado.</span>':`<div class="kv"><span class="muted">Rendimiento</span><span class="num">${fmt(gross)}</span></div>${readDeds().map(d=>`<div class="kv"><span class="muted">${h(d.concept)}</span><span class="num" style="color:var(--bad)">−${fmt(d.amount)}</span></div>`).join('')}<div class="kv" style="border-top:1px solid var(--line);padding-top:8px"><b>${st==='pagado'?'Pagado':'Se suma a su capital'}</b><span class="num" style="font-weight:700;color:var(--ion)">${fmt(net)}</span></div>`;
}
function savePayout(f){
  const i=inv(f.dataset.id),p=f.dataset.p,st=f.status.value,ex=payoutOf(i,p);
  if(ex){db.movements=db.movements.filter(m=>m.payoutId!==ex.id);db.payouts=db.payouts.filter(x=>x!==ex)}
  if(st!=='pendiente'){
    const gross=r2(num(f.gross.value)),deductions=readDeds(),net=r2(gross-deductions.reduce((s,x)=>s+x.amount,0)),date=f.date.value||today(),id=ex?.id||uid();
    const rec={id,investorId:i.id,period:p,amount:gross,gross,deductions,net,status:st,date,method:st==='pagado'?f.method.value:'',dest:st==='pagado'?f.dest.value.trim():'',note:f.note.value.trim()};
    db.payouts.push(rec);
    if(st==='pagado'){i.payMethod=rec.method;if(rec.dest)i.payDest=rec.dest}
    else db.movements.push({id:uid(),investorId:i.id,type:'reinversion',amount:net,date,note:(st==='enespera'?'En espera · ':'Reinvertido · ')+ymLabel(p),payoutId:id,held:st==='enespera'});
  }
  save();closeSheet();render();toast(st==='pendiente'?'Marcado pendiente':st==='pagado'?'Pago registrado':'Sumado a su capital');
}

function collectMgr(name){const ym=curYM(),ids=[];db.loans.filter(l=>l.manager===name&&!l.closed&&hasPeriod(l,ym)&&status(l,ym)!=='pagado').forEach(l=>{let pay=payOf(l.id,ym);if(!pay){pay={id:uid(),loanId:l.id,period:ym,capital:0,note:''};db.payments.push(pay)}pay.interest=expected(l,ym);pay.date=today();pay.note='Vía '+name;ids.push(l.id)});save();render();if(ids.length){toast(`${name}: ${ids.length} cobro${ids.length>1?'s':''} marcado${ids.length>1?'s':''}`);sheetOwe(ids,ym)}}

    const manager=f.manager.value.trim();if(manager){db.settings.managers=db.settings.managers||{};const md=parseInt(f.mgrDay.value,10);if(md>=1&&md<=31)db.settings.managers[manager]=md;else if(!db.settings.managers[manager])db.settings.managers[manager]=0}
    const data={manager,borrowerId:bid,principal,rate,payDay,start:f.start.value,term,funding,shares,note:f.note.value.trim()};

    else{i={id:'inv_'+uid(),name,rate,owner:false,phone:f.phone.value.trim(),note:f.note.value.trim(),...pay};db.investors.push(i);
      const a=r2(num(f.amount.value));if(a>0)db.movements.push({id:uid(),investorId:i.id,type:'aporte',amount:a,date:f.date.value||today(),note:'Aporte inicial'});

  }

/* ============ calendar reminders (.ics) ============ */
function exportICS(){
  const esc=t=>String(t).replace(/\\/g,'\\\\').replace(/[,;]/g,m=>'\\'+m).replace(/\n/g,' ');
  const t=today(),stamp=t.replace(/-/g,'')+'T120000Z';
  const next=day=>{let ym=curYM();for(let k=0;k<3;k++){const[y,m]=ym.split('-').map(Number);const d=`${ym}-${pad(Math.min(day,dim(y,m)))}`;if(d>=t)return d.replace(/-/g,'');ym=addM(ym,1)}return t.replace(/-/g,'')};
  const L=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Orbit//Prestamos//ES','CALSCALE:GREGORIAN','X-WR-CALNAME:Orbit'];
  const ev=(uidv,title,day,desc)=>{L.push('BEGIN:VEVENT','UID:'+uidv+'@orbit','DTSTAMP:'+stamp,'DTSTART:'+next(day)+'T090000','DURATION:PT30M',`RRULE:FREQ=MONTHLY;BYMONTHDAY=${day>28?-1:day}`,'SUMMARY:'+esc(title),'DESCRIPTION:'+esc(desc),'BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+esc(title),'TRIGGER:PT0M','END:VALARM','END:VEVENT')};
  let n=0;
  db.loans.filter(l=>!l.closed).forEach(l=>{ev('cobro-'+l.id,`Orbit · Cobrar a ${borName(l)} ${fmt(loanInt(l,outNow(l)))}`,+l.payDay,'Marca el cobro en Orbit');n++});
  db.investors.filter(i=>!i.owner&&monthlyNow(i)>0).forEach(i=>{const days=db.loans.filter(l=>!l.closed&&involved(l,i)).map(l=>+l.payDay);const d=+i.payDay||Math.max(...days);ev('pago-'+i.id,`Orbit · Pagar a ${i.name} ${fmt(monthlyNow(i))}`,d,'Registra el pago en Orbit');n++});
  db.cards.filter(c=>+c.dueDay&&+c.balance>0).forEach(c=>{ev('tdc-'+c.id,`Orbit · Pagar ${c.name}`,+c.dueDay,'Pago de tarjeta');n++});
  if(!n){toast('No hay préstamos activos');return}
  shareFile(new Blob([L.concat('END:VCALENDAR').join('\r\n')],{type:'text/calendar'}),'orbit-recordatorios.ics');
}

  add('Pagos a inversionistas',db.payouts.map(p=>({Persona:inv(p.investorId)?.name,Mes:ymLabel(p.period),Rendimiento:p.gross,Deducciones:(p.deductions||[]).map(d=>d.concept+' '+d.amount).join(', '),Neto:p.net,Estado:STATUS_L[p.status]||p.status,Fecha:p.date,'Método':p.method,Destino:p.dest})));
  add('Movimientos de capital',db.movements.map(m=>({Persona:inv(m.investorId)?.name,Tipo:m.type,Monto:m.amount,Fecha:m.date,Origen:m.source?(m.source==='ahorro'?'Ahorros':db.cards.find(c=>c.id===m.source)?.name||''):'',Nota:m.note||''})));
  add('Deudas',db.cards.map(c=>({Nombre:c.name,Banco:c.issuer||'',Tipo:KIND_L[c.kind||'tarjeta'],Saldo:c.balance,'APR %':c.apr,'Límite':c.limit||'','Pago mínimo':c.minPay||'','Día de pago':c.dueDay||'','Promo 0% hasta':c.promoEnd||''})));
  {const F=finances();add('Patrimonio',[{Concepto:'Ahorros en banco',Monto:F.sav},{Concepto:'Capital en Orbit',Monto:F.capOwn},{Concepto:'Carros en stock',Monto:F.cars},{Concepto:'Casa (valor)',Monto:+db.settings.houseValue||0},{Concepto:'Hipoteca',Monto:-(+db.settings.mortgage||0)},{Concepto:'401K (neto)',Monto:F.k401},{Concepto:'Me deben (sin interés)',Monto:F.owed},{Concepto:'Deudas',Monto:-F.debt},{Concepto:'Patrimonio real (sin casa)',Monto:F.worth},{Concepto:'Patrimonio con casa',Monto:F.worthAll}])}
  add('Movimientos tarjetas',db.cards.flatMap(c=>(c.txns||[]).map(t=>({Tarjeta:c.name,Tipo:t.type,Monto:t.amount,Fecha:t.date,Nota:t.note||''}))));
  const out=X.write(wb,{bookType:'xlsx',type:'array'});
  shareFile(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`Orbit-${today()}.xlsx`);
}

/* ============ files ============ */
function shareFile(blob,name){
  const file=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).catch(e=>{if(e&&e.name!=='AbortError')download(blob,name)});return;
  }
  download(blob,name);
}
function download(blob,name){const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000)}

/* ============ PDF ============ */
function pdfKit(headerRight){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'pt',format:'letter'});
  const W=612,H=792,M=44;
  const C={ink:[9,12,18],ion:[22,178,150],ionL:[70,227,198],blue:[79,168,255],fg:[17,22,30],muted:[112,122,138],faint:[165,173,186],line:[226,230,236],soft:[245,247,250],ok:[20,150,105],reinv:[110,90,220],bad:[210,70,70]};
  const k={doc,W,H,M,C,y:0};
  k.col=c=>doc.setTextColor(...c);k.fill=c=>doc.setFillColor(...c);k.draw=c=>doc.setDrawColor(...c);
  k.font=(sz,w='normal')=>{doc.setFont('helvetica',w);doc.setFontSize(sz)};
  k.T=(s,x,yy,o={})=>doc.text(String(s),x,yy,o);
  k.label=(s,x,yy,o={})=>{k.font(7.5,'bold');k.col(C.muted);k.T(s.toUpperCase(),x,yy,{charSpace:1.3,...o})};
  k.band=(full,title,sub,tag)=>{
    k.fill(C.ink);doc.rect(0,0,W,full?128:34,'F');
    if(full){k.draw([24,31,44]);doc.setLineWidth(.4);for(let x=0;x<W;x+=22)doc.line(x,0,x,128);for(let yy=0;yy<128;yy+=22)doc.line(0,yy,W,yy)}
    const by=full?128:34;for(let j=0;j<80;j++){const t=j/79;k.fill([0,1,2].map(n=>C.ionL[n]+(C.blue[n]-C.ionL[n])*t));doc.rect(j*W/80,by,W/80+.6,2.5,'F')}
