function curve(x, X0, Y0, w, h, e, col) {
  const lo = Math.min(...e), hi = Math.max(...e);
  x.beginPath(); e.forEach((v, i) => { const px = X0 + i / (e.length - 1) * w, py = Y0 + h - (v - lo) / Math.max(1, hi - lo) * h; i ? x.lineTo(px, py) : x.moveTo(px, py) });
  x.strokeStyle = col; x.lineWidth = 3; x.stroke();
}

/* ---------- 3. cuenta regresiva al próximo pago · fuego si está atrasado ---------- */
const TODAY=isoD(new Date()),CURYM=TODAY.slice(0,7);
const addM=(ym,k)=>{let[y,m]=ym.split('-').map(Number);m+=k;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return y+'-'+pad2(m)};
const dimX=(y,m)=>new Date(y,m,0).getDate(),mgrDay=n=>+((db.settings.managers||{})[n]||0);
const dueISO=(l,ym)=>{const[y,m]=ym.split('-').map(Number),d=l.manager&&mgrDay(l.manager)?mgrDay(l.manager):+l.payDay;return ym+'-'+pad2(Math.min(d||1,dimX(y,m)))};
const firstYM=l=>l.start?addM(String(l.start).slice(0,7),1):'9999-12';
const lastYM=l=>{let end=null;if(+l.term>0)end=addM(String(l.start).slice(0,7),+l.term);if(l.closed){let c=String(l.closed).slice(0,7);if(dueISO(l,c)>l.closed)c=addM(c,-1);end=end&&end<c?end:c}return end};
const periodsX=(l,until)=>{const out=[],L=lastYM(l),lim=L&&L<until?L:until;for(let p=firstYM(l);p<=lim;p=addM(p,1))out.push(p);return out};
const payOf=(id,ym)=>db.payments.find(p=>p.loanId===id&&p.period===ym);
const outBefore=(l,ym)=>Math.max(0,l.principal-db.payments.filter(p=>p.loanId===l.id&&p.period<ym).reduce((s,p)=>s+(+p.capital||0),0));
const expected=(l,ym)=>Math.round(loanInt(l,outBefore(l,ym))*100)/100;
const statusX=(l,ym)=>{const p=payOf(l.id,ym),due=expected(l,ym),paid=p?+p.interest||0:0;if(p&&paid>=due-.005)return'pagado';if(paid>0)return'parcial';return !l.manager&&dueISO(l,ym)<TODAY?'atrasado':'pendiente'};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const flameTex=glowTex([[0,'rgba(255,250,220,1)'],[.25,'rgba(255,190,60,.95)'],[.6,'rgba(255,80,10,.55)'],[1,'rgba(255,40,0,0)']]);
const FIRES=[];
function setFire(obj){const grp=new THREE.Group();obj.add(grp);const ps=[];for(let k=0;k<14;k++){const m=new THREE.SpriteMaterial({map:flameTex,transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,color:k%3?0xff8a2a:0xffd060});const s=new THREE.Sprite(m);s.userData={ph:Math.random(),x:(Math.random()-.5)*.7,z:(Math.random()-.5)*.5,sp:.6+Math.random()*.6};grp.add(s);ps.push(s)}FIRES.push(ps)}
XT.push((t,dt)=>{for(const ps of FIRES)for(const s of ps){const u=s.userData;u.ph=(u.ph+dt*u.sp)%1;const k=u.ph;s.position.set(u.x*(1-k*.6)+Math.sin(t*.006+u.x*9)*.08,.1+k*2.3,u.z*(1-k*.6));s.scale.setScalar(.85*(1-k)+.15);s.material.opacity=Math.min(1,(1-k)*1.4)*(.75+Math.random()*.25)}});
const DUE=[];
flowPts.clients.forEach(c=>{const cl=c.cl;if(!cl||!cl.id)return;const ls=db.loans.filter(l=>l.borrowerId===cl.id&&!l.closed);const items=[];
 ls.forEach(l=>periodsX(l,addM(CURYM,1)).forEach(p=>{const st=statusX(l,p);if(st==='pagado')return;const due=dueISO(l,p),py=payOf(l.id,p);const left=Math.max(0,expected(l,p)-(py?+py.interest||0:0));items.push({due,st,left,late:!l.manager&&due<TODAY})}));
 if(!items.length)return;items.sort((a,b)=>a.due<b.due?-1:1);
 const late=items.filter(x=>x.late);const room=roomOf(c.obj);const E=EARN.find(e=>e.obj===c.obj);
 const l=E?{d:document.createElement('div')}:xlabel(c.obj,2.95,'cd',()=>focus===room);
 if(E){l.d.className='cd in';E.xt=()=>l.d.outerHTML;if(c.obj.position.z<0)E.a.position.y=Math.abs(c.obj.position.x)<1?6.6:5.1}
 if(late.length){const d0=daysBetween(late[0].due,TODAY),owe=late.reduce((s,x)=>s+x.left,0);l.d.classList.add('late');if(E)E.d.classList.add('late');l.d.innerHTML=`<strong>🔥 ${d0} ${d0===1?'día':'días'} tarde</strong><i>debe ${money(owe)}</i>`;setFire(c.obj)}
 else{const nx=items.find(x=>x.due>=TODAY);if(!nx)return;DUE.push({l,E,at:new Date(nx.due+'T00:00:00').getTime(),due:nx.due,amt:nx.left})}});
const cdTick=()=>{const now=Date.now();for(const x of DUE){const ms=x.at-now;if(x.due===TODAY||ms<=0){x.l.d.classList.add('today');if(x.E)x.E.d.classList.add('today');x.l.d.innerHTML=`<strong>⏰ VENCE HOY</strong><i>${money(x.amt)}</i>`;continue}
 const s=Math.floor(ms/1000),d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),sc=s%60;x.l.d.classList.toggle('soon',d<3);if(x.E)x.E.d.classList.toggle('soon',d<3);
 x.l.d.innerHTML=`<strong>⏳ ${d?d+'d ':''}${pad2(h)}:${pad2(m)}:${pad2(sc)}</strong><i>paga ${money(x.amt)}</i>`}};
cdTick();setInterval(cdTick,1000);

{const KEY='az.fwSeen';let seen=null;try{seen=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){}
 const pays=db.payments.filter(p=>((+p.interest||0)+(+p.capital||0))>0);
 let fresh;if(!seen){fresh=pays.filter(p=>p.date===TODAY)}else{const S0=new Set(seen);fresh=pays.filter(p=>!S0.has(p.id))}
 try{localStorage.setItem(KEY,JSON.stringify(pays.map(p=>p.id).slice(-2000)))}catch(e){}

 const ob=BLD.orbit?new THREE.Box3().setFromObject(BLD.orbit.g):null;const top=ob?ob.max.y:50,cx=BLD.orbit?BLD.orbit.x:-47,cz=BLD.orbit?BLD.orbit.z:-2;
 const sparkTex=glowTex([[0,'rgba(255,255,255,1)'],[.3,'rgba(255,255,255,.8)'],[1,'rgba(255,255,255,0)']]);
 const SH=[];window.__SH=SH;const PALS=[[0x22d36a,0xffc21a],[0x00c2d6,0xff3d8b],[0xffb000,0xff4a1a],[0x8a5cff,0x22d36a]];
 function burst(x,y,z,cols){const N=220,pos=new Float32Array(N*3),col=new Float32Array(N*3),vel=[];const c0=new THREE.Color(cols[0]),c1=new THREE.Color(cols[1]);
  for(let i=0;i<N;i++){pos.set([x,y,z],i*3);const u=Math.random()*2-1,th=Math.random()*6.283,r=Math.sqrt(1-u*u),sp=34+Math.random()*16;vel.push(new THREE.Vector3(r*Math.cos(th)*sp,u*sp,r*Math.sin(th)*sp));const cc=i%2?c0:c1;col.set([cc.r,cc.g,cc.b],i*3)}
  const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.setAttribute('color',new THREE.BufferAttribute(col,3));
  const m=new THREE.PointsMaterial({size:NIGHT>.5?6.5:8,map:sparkTex,vertexColors:true,transparent:true,depthWrite:false,blending:NIGHT>.5?THREE.AdditiveBlending:THREE.NormalBlending,fog:false});const p=new THREE.Points(geo,m);S.add(p);SH.push({kind:'b',p,vel,age:0})}
 function shell(delay,cols){const m=new THREE.Sprite(new THREE.SpriteMaterial({map:sparkTex,color:cols[0],transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,fog:false}));m.scale.setScalar(3.2);m.visible=false;S.add(m);
  const tx=cx+(Math.random()-.5)*26,tz=cz+(Math.random()-.5)*18,ty=top*.7+Math.random()*top*.3;SH.push({kind:'s',m,delay,age:0,from:new THREE.Vector3(cx+(Math.random()-.5)*6,top*.4,cz),to:new THREE.Vector3(tx,ty,tz),cols})}
 XT.push((t,dt)=>{dt=Math.min(dt,.05)*(window.__fwSpeed||1);for(let k=SH.length-1;k>=0;k--){const s=SH[k];
  if(s.kind==='s'){s.delay-=dt;if(s.delay>0)continue;s.m.visible=true;s.age+=dt/1.1;const e=1-Math.pow(1-Math.min(1,s.age),2);s.m.position.lerpVectors(s.from,s.to,e);if(s.age>=1){S.remove(s.m);s.m.material.dispose();SH.splice(k,1);burst(s.to.x,s.to.y,s.to.z,s.cols)}continue}
  s.age+=dt;const a=s.p.geometry.attributes.position;for(let i=0;i<s.vel.length;i++){const v=s.vel[i];v.multiplyScalar(1-1.3*dt);v.y-=7*dt;a.array[i*3]+=v.x*dt;a.array[i*3+1]+=v.y*dt;a.array[i*3+2]+=v.z*dt}a.needsUpdate=true;
  s.p.material.opacity=Math.max(0,1-s.age/2.6);if(s.age>2.6){S.remove(s.p);s.p.geometry.dispose();s.p.material.dispose();SH.splice(k,1)}}});
 const toast=document.createElement('div');toast.className='fwt';document.body.appendChild(toast);

 window.__fireworks=(n=3)=>{for(let i=0;i<n;i++)shell(i*.45,PALS[(i+SH.length)%PALS.length])};
 if(fresh.length){let at=2600;fresh.forEach((p,i)=>{const l=db.loans.find(x=>x.id===p.loanId)||{};const amt=(+p.interest||0)+(+p.capital||0);
